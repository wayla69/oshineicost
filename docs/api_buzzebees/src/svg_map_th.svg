    <path d="M284 112H396" marker-end="url(#map-arrow)"/>
    <path d="M284 232H340V144H396" marker-end="url(#map-arrow)"/>
    <path d="M284 320H356V288H396" marker-end="url(#map-arrow)"/>
    <path d="M284 408H340V372H396" marker-end="url(#map-arrow)"/>
  </g>
  <rect x="380" y="60" width="356" height="364" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="558" y="84" text-anchor="middle" font-weight="600" fill="#141414">Buzzebees</text>
  <rect x="396" y="100" width="324" height="56" rx="8" fill="#1f4e8c" fill-opacity="0.10" stroke="#1f4e8c" stroke-width="2"/>
  <text x="558" y="124" text-anchor="middle" font-weight="600" fill="#141414">API สำหรับ POS (/pos/v1)</text>
  <text x="558" y="144" text-anchor="middle" font-size="11.5" fill="#141414">รับคำขอ B0–B9 · ตรวจสอบคีย์ API · ป้องกันรายการซ้ำ</text>
  <rect x="396" y="176" width="324" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="558" y="200" text-anchor="middle" font-weight="600" fill="#141414">ฐานข้อมูลสมาชิก คะแนน และคูปอง</text>
  <text x="558" y="220" text-anchor="middle" font-size="11.5" fill="#5a5a5a">เงื่อนไขคะแนน · คูปอง · ประวัติรายการ</text>
  <rect x="396" y="252" width="324" height="72" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="558" y="276" text-anchor="middle" font-weight="600" fill="#141414">LINE OA (CRM PLUS)</text>
  <text x="558" y="296" text-anchor="middle" font-size="11.5" fill="#5a5a5a">การสมัครสมาชิก · ความยินยอมตาม PDPA</text>
  <text x="558" y="312" text-anchor="middle" font-size="11.5" fill="#5a5a5a">QR สมาชิก · การสแกน QR บนใบเสร็จรับเงิน</text>
  <rect x="396" y="344" width="324" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="558" y="368" text-anchor="middle" font-weight="600" fill="#141414">รายงานและการกระทบยอด</text>
  <text x="558" y="388" text-anchor="middle" font-size="11.5" fill="#5a5a5a">รายการรายวัน earn / burn / coupon / void</text>

  <rect x="24" y="60" width="260" height="120" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="36" y="84" font-weight="600" fill="#141414">Easy POS · เครื่อง POS ประมาณ 35 สาขา</text>
  <text x="36" y="104" font-size="11.5" fill="#5a5a5a">B0 ตรวจสอบการเชื่อมต่อ · B1 ค้นหาสมาชิก</text>
  <text x="36" y="120" font-size="11.5" fill="#5a5a5a">B2 ตรวจสอบสิทธิ์คูปอง · B3 ใช้สิทธิ์คูปอง</text>
  <text x="36" y="136" font-size="11.5" fill="#5a5a5a">B4 แลกคะแนน · B5 สะสมคะแนน</text>
  <text x="36" y="152" font-size="11.5" fill="#5a5a5a">B6 ยกเลิกรายการ · B8 สอบถามสถานะ</text>
