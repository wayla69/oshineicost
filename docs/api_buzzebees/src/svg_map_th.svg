  <rect x="24" y="204" width="260" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="36" y="228" font-weight="600" fill="#141414">Easy HQ · สำนักงานใหญ่</text>
  <text x="36" y="248" font-size="11.5" fill="#5a5a5a">B7 ส่งข้อมูลสาขาและเมนู วันละหนึ่งครั้ง</text>
  <rect x="24" y="284" width="260" height="72" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="36" y="308" font-weight="600" fill="#141414">ลูกค้า (ผ่าน LINE)</text>
  <text x="36" y="328" font-size="11.5" fill="#5a5a5a">สมัครสมาชิกและรับ QR สมาชิก</text>
  <text x="36" y="344" font-size="11.5" fill="#5a5a5a">สแกน QR บนใบเสร็จเพื่อรับคะแนน</text>
  <rect x="24" y="380" width="260" height="56" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
  <text x="36" y="404" font-weight="600" fill="#141414">ระบบรายงาน Oshinei</text>
  <text x="36" y="424" font-size="11.5" fill="#5a5a5a">B9 ดึงรายงานการกระทบยอด ทุกวัน 06:00 น.</text>

  <text x="340" y="104" text-anchor="middle" font-size="11.5" fill="#5a5a5a">B0–B6, B8</text>
  <text x="346" y="194" font-size="11.5" fill="#5a5a5a">B7</text>
  <text x="362" y="306" font-size="11.5" fill="#5a5a5a">LINE</text>
  <text x="346" y="370" font-size="11.5" fill="#5a5a5a">B9</text>
</svg>
