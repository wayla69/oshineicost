<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'KIRA UI',sans-serif" font-size="13">
  <defs><marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker></defs>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#141414">API ทุกลำดับเรียกใช้ไปยัง Buzzebees: Easy POS 8 ลำดับ Easy HQ 1 ลำดับ Oshinei 1 ลำดับ</text>
