# fly.toml — Oshinei Dashboard + Revenue Reconciliation
# Both services share the same oshinei_data volume and oshinei.db file.
#
# Dashboard  →  https://oshinei-dashboard.fly.dev        (port 443)
# Recon app  →  https://oshinei-dashboard.fly.dev:8443   (port 8443)

app            = "oshinei-dashboard"
primary_region = "sin"

[build]

# Two processes from the same Docker image
[processes]
  dashboard = "uvicorn backend.main:app --host 0.0.0.0 --port 8080"
  recon     = "uvicorn recon.main:app  --host 0.0.0.0 --port 8001"

[env]
  OSHINEI_DB = "/data/oshinei.db"

# Single persistent volume shared by both processes
[[mounts]]
  source      = "oshinei_data"
  destination = "/data"

# ── Dashboard service ──────────────────────────────────────────────────────────
[[services]]
  processes            = ["dashboard"]
  internal_port        = 8080
  protocol             = "tcp"
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["http"]
    port     = 80
  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

# ── Reconciliation service ─────────────────────────────────────────────────────
[[services]]
  processes            = ["recon"]
  internal_port        = 8001
  protocol             = "tcp"
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 8443

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
