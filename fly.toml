# fly.toml — Oshinei Dashboard + Revenue Reconciliation
# ONE machine runs both apps (Dockerfile start.sh) so they share the single
# oshinei_data volume and oshinei.db file — a Fly volume attaches to only one
# machine, so the two apps cannot be split into separate process groups.
#
# Dashboard  →  https://oshinei-dashboard.fly.dev        (port 443  → :8080)
# Recon app  →  https://oshinei-dashboard.fly.dev:8443   (port 8443 → :8001)

app            = "oshinei-dashboard"
primary_region = "sin"

[build]

[env]
  OSHINEI_DB = "/data/oshinei.db"
  PORT       = "8080"

# Single persistent volume, single machine
[[mounts]]
  source      = "oshinei_data"
  destination = "/data"

# ── Dashboard service (default process group) ──────────────────────────────────
# min_machines_running = 1 → eliminates ~7s cold-start on first hit after idle.
# Always-on; both services point at the same
# single machine, so this keeps recon warm too.
[[services]]
  internal_port        = 8080
  protocol             = "tcp"
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port     = 80
  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

# ── Reconciliation service (same machine, port 8001) ──────────────────────────
[[services]]
  internal_port        = 8001
  protocol             = "tcp"
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 8443

[[vm]]
# 2026-10-01: 2 shared cores + 2 GB (was 1x / 1 GB, ~+$7/mo list in sin). 2 GB keeps the
# 1.26 GB SQLite file mostly in page cache; the 2nd core keeps recon and light requests
# quick while core.ttl_cache runs its one heavy report (OSHINEI_HEAVY_CONCURRENCY=1).
  size   = "shared-cpu-2x"
  memory = "2048mb"   # two apps share one machine (dashboard matplotlib + recon openpyxl)
