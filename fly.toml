# fly.toml — Oshinei Dashboard + Revenue Reconciliation
# One machine, one process. The reconciliation app is mounted at /recon inside
# the dashboard (backend/main.py), so both are served on the standard 443 port
# and share the single oshinei_data volume / oshinei.db.
#
# Dashboard  →  https://oshinei-dashboard.fly.dev/
# Recon app  →  https://oshinei-dashboard.fly.dev/recon/app/

app            = "oshinei-dashboard"
primary_region = "sin"

[build]

[env]
  OSHINEI_DB = "/data/oshinei.db"
  PORT       = "8080"

# Single persistent volume, single machine
[[mounts]]
  source      = "oshinei_data"
  destination = "/data"

# ── Dashboard service (default process group) ──────────────────────────────────
[[services]]
  internal_port        = 8080
  protocol             = "tcp"
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["http"]
    port     = 80
  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

[[vm]]
  size   = "shared-cpu-1x"
  memory = "1024mb"   # two apps share one machine (dashboard matplotlib + recon openpyxl)
