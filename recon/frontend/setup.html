<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตั้งค่าระบบกระทบยอด — Oshinei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* โทนเดียวกับหน้า v2 (index.html) */
:root{
  --brand:#0F6E56;--brand-deep:#0a523f;--brand-soft:#e6f4ef;
  --ok:#047857;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fffbeb;
  --err:#b91c1c;--err-bg:#fef2f2;--info:#1d4ed8;--info-bg:#eff6ff;
  --bg:#f0f4f8;--card:#fff;--line:#e2e8f0;--line-soft:#f1f5f9;
  --txt:#0f172a;--sub:#475569;--mut:#94a3b8;
  --shadow:0 1px 3px rgba(15,23,42,.04),0 2px 10px rgba(15,23,42,.05)}
*{box-sizing:border-box;margin:0}
body{font-family:'Inter','Noto Sans Thai','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--txt);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:20px 18px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
h2{font-size:15.5px;font-weight:600;margin-bottom:8px}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.muted{color:var(--sub);font-size:12.5px}
.lbl{font-size:11.5px;color:var(--mut);font-weight:500}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
  padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-err{background:var(--err-bg);color:var(--err)}
.c-mut{background:var(--line-soft);color:var(--sub)}
.c-setup{background:var(--info-bg);color:var(--info)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;
  cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;color:var(--txt)}
.btn:hover{background:var(--line-soft)}
.btn-pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-pri:hover{background:var(--brand-deep)}
.btn-sm{font-size:12px;padding:4px 10px}
table{border-collapse:collapse;width:100%}
td,th{padding:7px 9px;font-size:12.5px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{font-size:11px;font-weight:600;color:var(--mut);white-space:nowrap}
td.num,th.num{text-align:right}
select,input[type=text],input[type=number]{font-family:inherit;font-size:12.5px;color:var(--txt);
  padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:#fff}
input[type=number]{width:70px;text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;
  color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;opacity:0;
  transition:opacity .3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.code{font-weight:600}
.scroll{overflow-x:auto}
.docchip{font-size:11px;padding:1px 8px;border-radius:6px;display:inline-block;margin:1px 2px 1px 0}
.d-up{background:var(--ok-bg);color:var(--ok)}
.d-miss{background:var(--warn-bg);color:var(--warn)}
.params .lbl{display:inline-block;min-width:0}
@media (max-width:760px){.wrap{padding:10px 8px 40px} td,th{padding:6px 6px;font-size:11.5px}}
</style>
</head>
<body>
<div class="wrap" id="app">กำลังโหลด…</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>(n==null?'—':Math.round(n).toLocaleString('th-TH'));
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}
function tokenHdr(){const t=(localStorage.getItem('oshinei_token')||'').trim();return t?{'X-Upload-Token':t}:{};}
function setToken(){
  let t=prompt('รหัสสำหรับบันทึกข้อมูล (Write token) — เว้นว่างเพื่อล้าง:',localStorage.getItem('oshinei_token')||'');
  if(t===null)return; t=t.trim();
  t?localStorage.setItem('oshinei_token',t):localStorage.removeItem('oshinei_token');
  toast(t?'บันทึกรหัสแล้ว':'ล้างรหัสแล้ว');
}
function mgrHdr(){const c=sessionStorage.getItem('mgr_code')||'';return c?{'X-Manager-Token':c}:{};}
async function api(path,opts={}){
  opts.headers={...(opts.headers||{}),...tokenHdr()};
  if(opts.body && !(opts.body instanceof FormData)){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}
  const r=await fetch(path,opts);
  if(!r.ok){let d='';try{d=(await r.json()).detail||''}catch(e){};throw new Error(d||('HTTP '+r.status));}
  return r.json();
}
// เรียก endpoint ที่ต้องใช้รหัสผู้จัดการ — ถ้า 403 ถามรหัสแล้วลองใหม่หนึ่งครั้ง
async function mgrApi(path,opts={}){
  for(let attempt=0;attempt<2;attempt++){
    try{return await api(path,{...opts,headers:{...(opts.headers||{}),...mgrHdr()}});}
    catch(e){
      if(!String(e.message).includes('ผู้จัดการ')||attempt===1)throw e;
      const code=prompt('การตั้งค่าขั้นสูงต้องใช้รหัสผู้จัดการ:')||'';
      if(!code)throw new Error('ยกเลิก — ไม่ได้ใส่รหัสผู้จัดการ');
      sessionStorage.setItem('mgr_code',code);
    }
  }
}

let MONTH=localStorage.getItem('v2_month')||new Date().toISOString().slice(0,7);
let M=null;          // /api/setup/master payload
let FILTER='all';

const CATS=['CASH','QR','TRANSFER','CREDIT','GRAB','LINEMAN','COUPON','ENTERTAIN','OTHER'];
const BANKS=['KTB','KBANK','KTC','BAY','SCB','BBL','TTB','PROMPTPAY','ANY','NONE','UNKNOWN'];
const ST_CHIP={ok:['c-ok','✓ พร้อม'],needs_bank:['c-err','⚠ ระบุธนาคาร'],dormant:['c-mut','พักใช้ (฿0)'],off:['c-mut','ไม่กระทบยอด']};
const DOC_TH={deposit_slip:'สลิปนำฝาก',cc_summary:'สรุปยอดบัตร',grab_report:'รายงาน Grab',
  lineman_report:'รายงาน Line Man',points_summary:'สรุปคะแนน',
  'bank_stmt_KTB':'สเตทเมนต์ KTB','bank_stmt_KBANK':'สเตทเมนต์ KBANK','bank_stmt_*':'สเตทเมนต์ธนาคาร'};

async function load(){
  $('app').innerHTML=header()+'<div class="muted">กำลังโหลด…</div>';
  try{M=await api(`/api/setup/master?period_month=${MONTH}`);}
  catch(e){$('app').innerHTML=header()+`<div class="card c-err">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`;return;}
  render();
}
function setMonth(m){MONTH=m;localStorage.setItem('v2_month',m);load();}
function setFilter(f){FILTER=f;render();}

function header(){
  return `<div class="row" style="margin-bottom:16px">
    <div class="row" style="gap:9px;flex-wrap:nowrap">
      <div style="width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:17px;flex:none">⚙</div>
      <div><h1 style="line-height:1.2">ตั้งค่าระบบกระทบยอด</h1>
        <div class="lbl">ตารางจับคู่รหัสรับเงิน (ขั้นสูง — ทุกรหัสในตารางเดียว)</div></div>
    </div>
    <input type="month" value="${MONTH}" onchange="setMonth(this.value)"
      style="padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff">
    <button class="btn btn-sm" style="margin-left:auto" onclick="setToken()" title="รหัสสำหรับบันทึก">🔑 รหัส</button>
    <a href="/app/" style="font-size:13px">← กลับหน้ากระทบยอด</a>
  </div>`;
}

function docChips(r){
  const m=r.method, ds=r.doc_status||{};
  const chips=[];
  for(const k of ['doc1','doc2']){
    if(!m[k])continue;
    const up=ds[k]==='uploaded';
    chips.push(`<span class="docchip ${up?'d-up':'d-miss'}" title="${up?'มีเอกสารเดือนนี้แล้ว':'ยังไม่มีเอกสารเดือนนี้'}">${up?'✓':'…'} ${esc(DOC_TH[m[k]]||m[k])}</span>`);
  }
  return chips.join('')||'<span class="lbl">—</span>';
}
function paramTxt(m){
  if(!m.method)return '<span class="lbl">—</span>';
  const p=[];
  if(m.tol_abs_day!=null)p.push(`±฿${fmt(m.tol_abs_day)}/วัน`);
  if(m.tol_abs!=null)p.push(`±฿${fmt(m.tol_abs)}/เดือน`);
  if(m.lag_days!=null)p.push(`เงินเข้าช้าได้ ${m.lag_days} วัน`);
  if(m.merge_days!=null&&m.merge_days>1)p.push(`รวมได้ ${m.merge_days} วัน`);
  if(m.fee_vat_expected)p.push('<span class="chip c-warn">มีค่าธรรมเนียม+VAT</span>');
  return p.join(' · ')||'<span class="lbl">ค่ามาตรฐาน</span>';
}

function render(){
  const rows=M.rows.filter(r=>{
    if(FILTER==='attention')return r.status==='needs_bank';
    if(FILTER==='active')return r.status==='ok';
    return true;
  });
  let html=header();

  // ตาราง 1: master table
  html+=`<div class="card"><div class="row" style="margin-bottom:8px">
    <h2 style="margin:0">① ตารางจับคู่รหัสรับเงิน</h2>
    <span class="lbl">${M.rows.length} รหัส · เดือน ${MONTH}</span>
    <div class="row" style="margin-left:auto;gap:6px">
      ${['all|ทั้งหมด','attention|⚠ ต้องระบุธนาคาร','active|ใช้งานอยู่'].map(x=>{
        const [k,t]=x.split('|');
        return `<button class="btn btn-sm" style="${FILTER===k?'background:var(--brand-soft);border-color:var(--brand)':''}" onclick="setFilter('${k}')">${t}</button>`;}).join('')}
      <button class="btn btn-sm" onclick="reseedPos()">Seed จากข้อมูล POS</button>
      <button class="btn btn-sm" onclick="seedRequirement()" title="ใส่ค่าตามตารางเจ้าของ (ไม่ทับค่าที่แก้เอง)">ใช้ค่าตามตารางเจ้าของ</button>
    </div></div>
  <div class="scroll"><table>
    <tr><th>รหัส POS</th><th>ประเภท</th><th>ธนาคารปลายทาง</th><th>เอกสารที่ใช้ตรวจ</th>
        <th>วิธีกระทบยอด</th><th>พารามิเตอร์</th><th class="num">ยอด POS</th>
        <th>กระทบ</th><th>สถานะ</th></tr>
    ${rows.map((r,i)=>{
      const [cls,lab]=ST_CHIP[r.status]||['c-mut',r.status];
      return `<tr>
        <td class="code">${esc(r.payment_code_norm)}</td>
        <td><select onchange="saveMap(${r.id},this,'category')">
          ${CATS.map(c=>`<option ${c===r.category?'selected':''}>${c}</option>`).join('')}</select></td>
        <td><select onchange="saveMap(${r.id},this,'bank')" style="${r.status==='needs_bank'?'border-color:var(--err)':''}">
          ${BANKS.map(b=>`<option ${b===r.bank?'selected':''}>${b}</option>`).join('')}</select></td>
        <td>${docChips(r)}</td>
        <td>${r.method.method?`<span title="${esc(r.method.method)}">${esc(r.method.method_label||'')}</span>
          <div class="lbl">lane ${esc(r.category)}·${esc(r.method.lane_bank||'*')}
          ${r.method.id?`<a href="#" onclick="editLane(${r.method.id});return false">แก้ไข ▸</a>`:''}</div>`
          :'<span class="lbl">—</span>'}</td>
        <td class="params">${paramTxt(r.method)}</td>
        <td class="num mono" title="${r.pos_txn} รายการ">${fmt(r.pos_amount)}</td>
        <td><input type="checkbox" ${r.reconcile?'checked':''} onchange="saveMap(${r.id},this,'reconcile')"
             title="ติ๊กออก = ไม่นำมากระทบยอด (เช่น Entertain)"></td>
        <td><span class="chip ${cls}">${lab}</span></td>
      </tr>`;}).join('')}
  </table></div>
  <div class="muted" style="margin-top:6px">แก้ประเภท/ธนาคารของรหัส = สิทธิ์พนักงาน (🔑) ·
    แก้วิธี/พารามิเตอร์ของ lane = ต้องใช้รหัสผู้จัดการ และมีผลกับทุกรหัสใน lane เดียวกัน</div>
  <div id="lane-editor"></div></div>`;

  // ตาราง 2: lane method configs
  html+=`<div class="card"><h2>② วิธีกระทบยอดราย lane (ประเภท × ธนาคาร)</h2>
  <div class="scroll"><table>
    <tr><th>Lane</th><th>เอกสาร 1</th><th>เอกสาร 2</th><th>วิธี</th>
        <th class="num">tol/วัน</th><th class="num">tol/เดือน</th>
        <th class="num">lag</th><th class="num">รวมวัน</th><th>fee+VAT</th><th>หมายเหตุ</th><th></th></tr>
    ${M.method_configs.map(c=>`<tr>
      <td class="code">${esc(c.category)}·${esc(c.bank)}</td>
      <td>${esc(DOC_TH[c.doc1]||c.doc1||'—')}</td><td>${esc(DOC_TH[c.doc2]||c.doc2||'—')}</td>
      <td title="${esc(c.method)}">${esc(c.method)}</td>
      <td class="num mono">${c.tol_abs_day==null?'—':fmt(c.tol_abs_day)}</td>
      <td class="num mono">${c.tol_abs==null?'—':fmt(c.tol_abs)}</td>
      <td class="num mono">${c.lag_days==null?'—':c.lag_days}</td>
      <td class="num mono">${c.merge_days==null?'—':c.merge_days}</td>
      <td>${c.fee_vat_expected?'<span class="chip c-warn">มี</span>':'<span class="lbl">—</span>'}</td>
      <td class="lbl" style="max-width:260px">${esc(c.notes||'')}</td>
      <td><button class="btn btn-sm" onclick="editLane(${c.id})">แก้ไข</button></td>
    </tr>`).join('')}
  </table></div>
  <div class="muted" style="margin-top:6px">tol ว่าง = ใช้ค่ากลาง (รายวัน ±฿${fmt(M.globals.TOL_ABS_DAY)} หรือ ${M.globals.TOL_PCT_DAY}% · รายเดือน ±฿${fmt(M.globals.TOL_ABS)} หรือ ${M.globals.TOL_PCT}%) ·
    tol ที่กำหนดเอง = เป๊ะตามจำนวนบาท (ไม่มี % ช่วย) · ${M.manager_required?'ต้องใช้รหัสผู้จัดการ':'เซิร์ฟเวอร์นี้ยังไม่ตั้งรหัสผู้จัดการ (แก้ได้เลย)'}</div>
  </div>`;

  // ตาราง 3: บัญชีธนาคาร
  html+=`<div class="card"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">③ บัญชีธนาคารของสาขา</h2>
    <button class="btn btn-sm" style="margin-left:auto" onclick="addAccount()">+ เพิ่มบัญชี</button></div>
  <div class="scroll"><table>
    <tr><th>สาขา</th><th>ธนาคาร</th><th>เลขบัญชี</th><th>ชื่อบัญชี</th><th>ใช้งาน</th><th></th></tr>
    ${M.bank_accounts.map(a=>`<tr>
      <td>${esc(a.branch_name)}</td><td>${esc(a.bank)}</td>
      <td class="mono">${esc(a.account_no)}</td><td>${esc(a.account_name||'')}</td>
      <td>${a.active?'✓':'—'}</td>
      <td><button class="btn btn-sm" style="color:var(--err)" onclick="delAccount(${a.account_id})">ลบ</button></td>
    </tr>`).join('')||'<tr><td colspan="6" class="muted">ยังไม่มีบัญชี — ระบบใช้เลขบัญชีจับเอกสารเข้าสาขาอัตโนมัติ</td></tr>'}
  </table></div></div>`;

  // ตาราง 4: MIDs
  html+=`<div class="card"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">④ MID เครื่องรูดบัตร / คะแนน</h2>
    <button class="btn btn-sm" style="margin-left:auto" onclick="addMid()">+ เพิ่ม MID</button></div>
  <div class="scroll"><table>
    <tr><th>สาขา</th><th>ผู้รับบัตร</th><th>Merchant ID</th><th>Terminal</th><th>ใช้งาน</th><th></th></tr>
    ${M.acquirer_mids.map(m=>`<tr>
      <td>${esc(m.branch_name)}</td><td>${esc(m.acquirer)}</td>
      <td class="mono">${esc(m.merchant_id||'')}</td><td class="mono">${esc(m.terminal_id||'')}</td>
      <td>${m.active?'✓':'—'}</td>
      <td><button class="btn btn-sm" style="color:var(--err)" onclick="delMid(${m.mid_id})">ลบ</button></td>
    </tr>`).join('')||'<tr><td colspan="6" class="muted">ยังไม่มี MID</td></tr>'}
  </table></div>
  <div class="muted" style="margin-top:6px">MID แบบ KTCPOINT / BAYPOINT ใช้แยกแถวแต้มออกจากใบสรุปบัตร — จำเป็นต่อช่องทางคูปอง (แต้ม KTC/BAY)</div></div>`;

  $('app').innerHTML=html;
}

/* ── แก้รหัส (payment map) — สิทธิ์พนักงาน ── */
async function saveMap(id,el,field){
  const r=M.rows.find(x=>x.id===id);
  const body={category:r.category,bank:r.bank,reconcile:r.reconcile,notes:r.notes||''};
  body[field]=field==='reconcile'?(el.checked?1:0):el.value;
  try{await api(`/api/payment-map/${id}`,{method:'PATCH',body});
      toast(`บันทึก ${r.payment_code_norm} แล้ว`);load();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);load();}
}

/* ── แก้ lane method — ต้องรหัสผู้จัดการ ── */
function editLane(cfgId){
  const c=M.method_configs.find(x=>x.id===cfgId);
  if(!c)return;
  const box=$('lane-editor');
  const docs1=['','deposit_slip','cc_summary','grab_report','lineman_report','points_summary'];
  const docs2=['','bank_stmt_KTB','bank_stmt_KBANK','bank_stmt_*'];
  const methods=['direct','two_stage','cash_3way','itemized','issuer_points'];
  box.innerHTML=`<div class="card" style="background:#fafcff;border-color:var(--info);margin-top:10px">
    <div class="row"><b>แก้ lane ${esc(c.category)}·${esc(c.bank)}</b>
      <span class="chip c-setup">มีผลกับทุกรหัสใน lane นี้ · ต้องใช้รหัสผู้จัดการ</span>
      <a href="#" class="lbl" style="margin-left:auto" onclick="$('lane-editor').innerHTML='';return false">ปิด</a></div>
    <div class="row" style="margin-top:8px;gap:14px">
      <label class="lbl">เอกสาร 1<br><select id="le-doc1">${docs1.map(d=>`<option value="${d}" ${d===(c.doc1||'')?'selected':''}>${d?DOC_TH[d]||d:'—'}</option>`).join('')}</select></label>
      <label class="lbl">เอกสาร 2<br><select id="le-doc2">${docs2.map(d=>`<option value="${d}" ${d===(c.doc2||'')?'selected':''}>${d?DOC_TH[d]||d:'—'}</option>`).join('')}</select></label>
      <label class="lbl">วิธี<br><select id="le-method">${methods.map(m=>`<option ${m===c.method?'selected':''}>${m}</option>`).join('')}</select></label>
      <label class="lbl">tol/วัน (บาท)<br><input type="number" id="le-tday" step="1" min="0" value="${c.tol_abs_day==null?'':c.tol_abs_day}" placeholder="ค่ากลาง"></label>
      <label class="lbl">tol/เดือน (บาท)<br><input type="number" id="le-tmon" step="1" min="0" value="${c.tol_abs==null?'':c.tol_abs}" placeholder="ค่ากลาง"></label>
      <label class="lbl">เงินเข้าช้าได้ (วัน 0–14)<br><input type="number" id="le-lag" step="1" min="0" max="14" value="${c.lag_days==null?'':c.lag_days}"></label>
      <label class="lbl">รวมได้กี่วัน (1–7)<br><input type="number" id="le-merge" step="1" min="1" max="7" value="${c.merge_days==null?'':c.merge_days}"></label>
      <label class="lbl">มีค่าธรรมเนียม+VAT<br><input type="checkbox" id="le-fee" ${c.fee_vat_expected?'checked':''}></label>
    </div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="le-notes" value="${esc(c.notes||'')}" placeholder="หมายเหตุ" style="flex:1;min-width:200px">
      <button class="btn btn-pri btn-sm" onclick="saveLane(${c.id})">บันทึก (ผู้จัดการ)</button>
    </div></div>`;
  box.scrollIntoView({behavior:'smooth',block:'center'});
}
async function saveLane(cfgId){
  const c=M.method_configs.find(x=>x.id===cfgId);
  const v=id=>{const x=$(id).value.trim();return x===''?null:+x;};
  const body={category:c.category,bank:c.bank,
    doc1:$('le-doc1').value||null,doc2:$('le-doc2').value||null,
    method:$('le-method').value,
    tol_abs_day:v('le-tday'),tol_abs:v('le-tmon'),
    lag_days:v('le-lag'),merge_days:v('le-merge'),
    fee_vat_expected:$('le-fee').checked?1:0,
    notes:$('le-notes').value};
  try{await mgrApi(`/api/method-config/${cfgId}`,{method:'PATCH',body});
      toast('บันทึก lane แล้ว');load();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── seeds ── */
async function reseedPos(){
  try{const r=await api('/api/payment-map/seed',{method:'POST'});
      toast(`เพิ่มรหัสใหม่ ${r.inserted} รหัส`);load();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function seedRequirement(){
  if(!confirm('ใส่ค่าตามตารางเจ้าของ (Requirement)?\nรหัส/lane ที่แก้เองไว้จะไม่ถูกทับ'))return;
  try{const r=await mgrApi('/api/setup/seed-requirement',{method:'POST'});
      toast(`อัปเดต ${r.codes.upgraded+r.codes.inserted} รหัส, ${r.methods.inserted} lane`);load();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── บัญชีธนาคาร / MID ── */
async function addAccount(){
  let brs;try{brs=await api('/api/branches');}catch(e){toast(e.message);return;}
  const pick=prompt(`สาขา? พิมพ์หมายเลข:\n${brs.map(b=>`${b.branch_id}=${b.name}`).join('  ')}`);
  if(pick===null)return;
  const bid=parseInt(pick.trim());
  if(!brs.some(b=>b.branch_id===bid)){toast('หมายเลขสาขาไม่ถูกต้อง');return;}
  const bank=prompt('ธนาคาร (KTB หรือ KBANK):','KBANK');if(bank===null)return;
  const no=prompt('เลขบัญชี:');if(!no)return;
  const name=prompt('ชื่อบัญชี (ไม่บังคับ):')||'';
  try{await api('/api/bank-accounts',{method:'POST',body:{branch_id:bid,bank:bank.trim().toUpperCase(),account_no:no.trim(),account_name:name}});
      toast('เพิ่มบัญชีแล้ว');load();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function delAccount(id){
  if(!confirm('ลบบัญชีนี้?'))return;
  try{await api(`/api/bank-accounts/${id}`,{method:'DELETE'});toast('ลบแล้ว');load();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function addMid(){
  let brs;try{brs=await api('/api/branches');}catch(e){toast(e.message);return;}
  const pick=prompt(`สาขา? พิมพ์หมายเลข:\n${brs.map(b=>`${b.branch_id}=${b.name}`).join('  ')}`);
  if(pick===null)return;
  const bid=parseInt(pick.trim());
  if(!brs.some(b=>b.branch_id===bid)){toast('หมายเลขสาขาไม่ถูกต้อง');return;}
  const acq=prompt('ผู้รับบัตร (KTB/KBANK/KTC/BAY/SCB/BBL/KTCPOINT/BAYPOINT):','KTC');if(acq===null)return;
  const mid=prompt('Merchant ID:')||'';
  const term=prompt('Terminal ID (ไม่บังคับ):')||'';
  try{await api('/api/acquirer-mids',{method:'POST',body:{branch_id:bid,acquirer:acq.trim().toUpperCase(),merchant_id:mid.trim(),terminal_id:term.trim()}});
      toast('เพิ่ม MID แล้ว');load();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function delMid(id){
  if(!confirm('ลบ MID นี้?'))return;
  try{await api(`/api/acquirer-mids/${id}`,{method:'DELETE'});toast('ลบแล้ว');load();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

load();
</script>
