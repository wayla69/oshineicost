<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กระทบยอด — Oshinei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"></noscript>
<style>
/* โทนเดียวกับ dashboard หลัก (docs/ui-kit/tokens.css) + เขียวแบรนด์ recon */
:root{
  --brand:#0F6E56;--brand-deep:#0a523f;--brand-soft:#e6f4ef;
  --ok:#047857;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fffbeb;
  --err:#b91c1c;--err-bg:#fef2f2;--info:#1d4ed8;--info-bg:#eff6ff;
  --bg:#f0f4f8;--card:#fff;--line:#e2e8f0;--line-soft:#f1f5f9;
  --txt:#0f172a;--sub:#475569;--mut:#94a3b8;
  --shadow:0 1px 3px rgba(15,23,42,.04),0 2px 10px rgba(15,23,42,.05)}
*{box-sizing:border-box;margin:0}
body{font-family:'Inter','Noto Sans Thai','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1020px;margin:0 auto;padding:20px 18px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.muted{color:var(--sub);font-size:13px}
.lbl{font-size:11.5px;color:var(--mut);font-weight:500}

/* ตัวเลขเงิน: tabular-nums หลักตรงกันทุกแถว กวาดตาเทียบได้ */
.mono,.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{text-align:right;font-size:14.5px;font-weight:500}

/* status chips — พื้นอ่อน ตัวอักษรเข้ม อ่านชัดไม่แสบตา */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:999px;white-space:nowrap;border:none;line-height:1.5;
  font-family:inherit}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-err{background:var(--err-bg);color:var(--err)}
.c-mut{background:var(--line-soft);color:var(--sub)}
.c-setup{background:var(--info-bg);color:var(--info)}
button.chip{cursor:pointer;transition:filter .15s}
button.chip:hover{filter:brightness(.95)}

.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 15px;
  cursor:pointer;font-size:13.5px;font-weight:500;font-family:inherit;color:var(--txt);
  transition:background .15s,border-color .15s}
.btn:hover{background:var(--line-soft);border-color:#cbd5e1}
.btn-pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn-sm{font-size:12px;padding:4px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ตารางช่องทาง — แถวโปร่ง ชื่อเด่น ตัวเลขใหญ่ */
.grid-ch{display:grid;grid-template-columns:1.45fr 1fr 1fr 1.35fr 20px;gap:10px;
  align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-soft);
  cursor:pointer;transition:background .12s}
.grid-ch:hover{background:#f8fafc}
.grid-ch:last-child{border-bottom:none}
.ch-name{font-size:15px;font-weight:600}
.grid-ch .num{font-size:15px}

/* ปฏิทินวัน */
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px;padding:14px 18px}
.daycell{border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12px;
  cursor:pointer;background:#fff;transition:border-color .12s,box-shadow .12s}
.daycell:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.daycell b{font-size:13.5px}
.d-ok{border-left:4px solid #10b981}.d-diff{border-left:4px solid #ef4444}
.d-waiting{border-left:4px solid #f59e0b}.d-setup{border-left:4px solid #3b82f6}

.prog{height:9px;background:var(--line);border-radius:5px;overflow:hidden;flex:1;min-width:90px}
.prog>div{height:100%;background:#10b981;border-radius:5px;transition:width .3s}
.prog.p-warn>div{background:#f59e0b}.prog.p-err>div{background:#ef4444}

table{border-collapse:collapse;width:100%}
td,th{padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--line-soft);text-align:right}
th{font-size:11.5px;font-weight:600;color:var(--mut)}
td:first-child,th:first-child{text-align:left}
td.mono{font-variant-numeric:tabular-nums}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;
  color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;opacity:0;
  transition:opacity .3s;pointer-events:none;z-index:50;box-shadow:0 8px 24px rgba(15,23,42,.25)}
.toast.show{opacity:1}

.todo-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.todo-item:last-child{border-bottom:none}
.sugg{background:var(--ok-bg);border:1px solid #a7f3d0;border-radius:10px;padding:11px 15px;margin-bottom:8px;font-size:13.5px}
.hero-rc{background:#fff7ed;border:1px solid #fed7aa;border-left:4px solid var(--warn)}
.rc-head{font-weight:700;font-size:14px;margin-bottom:4px}
.rc-story{font-size:14.5px;line-height:1.55}
.rc-ev{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.rc-chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px}
.rc-arrow{color:var(--mut);font-weight:700}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:60}
.sheet-box{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 18px 22px;box-shadow:0 -4px 24px rgba(0,0,0,.18)}
.sheet-h{font-weight:700;font-size:15px;margin-bottom:4px}
.sheet-ta{width:100%;margin-top:10px;min-height:60px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;box-sizing:border-box}
.rc-reasons{display:flex;flex-direction:column;gap:7px}
.rc-reason{justify-content:flex-start;text-align:left;background:#f8fafc;border:1px solid var(--line)}
/* Phase 2: branch inbox drawers + problem/coin cards */
.drawer-h{display:block;font-size:13.5px;font-weight:600;color:var(--sub)}
.drawer-h:hover{text-decoration:none;filter:brightness(.95)}
.drawer .grid-ch{padding:9px 14px;border-bottom:1px solid var(--line)}
.drawer .grid-ch:last-of-type{border-bottom:none}
.coin-card{background:var(--line-soft);border-left:4px solid var(--mut)}
.coin-name{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.ch-prob .grid-ch{padding-left:0}
.fee-in{width:92px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  font-family:inherit;font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.fee-in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
input[type=month],select,input[type=text],#mm-note{font-family:inherit;font-size:13.5px;color:var(--txt)}
.c3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:2px 18px 14px}
.c3 .card{padding:12px 14px;font-size:12.5px;box-shadow:none}
.c3 .card b{font-size:13px}
/* ── หน้าแรก: กล่องงานทั้งเครือ (Phase 3 inbox) ── */
.ov-hero{padding:14px 18px}
.ov-hero-line{font-size:15.5px;line-height:1.5}
.ov-reclass{background:var(--ok-bg);border:1px solid #a7f3d0;border-left:4px solid var(--ok);font-size:14px;padding:12px 16px}
.ov-row{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:background .12s}
.ov-row:hover{background:#f8fafc}
.ov-row:last-child{border-bottom:none}
.ov-row-main{flex:1;min-width:0}
.ov-bname{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ov-sum{font-size:13px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ov-mini{font-size:11px;padding:1px 8px}
.ov-chev{color:var(--mut);font-size:20px;font-weight:600;flex:none;line-height:1}
.ov-row-done{padding:11px 18px}
.ov-row-done .ov-bname{font-weight:500;color:var(--sub)}
.ov-done-toggle{display:block;padding:12px 18px;font-size:13.5px;color:var(--sub);font-weight:500}
.ov-done-toggle:hover{text-decoration:none;background:#f8fafc}
/* Phase 4 #1: overview manager attention bar */
.review-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-left:4px solid var(--warn);background:var(--warn-bg)}
.review-bar .rb-link{font-size:13px;font-weight:600}
.review-bar .rb-link:not(:last-child)::after{content:'·';color:var(--mut);margin-left:8px;font-weight:400}
/* Phase 4 #2: "เพิ่มเติม" bottom-sheet menu rows */
.more-menu{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.more-item{display:flex;flex-direction:column;gap:1px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px;font-weight:600;background:#fff;transition:background .12s}
.more-item:hover{background:var(--line-soft);text-decoration:none}
.more-item .lbl{font-weight:400}
@media (max-width:640px){
  .ov-row{padding:11px 12px;gap:8px}
  .ov-row .row{width:auto !important}
  .ov-row .prog{min-width:54px}
  .ov-hero-line{font-size:14.5px}
  .grid-ch{grid-template-columns:1fr 1fr;row-gap:5px}
  .grid-ch>span:last-child{display:none}
  .daygrid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
  .wrap{padding:10px 10px 40px}
  td,th{padding:7px 7px;font-size:12.5px}
}
</style>
</head>
<body>
<div class="wrap" id="app">กำลังโหลด…</div>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" style="display:none" accept=".pdf,.xlsx,.xls,.csv">
<script>
const $=id=>document.getElementById(id);
const fmt=n=>(n==null?'—':Math.round(n).toLocaleString('th-TH'));
const progCls=p=>p>=95?'':p>=70?'p-warn':'p-err';
const TH_MONTHS=['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                 'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function monthTh(ym){            // 'YYYY-MM' -> 'พฤษภาคม 2569' (Buddhist year +543)
  if(!ym||ym.length<7)return ym||'';
  return (TH_MONTHS[+ym.slice(5,7)]||'')+' '+(+ym.slice(0,4)+543);
}
const COIN_TOL=100;             // ฿ tolerance for "coin residue"; single source of truth
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function tokenHdr(){const t=(localStorage.getItem('oshinei_token')||'').trim();return t?{'X-Upload-Token':t}:{};}
function setToken(){
  let t=prompt('รหัสสำหรับบันทึกข้อมูล (Write token) — เว้นว่างเพื่อล้าง:',localStorage.getItem('oshinei_token')||'');
  if(t===null)return; t=t.trim();
  t?localStorage.setItem('oshinei_token',t):localStorage.removeItem('oshinei_token');
  toast(t?'บันทึกรหัสแล้ว':'ล้างรหัสแล้ว');
}
// ถ้าเซิร์ฟเวอร์ตอบ 403 เพราะยังไม่ได้ใส่รหัส → ชวนตั้งรหัสทันที
function hint403(e){ if(String(e.message||'').includes('write token')||String(e.message).includes('403')) toast('ต้องตั้งรหัสบันทึกก่อน — กดปุ่ม 🔑 มุมบนขวา'); }
async function api(path,opts={}){
  opts.headers={...(opts.headers||{}),...tokenHdr()};
  if(opts.body && !(opts.body instanceof FormData)){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}
  const r=await fetch(path,opts);
  if(!r.ok){let d='';try{d=(await r.json()).detail||''}catch(e){};throw new Error(d||('HTTP '+r.status));}
  return r.json();
}

const CH_ST={ok:['c-ok','ตรงกันแล้ว'],diff:['c-err','ยอดไม่ตรง'],waiting_doc:['c-warn','รอเอกสาร'],
              no_source:['c-mut','ไม่ต้องตรวจ'],setup:['c-setup','รหัสใหม่ ต้องตั้งค่า']};
const SES_ST={draft:'กำลังทำ',in_review:'รอผู้จัดการตรวจ',approved:'ปิดเดือนแล้ว'};

let MONTH=localStorage.getItem('v2_month')||new Date().toISOString().slice(0,7);
let DATA=null, UP_DOC=null, PENDING_CH=null;

/* คลิกช่องทางในหน้าภาพรวม → เข้าสาขาแล้วกางช่องทางนั้นทันที */
function goChannel(bid,key){PENDING_CH=key;location.hash='b/'+bid;}
/* shared drill: expand a channel's day evidence (works in any Phase-2 bucket) */
function openEvidence(channelKey){
  if(!DATA||!DATA.channels)return;
  const idx=DATA.channels.findIndex(c=>c.key===channelKey);
  if(idx<0)return;
  const el=$('days-'+idx);
  // if the channel sits inside a collapsed drawer (เรียบร้อย/รอรอบ), open it first
  const dw=el&&el.closest('[id^="dw-"]');
  if(dw&&dw.style.display==='none') toggleDrawer(dw.id.slice(3));
  if(el && el.style.display==='none') toggleDays(idx);
  setTimeout(()=>{const e=$('days-'+idx); if(e) e.scrollIntoView({behavior:'smooth',block:'center'});},50);
}
function drillTodo(key){ openEvidence(key); }   // back-compat: todo card + drillReclass call this

function route(){
  const h=location.hash.slice(1);
  if(h==='errors')return loadErrorReport();
  if(h==='wrong')return loadWrongChannel();
  const m=h.match(/^b\/(\d+)/);
  if(m)loadBranch(+m[1]);else loadOverview();
}
window.addEventListener('hashchange',route);

function header(extra){
  return `<div class="row" style="margin-bottom:16px">
    <div class="row" style="gap:9px;cursor:pointer;flex-wrap:nowrap" onclick="location.hash=''">
      <div style="width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;
        display:flex;align-items:center;justify-content:center;font-size:17px;flex:none">⚖</div>
      <div><h1 style="line-height:1.2">กระทบยอดรายเดือน</h1>
        <div class="lbl">Oshinei · POS ↔ เงินเข้าบัญชีจริง</div></div>
    </div>
    <input type="month" value="${MONTH}" onchange="setMonth(this.value)"
      style="padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:var(--shadow)">
    ${extra||''}
    <button class="btn btn-sm" style="margin-left:auto" onclick="setToken()" title="ตั้งรหัสสำหรับบันทึกข้อมูล (จำเป็นบนเซิร์ฟเวอร์จริง)">🔑 รหัส</button>
    <button class="btn btn-sm" onclick="moreMenu()" title="เมนูเพิ่มเติม — รายงาน คู่มือ ตั้งค่า เครื่องมือขั้นสูง">⋯ เพิ่มเติม</button>
  </div>`;
}
function setMonth(m){MONTH=m;localStorage.setItem('v2_month',m);route();}

// จำนวน "เรื่องที่ต้องทำ" ของสาขา = todo + คู่ผิดช่อง (กันสาขาที่ดูเหมือนครบแต่ยังมีเงินผิดช่อง)
function branchOpen(b){return (b.todo_count||0)+(b.reclass_count||0);}
function openSummary(b){
  const td=b.todo_count||0, rc=b.reclass_count||0;
  if(td===0&&rc===0)return '';
  if(td===0&&rc>0)return rc===1?'เหลือ 1 เรื่อง: ยอดอยู่ผิดช่อง':'เหลือ '+rc+' เรื่อง: ยอดอยู่ผิดช่อง';
  let s='เหลือ '+(td+rc)+' เรื่อง';
  if(rc>0)s+=' · มีเงินอาจอยู่ผิดช่อง '+rc+' คู่';
  return s;
}

/* ── ภาพรวมทุกสาขา (กล่องงานทั้งเครือ) ── */
async function loadOverview(){
  $('app').innerHTML=header()+'<div class="muted">กำลังโหลด…</div>';
  let ov;try{ov=await api(`/api/v2/overview?month=${MONTH}`);}
  catch(e){$('app').innerHTML=header()+`<div class="card c-err">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`;return;}

  const branches=(ov.branches||[]).slice();
  const totalTodo=branches.reduce((a,b)=>a+(b.todo_count||0),0);   // งานที่บล็อกการปิดเดือน (reclass เป็นคำแนะนำ ไม่บล็อก)
  const _w=b=>Math.max(b.pos_total||0,b.ext_total||0,0);           // ถ่วงน้ำหนักด้วยฝั่งที่ใหญ่กว่า (ตรงกับ backend)
  const wsum=branches.reduce((a,b)=>a+_w(b),0);
  const chainPct=branches.length
      ? Math.round( wsum>0
          ? branches.reduce((a,b)=>a+(b.progress_pct||0)*_w(b),0)/wsum
          : branches.reduce((a,b)=>a+(b.progress_pct||0),0)/branches.length )
      : 100;
  const rcCount=ov.reclass_count_total||0, rcAmt=ov.reclass_amount_total||0;
  const open=branches.filter(b=>branchOpen(b)>0)
      .sort((a,b)=>branchOpen(b)-branchOpen(a) || (a.progress_pct||0)-(b.progress_pct||0));
  const done=branches.filter(b=>branchOpen(b)===0 && b.status!=='in_review')   // in_review ไม่ใช่ "เรียบร้อย" — อยู่ใน review-bar
      .sort((a,b)=>a.branch_name.localeCompare(b.branch_name,'th'));
  const review=branches.filter(b=>b.status==='in_review');

  let html=header();

  // hero line + chain progress (guard the empty-DB case: no ✓/100% over zero data)
  if(!branches.length){
    html+=`<div class="card ov-hero" style="margin-bottom:12px"><div class="ov-hero-line">เดือน <b>${esc(monthTh(ov.period_month))}</b></div></div>`;
  } else {
    html+=`<div class="card ov-hero" style="margin-bottom:12px">
      <div class="ov-hero-line">เดือน <b>${esc(monthTh(ov.period_month))}</b>
        ${totalTodo
          ? `· เหลือ <b>${totalTodo}</b> เรื่อง ก่อนปิดได้ทั้งเครือ`
          : `· <span class="chip c-ok">✓ ครบทุกสาขา พร้อมปิดทั้งเครือ</span>`}</div>
      <div class="row" style="flex-wrap:nowrap;margin-top:9px">
        <div class="prog ${progCls(chainPct)}"><div style="width:${chainPct}%"></div></div>
        <span class="lbl mono" style="min-width:40px">${chainPct}%</span>
      </div></div>`;
  }

  // Phase-4 #1: manager attention bar (links into the in_review branches)
  if(review.length){
    html+=`<div class="card review-bar" style="margin-bottom:12px">
      <span class="chip c-warn">⏳ รอฉันตรวจ ${review.length}</span>
      <span class="muted">สาขาที่ส่งตรวจแล้ว รอผู้จัดการปิดเดือน —</span>
      ${review.map(b=>`<a href="#" class="rb-link" onclick="location.hash='b/${b.branch_id}';return false">${esc(b.branch_name)}</a>`).join('')}
    </div>`;

/* ── Phase 2: bucket each channel for the branch inbox ── */
function _uploadChKeys(r){      // channel keys that have a genuine missing-doc upload task
  const keys=new Set();
  (r.todo||[]).forEach(t=>{ if(t.type==='upload' && t.channel) keys.add(t.channel); });
  return keys;                  // upload todos always carry .channel (reconcile_v2)
}
function classifyCh(ch,uploadKeys,missingStmtBanks){   // 'problem' | 'coin' | 'waiting' | 'green'
  if(ch.accepted)return 'green';
  if(ch.status==='no_source')return 'green';
  if(ch.status==='setup'||ch.status==='diff')return 'problem';
  if(ch.status==='waiting_doc'){
    if(uploadKeys.has(ch.key))return 'problem';          // missing doc that carries this channel → act
    // a fully-missing BANK STATEMENT backing this channel is actionable today,
    // not "รอเงินเข้าตามรอบ" — stmt docs carry channel=None so uploadKeys misses them
    if(missingStmtBanks&&(ch.banks||[]).some(b=>missingStmtBanks.has(b.bank)))return 'problem';
    return 'waiting';                                     // in-transit on schedule → timing drawer
  }
  // COUPON variance is loyalty points, not baht — never file it as ฿ "coin residue"
  if(ch.key!=='COUPON' && Math.abs(ch.variance)>0 && Math.abs(ch.variance)<=COIN_TOL) return 'coin';
  return 'green';
}

    <button class="btn btn-sm" title="เลือกทั้งโฟลเดอร์ของสาขานี้" onclick="$('bulk-folder-input').click()">📁 ทั้งโฟลเดอร์</button>`;
  html+=`<a href="#" class="lbl"${closed?' style="margin-left:auto"':''} onclick="toggleDocs();return false" id="docs-toggle">จัดการไฟล์ ▾</a>
  </div><div id="up-panel"></div><div id="docs-panel" style="display:none"></div></div>`;

  // คำถามตั้งค่า (unmapped codes) — ตอบจากคำแนะนำเอกสาร หรือตั้งค่าเองตรงนี้เลย
  r.setup_questions.forEach((q,qi)=>{
    html+=`<div class="card c-setup" style="margin-bottom:12px;background:#e6f1fb">
      <div class="row">รหัสชำระ <b>${esc(q.code)}</b> (${fmt(q.amount)} บาท) ยังไม่รู้ว่าเข้าธนาคารไหน
      ${q.suggestion?` — เอกสารชี้ว่าเป็น <b>${esc(q.suggestion.category)}·${esc(q.suggestion.bank)}</b> (ตรง ${q.suggestion.hits} วัน)
        ${closed?'':`<button class="btn btn-sm" onclick="applySugg(${q.suggestion.map_id},'${esc(q.suggestion.category)}','${esc(q.suggestion.bank)}')">ใช้คำตอบนี้</button>`}`:''}
      ${closed?'':`<a href="#" class="lbl" style="margin-left:auto" onclick="toggleMapper(${qi});return false">ตั้งค่าเอง ▾</a>`}</div>
      <div id="mapper-${qi}" style="display:none;margin-top:8px" class="row">
        <select id="map-cat-${qi}" style="padding:5px;border:1px solid var(--line);border-radius:6px">
          ${['QR','TRANSFER','CREDIT','CASH','GRAB','LINEMAN','COUPON','ENTERTAIN','OTHER'].map(c=>`<option>${c}</option>`).join('')}
        </select>
        <select id="map-bank-${qi}" style="padding:5px;border:1px solid var(--line);border-radius:6px">
          ${['KTB','KBANK','KTC','BAY','SCB','BBL','NONE'].map(b=>`<option>${b}</option>`).join('')}
        </select>
        <button class="btn btn-sm btn-pri" onclick="applyMapper(${qi},'${esc(q.code)}')">บันทึก</button>
        <span class="lbl">เงินสด/Grab/Line Man/คูปอง เลือกธนาคาร NONE</span>
      </div></div>`;
  });

  // ยอดโอนเข้าก้อนใหญ่ที่น่าจะเป็น "การโอนกันเอง" (ไม่ใช่ยอดขาย) — ตัดออกคลิกเดียว
  const xfers=r.internal_transfer_suggestions||[];
  if(!closed&&xfers.length){
    const sum=xfers.reduce((a,x)=>a+x.amount,0);
    html+=`<div class="card" style="margin-bottom:12px;background:#fffbeb;border-left:4px solid var(--warn)">
      <div class="row"><b style="font-size:13.5px">⇄ พบยอดโอนเข้าก้อนใหญ่ที่น่าจะเป็น "การโอนกันเอง" ${xfers.length} รายการ (รวม ${fmt(sum)})</b>
        ${xfers.length>1?`<button class="btn btn-sm" style="margin-left:auto" onclick="excludeAllXfers()">ตัดออกทั้งหมด</button>`:''}</div>
      <div class="muted" style="margin:2px 0 8px">ยอดก้อนใหญ่ + เลขกลม + ไม่มีคำว่า "ขาย" ในรายละเอียด — ตัดออกแล้วจะไม่ถูกนำมากระทบยอด (ย้ายไปกล่อง "โอนภายใน" · ย้อนกลับได้)</div>
      ${xfers.map(x=>`<div class="todo-item">
        <span style="flex:1">${x.date} · <b class="mono">${fmt(x.amount)}</b>
          <span class="lbl">${esc(x.description||'')}${x.channel?' · '+esc(x.channel):''}</span></span>
        <button class="btn btn-sm" onclick="excludeXfer(${x.id})">ตัดออก (ไม่ใช่ยอดขาย)</button>
      </div>`).join('')}</div>`;
  }

  // (การ์ด "ยอดอยู่ผิดช่อง" ย้ายขึ้นบนสุดเป็น hero card — ดู reclassHero ด้านล่าง)

  // ── Phase 2: ช่องทาง = กล่องงานเฉพาะที่มีปัญหาจริง + ลิ้นชักเขียว/รอรอบ + เศษเหรียญ ──
  const _upKeys=_uploadChKeys(r);
  const _missStmt=new Set((r.documents||[]).filter(d=>d.source==='bank'&&d.status==='missing').map(d=>d.provider));
  const _bucket={problem:[],coin:[],waiting:[],green:[]};
  r.channels.forEach((ch,i)=>{ _bucket[classifyCh(ch,_upKeys,_missStmt)].push(i); });

  // (A) การ์ดปัญหา — diff / setup / เอกสารหายจริง
  _bucket.problem.forEach(i=>{ html+=chProblemCard(r.channels[i],i,closed); });

  // (B) เศษเหรียญ ≤฿100 — รวมเป็นการ์ดเดียว กดรับทราบทั้งหมด
  if(_bucket.coin.length && !closed){
    const sum=_bucket.coin.reduce((a,i)=>a+Math.abs(r.channels[i].variance),0);
    const names=_bucket.coin.map(i=>`<span class="lbl coin-name" onclick="toggleDays(${i})" title="ดูรายวันของ ${esc(r.channels[i].label)} ก่อนรับทราบ">${esc(r.channels[i].label)}</span>`).join(', ');
    html+=`<div class="card coin-card" style="margin-bottom:12px">
      <div class="row"><b style="font-size:13.5px">🪙 ต่างเล็กน้อยรวม ฿${fmt(sum)} จาก ${_bucket.coin.length} ช่องทาง</b>
        <button class="btn btn-sm btn-pri" style="margin-left:auto" onclick='acceptCoinAll(${JSON.stringify(_bucket.coin)})'>✓ รับทราบทั้งหมด</button></div>
      <div class="muted" style="margin-top:3px">${names} — ผลต่างไม่เกิน ${COIN_TOL} บาท (ปัดเศษ/ค่าธรรมเนียม) · กดชื่อช่องทางเพื่อดูรายวัน หรือกดปุ่มรับทราบทั้งหมด</div>`;
    _bucket.coin.forEach(i=>{ html+=`<div id="days-${i}" style="display:none"></div>`; });
    html+=`</div>`;
  } else if(_bucket.coin.length){            // closed: read-only problem cards (still drillable)
    _bucket.coin.forEach(i=>{ html+=chProblemCard(r.channels[i],i,closed); });
  }

  // (C) ลิ้นชัก "รอเงินเข้าตามรอบ" — ห้ามแดง
  if(_bucket.waiting.length){
    html+=`<div class="card drawer" style="margin-bottom:12px;background:var(--info-bg)">
      <a href="#" class="drawer-h" onclick="toggleDrawer('wait');return false" id="dh-wait">
        ⏳ รอเงินเข้าตามรอบ — ไม่ต้องทำอะไร (${_bucket.waiting.length}) ▾</a>
      <div id="dw-wait" style="display:none;margin-top:8px">`;
    _bucket.waiting.forEach(i=>{ html+=chDrawerRow(r.channels[i],i,'wait'); });
    html+=`</div></div>`;
  }

  // (D) ลิ้นชักเขียว "เรียบร้อยแล้ว"
  if(_bucket.green.length){
    html+=`<div class="card drawer" style="margin-bottom:12px;background:var(--ok-bg)">
      <a href="#" class="drawer-h" onclick="toggleDrawer('green');return false" id="dh-green">
        ✓ เรียบร้อยแล้ว — ${_bucket.green.length} ช่องทางตรงหมด ▾</a>
      <div id="dw-green" style="display:none;margin-top:8px">`;
    _bucket.green.forEach(i=>{ html+=chDrawerRow(r.channels[i],i,'green'); });
    html+=`</div></div>`;
  }

  // โอนภายใน
  if(r.non_revenue.count){
    html+=`<div class="card row" style="margin-bottom:12px;font-size:13.5px;color:var(--sub)">
      ⇄ เงินเข้าที่ไม่ใช่ยอดขาย: โอนภายใน ${r.non_revenue.count} รายการ ${fmt(r.non_revenue.amount)} บาท (ตัดออกแล้ว)
      <a href="#" class="lbl" style="margin-left:auto" onclick="toggleNR();return false">ดูรายการ</a></div>
    <div id="nr" class="card" style="display:none;margin-bottom:12px;padding:0"><table>
      ${r.non_revenue.lines.map(l=>`<tr><td>${l.date}</td><td style="text-align:left">${esc(l.ref)}</td><td class="mono">${fmt(l.amount)}</td></tr>`).join('')}
    </table></div>`;
  }

  // จอสรุปผู้จัดการ — เห็นทุกอย่างที่ staff ทำ/รับทราบ ก่อนใส่รหัสปิดเดือน
  if(st==='in_review'&&!closed){
    html+=`<div class="card" style="margin-bottom:12px;border-left:4px solid var(--brand)">
      <b style="font-size:13.5px">📋 สรุปสำหรับผู้จัดการ — ตรวจก่อนปิดเดือน</b>
      <table style="margin-top:8px">
        <tr><th>ช่องทาง</th><th>POS</th><th>เงินเข้าจริง</th><th>ต่าง</th><th style="text-align:left">สถานะ / เหตุผลที่ staff รับทราบ</th></tr>
        ${r.channels.map(c=>{
          const [cls,lab]=c.accepted?['c-mut','รับทราบ']:(CH_ST[c.status]||['c-mut',c.status]);
          return `<tr><td>${esc(c.label)}</td><td class="mono">${fmt(c.pos)}</td>
            <td class="mono">${c.ext?fmt(c.ext):'—'}</td>
            <td class="mono" style="color:${Math.abs(c.variance)<=100?'inherit':'var(--err)'}">${c.variance>0?'+':''}${fmt(c.variance)}</td>
            <td style="text-align:left"><span class="chip ${cls}">${lab}</span>
              ${c.accepted?` <span class="lbl">"${esc(c.accepted.note)}" — ${esc(c.accepted.by||'staff')}</span>`
                :c.detail?` <span class="lbl">${esc(c.detail)}</span>`:''}</td></tr>`;}).join('')}
        ${r.non_revenue.count?`<tr><td style="color:var(--sub)">โอนภายใน (ตัดออก)</td><td></td>
          <td class="mono" style="color:var(--sub)">${fmt(r.non_revenue.amount)}</td><td></td>
          <td style="text-align:left" class="lbl">${r.non_revenue.count} รายการ — ไม่นับเป็นยอดขาย</td></tr>`:''}
      </table>
      <div class="lbl" style="margin-top:6px">ปิดเดือนแล้วเหตุผลทั้งหมดจะติดไปในไฟล์ Excel · แก้ไขไม่ได้จนกว่าจะส่งกลับแก้</div>
    </div>`;
  }

  // สิ่งที่เหลือ (พร้อมปุ่มรับทราบ) + ปุ่มสถานะ
  html+=`<div class="card">`;
  if(r.todo.length){
    html+=`<b style="font-size:13.5px">เหลือ ${r.todo.length} เรื่องก่อนปิดเดือน</b><div style="margin:6px 0 10px">`;
    r.todo.forEach((t,i)=>{
      const acceptable=!closed && (t.channel||t.type==='diff');
      const drillable=t.channel && r.channels.some(c=>c.key===t.channel);
      html+=`<div class="todo-item"><span style="flex:1">• ${esc(t.label)}</span>
        ${drillable?`<button class="btn btn-sm" title="กางช่องทางนี้ดูรายวัน + บรรทัด statement ที่ยังจับคู่ไม่ได้" onclick="drillTodo('${esc(t.channel)}')">🔍 ดูรายการ</button>`:''}
        ${t.type==='upload'&&!closed?`<button class="btn btn-sm" onclick='pickFile(${JSON.stringify(DATA.documents.find(d=>d.key===t.doc)||null)})'>⬆ อัปโหลด</button>`:''}
        ${acceptable?`<button class="btn btn-sm" onclick="acceptTodo('${esc(t.channel)}','${esc(t.label)}')">✓ รับทราบ + เหตุผล</button>`:''}
      </div>`;
    });
    html+=`</div><div class="muted">"รับทราบ" = ยอมรับผลต่างโดยใส่เหตุผล (เช่น ยอดเล็ก ไม่คุ้มตามเอกสาร) — เหตุผลจะติดไปในไฟล์ Excel ให้ผู้จัดการเห็นตอนอนุมัติ</div>`;
  } else {
    html+=`<span class="chip c-ok">✓ ครบทุกช่องทาง พร้อมปิดเดือน</span>`;
  }
  html+=`<div class="row" style="margin-top:10px;justify-content:flex-end">
    ${closed?'':st==='in_review'
      ?`<button class="btn" onclick="setSt(${bid},'draft')">ส่งกลับแก้</button>
         <button class="btn btn-pri" onclick="closeMonth(${bid})" ${r.todo.length?'disabled title="ยังมีเรื่องค้าง — จัดการหรือรับทราบให้ครบก่อน"':''}>ปิดเดือน (ผู้จัดการ)</button>`
      :`<button class="btn btn-pri" onclick="setSt(${bid},'in_review')">ส่งตรวจ</button>`}
  </div></div>`;
  $('app').innerHTML=html;

  // มาจากการคลิกช่องทางในหน้าภาพรวม → กางช่องทางนั้นและเลื่อนไปหา (กางลิ้นชักให้ด้วย)
  if(PENDING_CH){ const k=PENDING_CH; PENDING_CH=null; openEvidence(k); }
}

/* ── Phase 2 render helpers ── */
function chProblemCard(ch,i,closed){
  const acc=ch.accepted;
  const [cls,lab]=acc?['c-mut','รับทราบแล้ว']:(CH_ST[ch.status]||['c-mut',ch.status]);
  const dirTxt=(ch.key!=='COUPON'&&ch.status==='diff'&&Math.abs(ch.variance)>0)
    ? (ch.variance<0?`เงินเข้าจริงน้อยกว่า POS ฿${fmt(-ch.variance)}`
                    :`เงินเข้าจริงเกิน POS ฿${fmt(ch.variance)}`)
    : esc(ch.detail||lab);   // COUPON (variance=แต้ม) ใช้ detail เดิม ไม่แปลงเป็นบาท
  const side=ch.status==='diff'?'var(--err)':ch.status==='setup'?'var(--info)':'var(--warn)';
  const bg  =ch.status==='diff'?'var(--err-bg)':ch.status==='setup'?'var(--info-bg)':'var(--warn-bg)';
  // suppress the POS·ext subline for COUPON (its variance is points, pos/ext are gross — misleading)
  const sub=ch.key==='COUPON'?'' :
    `<div class="lbl mono">POS ${fmt(ch.pos)} · เงินเข้าจริง ${ch.ext?fmt(ch.ext):'—'}${ch.days_total?` · ${ch.days_done}/${ch.days_total} วัน ✓`:''}</div>`;
  return `<div class="card ch-prob" style="margin-bottom:12px;background:${bg};border-left:4px solid ${side}">
    <div class="row" style="cursor:pointer" onclick="toggleDays(${i})">
      <div style="flex:1"><b style="font-size:14px">${esc(ch.label)}</b>
        <div class="muted">${dirTxt}</div>${sub}</div>
      <span class="chip ${cls}">${lab}</span>
      <button class="btn btn-sm" onclick="event.stopPropagation();toggleDays(${i})">🔍 ดูรายการ ▾</button>
    </div>
    ${acc?`<div class="lbl" style="margin-top:4px" title="${esc(acc.note)}">"${esc(acc.note)}" ${closed?'':`<a href="#" onclick="event.stopPropagation();unaccept(${acc.id});return false">เลิกรับทราบ</a>`}</div>`:''}
    <div id="days-${i}" style="display:none;margin-top:8px;border-top:1px solid var(--line)"></div>
  </div>`;
}
function chDrawerRow(ch,i,which){
  const acc=ch.accepted;
  const [cls,lab]=acc?['c-mut','รับทราบแล้ว']
    :which==='wait'?['c-warn',esc(ch.detail||'รอเงินเข้าตามรอบ')]
    :(CH_ST[ch.status]||['c-mut',ch.status]);
  // COUPON: pos/ext are gross discount amounts, not bank money — don't show as เงินเข้า
  const isCoupon=ch.key==='COUPON';
  const posCell=isCoupon?'<span class="lbl">แต้ม</span>':fmt(ch.pos);
  const extCell=isCoupon?'<span style="color:var(--mut)">—</span>':(ch.ext?fmt(ch.ext):'<span style="color:var(--mut)">—</span>');
  return `<div class="grid-ch" onclick="toggleDays(${i})" style="background:transparent">
    <div><span class="ch-name" style="font-size:14px">${esc(ch.label)}</span>${ch.days_total?`<div class="lbl">${ch.days_done}/${ch.days_total} วัน ✓</div>`:''}</div>
    <div class="num" style="color:var(--sub)">${posCell}</div>
    <div class="num">${extCell}</div>
    <div style="text-align:right"><span class="chip ${cls}">${lab}</span>
      ${acc&&!DATA.closed?`<div class="lbl"><a href="#" onclick="event.stopPropagation();unaccept(${acc.id});return false">เลิกรับทราบ</a></div>`:''}</div>
    <span class="lbl">▾</span></div>
  <div id="days-${i}" style="display:none;border-bottom:1px solid var(--line)"></div>`;
}
function toggleDrawer(name){
  const body=$('dw-'+name), h=$('dh-'+name); if(!body)return;
  const open=body.style.display!=='none';
  body.style.display=open?'none':'';
  h.textContent=h.textContent.replace(open?'▴':'▾',open?'▾':'▴');
}
/* เศษเหรียญ ≤฿100: รับทราบทุกช่องทางในคราวเดียว (auto-reason ≥10 ตัวอักษร, AUD-8) */
async function acceptCoinAll(idxs){
  if(!idxs||!idxs.length)return;
  const note=`ผลต่างเล็กน้อยไม่เกิน ${COIN_TOL} บาท (ปัดเศษ/ค่าธรรมเนียม)`;
  if(!confirm(`รับทราบผลต่างเล็กน้อย ${idxs.length} ช่องทาง พร้อมเหตุผล "${note}"?`))return;
  let okN=0;
  for(const i of idxs){
    const ch=DATA.channels[i]; if(!ch)continue;
    try{await api('/api/lanes/adj',{method:'POST',body:{branch_id:DATA.branch_id,period_month:MONTH,
        category:ch.key,bank:'ALL',adj_pos:0,adj_ext:0,note:note,adj_type:'accept'}}); okN++; }
    catch(e){ hint403(e); }
  }
  toast(okN===idxs.length?`รับทราบแล้ว ${okN} ช่องทาง`:`รับทราบ ${okN}/${idxs.length} — บางช่องไม่สำเร็จ`);
  route();
}

function toggleNR(){const e=$('nr');e.style.display=e.style.display==='none'?'':'none';}

/* ── อัปโหลดเอกสารในหน้า ── */
function pickFile(doc){
  if(!doc)return;
  UP_DOC=doc;
  $('file-input').value='';
  $('file-input').onchange=()=>previewUpload();
  $('file-input').click();
}
async function previewUpload(){
  const f=$('file-input').files[0];
  if(!f||!UP_DOC)return;
  const panel=$('up-panel');
  panel.innerHTML=`<div class="muted" style="margin-top:10px">กำลังอ่าน ${esc(f.name)}…</div>`;
  const fd=new FormData();
  fd.append('file',f);fd.append('branch_id',DATA.branch_id);
  fd.append('period_month',MONTH);fd.append('provider',UP_DOC.provider||'');
  let p;
  try{p=await api(`/api/uploads/${UP_DOC.source}/preview`,{method:'POST',body:fd});}
  catch(e){panel.innerHTML=`<div class="chip c-err" style="margin-top:10px">อ่านไฟล์ไม่ได้: ${esc(e.message)}</div>`;return;}
  const wrongBranch=p.detected_branch_id&&p.detected_branch_id!==DATA.branch_id;
  const zeroRow=p.row_count===0&&!p.empty_statement;            // A1/C7: nothing usable parsed
  const block=wrongBranch||zeroRow;                              // can't confirm these
  panel.innerHTML=`<div class="card" style="margin-top:10px;background:#fafafa">
    <div class="row"><b style="font-size:13.5px">${esc(UP_DOC.label)}</b>
      <span class="lbl">${esc(f.name)} · ตรวจพบ: ${esc(p.provider||'ไม่ระบุ')} · ${p.row_count} รายการ${p.skipped_rows?` (ข้าม ${p.skipped_rows})`:''}</span></div>
    ${p.empty_statement?`<div class="chip c-warn" style="margin-top:6px">เอกสารว่าง (No Data) — ยืนยันได้ ระบบจะบันทึกว่าเดือนนี้ไม่มีรายการ</div>`:''}
    ${zeroRow?`<div class="chip c-err" style="margin-top:6px">⚠ อ่านได้ 0 รายการ — น่าจะเป็นไฟล์ผิดประเภท/รูปแบบที่ยังไม่รองรับ ยืนยันไม่ได้</div>`:''}
    ${(p.generic_fallback&&!zeroRow)?`<div class="chip c-warn" style="margin-top:6px">อ่านแบบทั่วไป (ไม่รู้จักรูปแบบเฉพาะของผู้ให้บริการ) — โปรดตรวจตัวเลขก่อนยืนยัน</div>`:''}
    ${wrongBranch?`<div class="chip c-err" style="margin-top:6px">⚠ เอกสารนี้เป็นของสาขา ${esc(p.detected_branch_name)} — ยืนยันไม่ได้</div>`:''}
    <div class="row" style="margin-top:10px">
      <button class="btn btn-pri" ${block?'disabled':''} onclick="confirmUpload()">✓ ยืนยันบันทึก</button>
      <button class="btn" onclick="$('up-panel').innerHTML=''">ยกเลิก</button>
    </div></div>`;
}
async function confirmUpload(){
  const f=$('file-input').files[0];
  if(!f||!UP_DOC)return;
  const fd=new FormData();
  fd.append('file',f);fd.append('branch_id',DATA.branch_id);
  fd.append('period_month',MONTH);fd.append('provider',UP_DOC.provider||'');
  try{const r=await api(`/api/uploads/${UP_DOC.source}/confirm`,{method:'POST',body:fd});
      toast(`บันทึกแล้ว ${r.rows_saved} รายการ`);route();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── อัปโหลดหลายไฟล์/ทั้งโฟลเดอร์ในครั้งเดียว (B1) ── */
async function bulkUpload(inputId){
  const inp=$(inputId); const files=[...(inp.files||[])]; if(!files.length)return;
  const panel=$('up-panel');
  panel.innerHTML=`<div class="muted" style="margin-top:10px">กำลังอัปโหลด ${files.length} ไฟล์… (อาจใช้เวลาสักครู่)</div>`;
  const fd=new FormData();
  for(const f of files) fd.append('files',f);
  fd.append('branch_id',DATA.branch_id); fd.append('period_month',MONTH); fd.append('source_type','auto');
  let r;
  try{ r=await api('/api/uploads/bulk',{method:'POST',body:fd}); }
  catch(e){ panel.innerHTML=`<div class="chip c-err" style="margin-top:10px">อัปโหลดไม่สำเร็จ: ${esc(e.message)}</div>`; inp.value=''; return; }
  const s=r.summary;
  const stCls=x=>x==='ok'?'c-ok':x==='skipped'?'c-warn':'c-err';
  const stTh=x=>x==='ok'?'สำเร็จ':x==='skipped'?'ข้าม':'ผิดพลาด';
  panel.innerHTML=`<div class="card" style="margin-top:10px;background:#fafafa">
    <div class="row"><b style="font-size:13.5px">ผลอัปโหลด ${s.total} ไฟล์</b>
      <span class="lbl">✓ สำเร็จ ${s.saved} · ข้าม ${s.skipped} · ผิดพลาด ${s.errored} · รวม ${fmt(s.rows)} รายการ</span>
      <button class="btn btn-sm btn-pri" style="margin-left:auto" onclick="route()">รีเฟรชหน้า</button></div>
    <div style="max-height:340px;overflow:auto;margin-top:6px"><table style="width:100%">
      <tr><th style="text-align:left">ไฟล์</th><th>ประเภท</th><th>สถานะ</th><th>รายการ</th><th style="text-align:left">หมายเหตุ</th></tr>
      ${r.files.map(f=>`<tr>
        <td style="text-align:left">${esc(f.file)}</td>
        <td>${esc(f.source_type||'-')}</td>
        <td><span class="chip ${stCls(f.status)}">${stTh(f.status)}</span></td>
        <td class="mono">${f.rows_saved||''}</td>
        <td style="text-align:left" class="lbl">${esc(f.reason||'')}</td></tr>`).join('')}
    </table></div></div>`;
  inp.value='';
}

/* ── แผงจัดการไฟล์ที่อัปโหลดแล้ว (ยกความสามารถหน้า Uploads เดิมเข้ามา) ── */
const SRC_LABEL={bank:'สเตทเมนต์',credit_card:'สรุปยอดบัตร',grab:'Grab',lineman:'Line Man'};
const LINE_ST={matched:['c-ok','✓ จับคู่แล้ว'],manual:['c-ok','🔗 จับคู่เอง'],unmatched:['c-warn','⌛ ยังไม่จับคู่'],
               excluded:['c-mut','⊘ ตัดออก'],informational:['c-mut','· ข้อมูลทั่วไป']};
async function toggleDocs(){
  const panel=$('docs-panel'), tg=$('docs-toggle');
  if(panel.style.display!=='none'){panel.style.display='none';tg.textContent='จัดการไฟล์ ▾';return;}
  tg.textContent='จัดการไฟล์ ▴';
  panel.style.display='';
  panel.innerHTML='<div class="muted" style="margin-top:10px">กำลังโหลด…</div>';
  let ups;try{ups=await api(`/api/uploads?branch_id=${DATA.branch_id}&period_month=${MONTH}`);}
  catch(e){panel.innerHTML=`<div class="chip c-err">โหลดไม่ได้: ${esc(e.message)}</div>`;return;}
  if(!ups.length){panel.innerHTML='<div class="muted" style="margin-top:10px">ยังไม่มีไฟล์ของสาขา/เดือนนี้</div>';return;}
  panel.innerHTML=`<div class="card" style="padding:0;margin-top:10px;overflow-x:auto"><table>
    <tr><th>ไฟล์</th><th>ประเภท</th><th>รายการ</th><th style="min-width:130px">จับคู่แล้ว</th><th>อัปเมื่อ</th><th></th></tr>
    ${ups.map(u=>{
      const tot=u.match_total||0, done=u.match_done||0;
      const pct=tot?Math.round(100*done/tot):0;
      const bar=tot?`<div class="row"><div class="prog" style="min-width:60px"><div style="width:${pct}%"></div></div>
                     <span class="lbl">${done}/${tot}</span></div>`
        :(u.error_msg?`<span class="chip c-mut">${esc(u.error_msg)}</span>`:'<span class="lbl">—</span>');
      return `<tr>
        <td style="text-align:left;max-width:230px;overflow:hidden;text-overflow:ellipsis" title="${esc(u.file_name)}">${esc(u.file_name)}</td>
        <td>${SRC_LABEL[u.source_type]||u.source_type} ${esc(u.provider||'')}</td>
        <td class="mono">${u.row_count}</td>
        <td>${bar}</td>
        <td class="lbl">${esc((u.uploaded_at||'').slice(5,16))}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm" onclick="upLines(${u.upload_id},this)">รายบรรทัด</button>
          ${DATA.closed?'':`<button class="btn btn-sm" onclick="moveUpload(${u.upload_id})" title="เอกสารอยู่ผิดสาขา">ย้ายสาขา</button>
          <button class="btn btn-sm" style="color:var(--err)" onclick="delUpload(${u.upload_id},'${esc(u.file_name)}')">ลบ</button>`}
        </td></tr>
        <tr id="uplines-${u.upload_id}" style="display:none"><td colspan="6" style="text-align:left;background:#fafafa"></td></tr>`;
    }).join('')}
  </table></div>
  <div class="muted" style="margin-top:4px">% จับคู่คำนวณสดจากเอกสารจริง — ลบไฟล์แล้วอัปใหม่ได้ถ้าอัปผิด (ระบบกันไฟล์ซ้ำให้)</div>`;
}
async function upLines(uid,btn){
  const row=$('uplines-'+uid);
  if(row.style.display!=='none'){row.style.display='none';return;}
  row.style.display='';
  const cell=row.firstElementChild;
  cell.innerHTML='<span class="muted">กำลังโหลด…</span>';
  let d;try{d=await api(`/api/uploads/${uid}/lines`);}
  catch(e){cell.innerHTML=`<span class="chip c-err">${esc(e.message)}</span>`;return;}
  cell.innerHTML=`<div style="max-height:280px;overflow:auto"><table>
    <tr><th>วันที่</th><th>รายละเอียด</th><th>ยอด</th><th>สถานะ</th></tr>
    ${d.lines.map(l=>{const [cls,lab]=LINE_ST[l.status]||['c-mut',l.status];
      return `<tr><td>${l.date}</td><td style="text-align:left">${esc(l.ref||'')}</td>
        <td class="mono">${fmt(l.amount)}</td><td><span class="chip ${cls}">${lab}</span></td></tr>`;}).join('')}
  </table></div>
  <div class="lbl" style="margin-top:4px">จับคู่ ${d.matched}/${d.count} รายการที่ต้องกระทบยอด (อีก ${d.total_lines-d.count} รายการเป็นข้อมูลทั่วไป/ตัดออก)</div>`;
}
async function moveUpload(uid){
  let brs;try{brs=await api('/api/branches');}catch(e){toast(e.message);return;}
  const opts=brs.map(b=>`${b.branch_id}=${b.name}`).join('  ');
  const pick=prompt(`ย้ายไฟล์ไปสาขาไหน? พิมพ์หมายเลข:\n${opts}`);
  if(pick===null)return;
  const bid=parseInt(pick.trim());
  if(!brs.some(b=>b.branch_id===bid)){toast('หมายเลขสาขาไม่ถูกต้อง');return;}
  try{const r=await api(`/api/uploads/${uid}/branch`,{method:'PATCH',body:{branch_id:bid}});
      toast(`ย้ายแล้ว (${r.moved_lines} รายการ)`);route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function delUpload(uid,name){
  if(!confirm(`ลบไฟล์ "${name}" และรายการทั้งหมดของมัน? (อัปใหม่ได้ภายหลัง)`))return;
  try{await api(`/api/uploads/${uid}`,{method:'DELETE'});toast('ลบแล้ว');route();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── รับทราบผลต่าง — เลือกเหตุผลสำเร็จรูป (แทน prompt) ── */
const ACCEPT_REASONS=[
  'ยอดต่างเล็กน้อย ไม่คุ้มที่จะตามเอกสาร',
  'เศษสตางค์/ปัดเศษจากระบบ',
  'ค่าธรรมเนียมธนาคาร/ค่ายบัตรหักก่อนโอน',
  'เงินเข้าข้ามรอบ — วันสุดท้ายฝากเดือนถัดไป',
  'ลูกค้าโอนผิดบัญชี/คืนเงินภายหลัง',
];
let _acceptCtx=null;
function acceptTodo(channel,label){
  if(!channel||channel==='null'){toast('ข้อนี้รับทราบไม่ได้ — ต้องอัปโหลดเอกสาร');return;}
  _acceptCtx={channel,label};
  const opts=ACCEPT_REASONS.map((rsn,k)=>
    `<button class="btn rc-reason" onclick="pickAcceptReason(${k})">${esc(rsn)}</button>`).join('');
  showSheet(`<div class="sheet-h">รับทราบผลต่าง: ${esc(label)}</div>
    <div class="lbl" style="margin-bottom:10px">เลือกเหตุผล (จะแสดงในไฟล์ Excel ให้ผู้จัดการเห็นตอนอนุมัติ) หรือพิมพ์เอง</div>
    <div class="rc-reasons">${opts}</div>
    <textarea id="accept-note" class="sheet-ta" placeholder="พิมพ์เหตุผลเอง (อย่างน้อย 10 ตัวอักษร)"></textarea>
    <div class="row" style="margin-top:10px;gap:8px">
      <button class="btn btn-pri" onclick="submitAccept()">บันทึกรับทราบ</button>
      <button class="btn" onclick="closeSheet()">ยกเลิก</button>
    </div>`);
}
function pickAcceptReason(k){const ta=$('accept-note');if(ta){ta.value=ACCEPT_REASONS[k];ta.focus();}}
async function submitAccept(){
  const note=(($('accept-note')||{}).value||'').trim();
  if(note.length<10){toast('ต้องใส่เหตุผลอย่างน้อย 10 ตัวอักษร');return;}
  const ctx=_acceptCtx;if(!ctx)return;
  try{await api('/api/lanes/adj',{method:'POST',body:{branch_id:DATA.branch_id,period_month:MONTH,
      category:ctx.channel,bank:'ALL',adj_pos:0,adj_ext:0,note:note,adj_type:'accept'}});
      closeSheet();toast('รับทราบแล้ว');route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function unaccept(adjId){
  try{await api(`/api/lanes/adj/${adjId}`,{method:'DELETE'});toast('เลิกรับทราบแล้ว');route();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── ตัดยอดโอนกันเองออกจากการกระทบยอด (ใช้ ignore endpoint เดิม — ย้อนกลับได้) ── */
async function excludeXfer(id,silent){
  try{await api(`/api/bank-lines/${id}/ignore`,{method:'PATCH',
        body:{ignored:true,note:'โอนกันเอง (ก้อนใหญ่ ไม่ใช่ยอดขาย)'}});
      if(!silent){toast('ตัดออกแล้ว — ย้ายไปกล่องโอนภายใน');route();}}
  catch(e){if(!silent){toast('ไม่สำเร็จ: '+e.message);hint403(e);}throw e;}
}
async function excludeAllXfers(){
  const xfers=(DATA.internal_transfer_suggestions||[]);
  if(!xfers.length)return;
  if(!confirm(`ตัด ${xfers.length} รายการโอนกันเองออกจากการกระทบยอด? (ย้อนกลับได้ที่กล่อง "โอนภายใน")`))return;
  try{for(const x of xfers)await excludeXfer(x.id,true);
      toast(`ตัดออก ${xfers.length} รายการแล้ว`);route();}
  catch(e){toast('บางรายการไม่สำเร็จ: '+e.message);route();}
}

/* ── จับคู่: การ์ดแนะนำ + เลือกเองในวัน ── */
async function applyReclass(i){
  const s=DATA.reclass_suggestions[i];
  try{await api('/api/manual',{method:'POST',body:{branch_id:s.branch_id,period_month:s.period_month,
      category:s.category,bank:s.bank,pos_days:s.pos_days,ext:s.ext,note:s.note}});
      toast('จับคู่แล้ว — ย้ายเข้าช่องที่ถูกต้องเรียบร้อย');route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── เงินอยู่ผิดช่อง: hero card (§3) — เล่าเป็นเรื่อง + แตะเดียวจบ ── */
function reclassHero(s,i){
  const day=(s.pos_day||'').slice(8).replace(/^0/,'');
  const amt=fmt(s.amount);
  const posTh=esc(s.pos_cat_th||s.pos_cat||'');
  const extTh=esc(s.ext_cat_th||s.ext_cat||'');
  const extBank=s.ext_bank_th?` (${esc(s.ext_bank_th)})`:'';
  const hi=s.confidence==='high';
  const pill=hi?['c-ok','ตรงกันพอดี — มั่นใจสูง']:['c-warn','ยอดเท่ากันแต่คนละธนาคาร — น่าจะใช่'];
  return `<div class="card hero-rc" id="rc-${i}" style="margin-bottom:12px">
    <div class="rc-head">⇄ เงินอาจถูกบันทึกผิดช่อง</div>
    <div class="rc-story">วันที่ <b>${day}</b> — <b>${posTh}</b> เกินมา ฿${amt} แต่ <b>${extTh}</b> ขาดไป ฿${amt} <span class="lbl">เท่ากันพอดี</span></div>
    <div class="lbl" style="margin:4px 0 2px">น่าจะเป็นเงินก้อนเดียวกัน — เข้าบัญชีจริงเป็น<b>${extTh}</b> แต่ในเครื่อง POS กดเป็น<b>${posTh}</b></div>
    <div class="rc-ev">
      <span class="rc-chip">ในเครื่อง POS: ${posTh} <b class="mono">+฿${amt}</b></span>
      <span class="rc-arrow">→</span>
      <span class="rc-chip">เข้าบัญชีจริง: ${extTh} <b class="mono">฿${amt}</b>${extBank}</span>
      <span class="chip ${pill[0]}" style="margin-left:auto">${pill[1]}</span>
    </div>
    <div class="row" style="margin-top:11px;gap:8px">
      <button class="btn btn-pri" onclick="confirmReclass(${i})">✅ ใช่ เป็นเงินก้อนเดียวกัน</button>
      <button class="btn btn-sm" onclick="drillReclass(${i})">🔍 ขอดูรายการ</button>
      <a href="#" class="lbl" style="margin-left:auto" onclick="dismissReclass(${i});return false">ไม่ใช่</a>
    </div>
    <div id="rc-med-${i}" style="display:none;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)">
      <div class="lbl" style="margin-bottom:7px">ยอดเท่ากันแต่คนละธนาคาร อาจบังเอิญตรงกัน — ยืนยันว่าเป็นเงินก้อนเดียวกันจริงไหม?</div>
      <div class="row" style="gap:8px">
        <span class="chip c-mut">เหตุผล: แคชเชียร์กดผิดช่อง</span>
        <button class="btn btn-pri btn-sm" onclick="applyReclass(${i})">ยืนยันย้าย</button>
        <a href="#" class="lbl" onclick="$('rc-med-${i}').style.display='none';return false">ยกเลิก</a>
      </div>
    </div>
  </div>`;
}
function confirmReclass(i){
  const s=DATA.reclass_suggestions[i];
  if(s&&s.confidence!=='high'){const m=$('rc-med-'+i);if(m)m.style.display='block';return;}
  applyReclass(i);   // มั่นใจสูง — ย้ายได้เลย ไม่ต้องถามซ้ำ
}
function drillReclass(i){
  const s=DATA.reclass_suggestions[i];if(!s)return;
  drillTodo(s.pos_cat);   // กางช่องทาง POS ที่เกินมา ดูรายวัน + บรรทัด statement
}
function dismissReclass(i){
  const el=$('rc-'+i);if(el)el.style.display='none';
}

/* ── bottom sheet กลาง (ใช้กับเหตุผลรับทราบ) ── */
function showSheet(html){
  let o=$('sheet');
  if(!o){o=document.createElement('div');o.id='sheet';o.className='sheet-overlay';document.body.appendChild(o);}
  o.innerHTML=`<div class="sheet-box">${html}</div>`;
  o.onclick=(e)=>{if(e.target===o)closeSheet();};
  o.style.display='flex';
}
function closeSheet(){const o=$('sheet');if(o)o.style.display='none';}

      <a class="more-item" href="/app/help.html">📖 คู่มือการใช้งาน ↗<span class="lbl">ทุกเมนู ทุกเอกสาร + Q&amp;A · พิมพ์ได้</span></a>
      <a class="more-item" href="/app/setup.html">⚙️ ตั้งค่าระบบ ↗<span class="lbl">จับคู่รหัสรับเงิน วิธีกระทบยอด บัญชี/MID</span></a>
      <a class="more-item" href="/app/classic.html">🧰 เครื่องมือขั้นสูง ↗<span class="lbl">หน้าเดิม — เครื่องมือครบทุกอย่าง</span></a>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn" style="margin-left:auto" onclick="closeSheet()">ปิด</button></div>`);
}

const FEE_SOURCE={CREDIT:'credit_card',GRAB:'grab',LINEMAN:'lineman'};
const C3_LEG={matched:['c-ok','✓ ตรง'],mismatch:['c-err','≠ ต่าง'],pos_only:['c-warn','รอสรุปยอดบัตร'],
              ext_only:['c-warn','ไม่มียอด POS'],awaiting:['c-warn','รอเงินเข้า'],no_bank:['c-mut','—'],none:['c-mut','—']};
function _legChip(s){const [c,t]=C3_LEG[s]||['c-mut',s];return `<span class="chip ${c}">${t}</span>`;}

function toggleDays(i){
  const el=$('days-'+i);
  if(el.style.display!=='none'){el.style.display='none';return;}
  const ch=DATA.channels[i];
  // ที่มาของยอด POS — แตกเป็นรหัสชำระ ให้ตรวจสอบได้ ไม่ใช่เลขลอย ๆ
  const codes=(ch.codes||[]).map((c,k)=>
    `<button class="chip c-mut mono" title="ดูยอดรายวันของ ${esc(c.code)} (${esc(c.bank)})"
       onclick="event.stopPropagation();toggleCodeDaily(${i},'${esc(c.code)}')">${esc(c.code)} ${fmt(c.amount)} ▾</button>`).join(' ');
  // B7: TRANSFER/ANY — show chips for every bank the lane touches so staff see both statements at a glance
  const xferBanks=ch.key==='TRANSFER'?[...new Set(ch.days.flatMap(d=>d.banks||[]))].sort():[];
  const xferBankRow=xferBanks.length>1?`<span class="lbl">ตรวจกับ:</span> ${xferBanks.map(b=>`<span class="chip c-mut">${esc(b)}</span>`).join(' ')}`:'';
  // บัตรเครดิต: ขั้น 1 = สรุปยอดบัตร↔POS (gross) · ขั้น 2 = ยอดสุทธิ↔เงินเข้า (สอดคล้อง GRAB/LM)
  const c3=(ch.key==='CREDIT'&&ch.three_way)?`<div class="c3">${ch.three_way
    .filter(r=>r.pos_gross>0||r.settle_gross>0||r.bank_credit>0).map(r=>`
    <div class="card"><b>บัตร ${esc(r.acquirer)}</b>
      <div class="row" style="justify-content:space-between">ยอดรูด POS <span class="mono">${fmt(r.pos_gross)}</span></div>
      <div class="row" style="justify-content:space-between"><span><span class="lbl">ขั้น 1</span> สรุปยอดบัตร ↔ POS</span> <span class="mono">${fmt(r.settle_gross)}</span> ${_legChip(r.pos_leg)}</div>
      <div class="row" style="justify-content:space-between">− ค่าธรรมเนียม+VAT <span class="mono">${fmt(r.settle_fee)}</span></div>
      <div class="row" style="justify-content:space-between"><span><span class="lbl">ขั้น 2</span> ยอดสุทธิ ↔ เงินเข้า</span> <span class="mono">${fmt(r.bank_credit)}</span> ${_legChip(r.bank_leg)}</div>
    </div>`).join('')}</div>`:'';
  const pt=payoutTraceHtml(ch);
  const cash3=cashThreeWayHtml(ch, i);
  const cpCards=couponCardsHtml(ch);
  const feeBtn=FEE_SOURCE[ch.key]&&!DATA.closed?
    `<button class="btn btn-sm" onclick="event.stopPropagation();loadFees(${i})">✎ ค่าธรรมเนียม & VAT</button>`:'';
  const mmBtn=!DATA.closed&&ch.key!=='COUPON'?
    `<button class="btn btn-sm" onclick="event.stopPropagation();openMatcher(${i})">🔧 จับคู่ละเอียด</button>`:'';
  // คูปอง: แต้ม KTC/BAY ตรวจอัตโนมัติแล้ว — ลิงก์หน้าเดิมไว้ดูคูปองซีรีส์อื่น
  const cpBtn=ch.key==='COUPON'?
    `<a class="btn btn-sm" href="/app/classic.html#coupon" onclick="event.stopPropagation()">🎟️ รายละเอียดคูปอง ↗</a>`:'';
  el.innerHTML=`
  ${codes||xferBankRow||feeBtn||mmBtn||cpBtn?`<div class="row" style="padding:10px 14px 0">${codes?`<span class="lbl">ที่มา POS:</span> ${codes}`:''} ${xferBankRow} ${feeBtn} ${mmBtn} ${cpBtn}</div>`:''}
  <div id="codedaily-${i}" style="padding:0 14px"></div>
  ${c3}${pt}${cash3}${cpCards}
  <div id="fees-${i}"></div>
  <div id="matcher-${i}"></div>
  <div class="daygrid">${ch.days.map(d=>`
    <div class="daycell d-${d.status}" onclick="event.stopPropagation();openDay(${i},'${d.day}')">
      <b>${+d.day.slice(8)}</b> <span class="lbl">${{ok:'✓',diff:'≠',waiting:'⏳',setup:'?',no_source:'·'}[d.status]||''}</span>
      <div class="mono" style="font-size:11px">${fmt(d.pos)}</div>
      ${d.status==='diff'?`<div class="mono" style="font-size:11px;color:var(--err)">${d.variance>0?'+':''}${fmt(d.variance)}</div>`:''}
    </div>`).join('')}</div>
  <div id="daylines-${i}" style="padding:0 12px 12px"></div>`;
  el.style.display='';
}

/* ── ขั้น 2 ของ Grab/Line Man: ยอดสุทธิรายวัน ↔ เงินเข้าธนาคาร (รวมวันได้) ── */
function payoutTraceHtml(ch){
  if(!(ch.key==='GRAB'||ch.key==='LINEMAN')||!ch.payout_trace)return '';
  const p=ch.payout_trace;
  if(!p.payouts||!p.payouts.length)return '';
  return `<div style="padding:6px 18px 10px">
    <div class="lbl" style="margin-bottom:4px"><b>ขั้น 1</b>: สรุปยอด ${esc(ch.label)} ↔ POS (gross ก่อนค่าธรรมเนียม+VAT — ดูตัวเลขด้านบน) ·
      <b>ขั้น 2</b>: ยอดสุทธิ ↔ เงินเข้า KBANK (โอนวันถัดไป อาจรวม 2 วัน)</div>
    <div class="card" style="padding:0;box-shadow:none;max-height:250px;overflow:auto"><table>
      <tr><th>วันขาย</th><th>ยอดสุทธิ</th><th>เงินเข้า</th><th>วันที่เงินเข้า</th><th>สถานะ</th></tr>
      ${p.payouts.map(x=>`<tr>
        <td style="text-align:left">${x.days.map(d=>+d.day.slice(8)).join('+')}
          ${x.combined?`<span class="chip c-mut">รวม ${x.days.length} วัน</span>`:''}</td>
        <td class="mono">${fmt(x.group_net)}</td>
        <td class="mono">${x.amount?fmt(x.amount):'—'}</td>
        <td>${x.payout_date?x.payout_date.slice(5):'—'}${x.lag?` <span class="lbl">ช้า ${x.lag} วัน</span>`:''}</td>
        <td>${x.status==='matched'?'<span class="chip c-ok">✓ ตรง</span>':'<span class="chip c-warn">รอเงินเข้า</span>'}</td>
      </tr>`).join('')}
    </table></div>
    <div class="lbl" style="margin-top:3px">สุทธิรวม ${fmt(p.net_total)} · เข้าบัญชีแล้ว ${fmt(p.payout_total)}${p.awaiting_total>0?` · รอเข้า ${fmt(p.awaiting_total)}`:''}</div>
  </div>`;
}

/* ── เงินสด 3 ทาง: POS ↔ สลิปนำฝาก (พิมพ์ยอด) ↔ เงินเข้าธนาคาร ── */
function cashThreeWayHtml(ch, chIdx){
  if(ch.key!=='CASH'||!(ch.cash_three_way||[]).length)return '';
  const SLIP_CHIP={matched:r=>`<span class="chip c-ok">✓${r.slip_variance?` ต่าง ${r.slip_variance>0?'+':''}${fmt(r.slip_variance)}`:''}</span>`,
    variance:r=>`<span class="chip c-err">ต่าง ${r.slip_variance>0?'+':''}${fmt(r.slip_variance)}</span>`,
    slip_only:()=>'<span class="chip c-warn">ไม่มียอด POS</span>',
    no_slip:()=>'<span class="chip c-mut">ยังไม่ใส่</span>'};
  const BANK_CHIP={matched:()=>'<span class="chip c-ok">✓ เข้าแล้ว</span>',
    variance:r=>`<span class="chip c-err">ต่าง ${r.bank_variance>0?'+':''}${fmt(r.bank_variance)}</span>`,
    pending:()=>'<span class="chip c-warn">รอเงินเข้า</span>',none:()=>'<span class="lbl">—</span>'};
  return `<div style="padding:6px 18px 10px">
    <div class="lbl" style="margin-bottom:4px">3 ทาง: POS เงินสด ↔ สลิปนำฝาก (พิมพ์ยอดจากสลิป) ↔ เงินเข้าธนาคาร — ฝากวันถัดไปก่อน 13:00</div>
    <div class="card" style="padding:0;box-shadow:none;max-height:300px;overflow:auto"><table>
      <tr><th>วัน</th><th>POS เงินสด</th><th>สลิปนำฝาก</th><th>เงินเข้า</th><th>ฝากเมื่อ</th><th>สถานะเงินเข้า</th><th>📷</th></tr>
      ${ch.cash_three_way.map(r=>{
        const slipCell=DATA.closed
          ?`<span class="mono">${r.slip_amount!=null?fmt(r.slip_amount):'—'}</span>`
          :`<input class="fee-in" type="number" step="0.01" min="0" value="${r.slip_amount!=null?r.slip_amount:''}"
              placeholder="ยอดสลิป" onchange="saveSlip('${r.day}',this)">`;
        const photoBtn=`<label class="btn btn-sm" title="แนบรูปสลิปนำฝาก" style="cursor:pointer;padding:2px 6px">📷<input type="file" accept="image/*,.pdf" style="display:none" onchange="attachSlip('${r.day}',this)"></label>`;
        return `<tr><td><b>${+r.day.slice(8)}</b></td>
          <td class="mono">${fmt(r.pos_cash)}</td>
          <td>${slipCell} ${(SLIP_CHIP[r.slip_leg]||(()=>''))(r)}</td>
          <td class="mono">${r.bank_deposit!=null?fmt(r.bank_deposit):'—'}</td>
          <td>${r.deposit_date?r.deposit_date.slice(8)+(r.deposit_combined?' <span class="lbl">(ฝากรวมวัน)</span>':''):'—'}</td>
          <td>${(BANK_CHIP[r.bank_leg]||(()=>''))(r)}</td>
          <td>${photoBtn}</td></tr>`;}).join('')}
    </table></div>
    <div class="lbl" style="margin-top:3px">สลิปต่างจาก POS ได้ไม่เกิน ±฿10 — พิมพ์แล้วบันทึกอัตโนมัติ · ไม่ใส่สลิปไม่บล็อกการปิดเดือน</div>
  </div>`;
}
async function saveSlip(day,input){
  if(input.value==='')return;
  const amt=parseFloat(input.value);
  if(isNaN(amt)||amt<=0){toast('ยอดสลิปไม่ถูกต้อง');return;}
  try{await api('/api/deposit-slips',{method:'POST',body:{branch_id:DATA.branch_id,sale_day:day,amount:amt}});
      toast('บันทึกสลิปแล้ว');route();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);hint403(e);}
}
async function attachSlip(day,input){
  const file=input.files[0];
  if(!file)return;
  const fd=new FormData();
  fd.append('branch_id',DATA.branch_id);fd.append('day',day);fd.append('file',file);
  try{await api('/api/attachments',{method:'POST',body:fd});toast('แนบรูปสลิปแล้ว');}
  catch(e){toast('แนบรูปไม่สำเร็จ: '+e.message);hint403(e);}
  input.value='';
}

/* ── คูปอง: การ์ดแต้ม KTC/BAY (วิธี issuer_points ตามตารางเจ้าของ) ── */
const IP_CHIP={matched:'<span class="chip c-ok">✓ ตรง</span>',mismatch:'<span class="chip c-err">≠ ต่าง</span>',
  waiting_doc:'<span class="chip c-warn">รอใบสรุปคะแนน</span>',awaiting_payout:'<span class="chip c-warn">รอเงินเข้า</span>',
  ext_only:'<span class="chip c-warn">ไม่มียอด POS</span>'};
function couponCardsHtml(ch){
  if(ch.key!=='COUPON'||!(ch.issuer_points||[]).length)return '';
  return `<div class="c3">${ch.issuer_points.map(r=>`
    <div class="card"><b>แต้มบัตร ${esc(r.issuer)}</b>
      <div class="row" style="justify-content:space-between">ใช้แต้มบน POS <span class="mono">${fmt(r.pos_point)}</span></div>
      <div class="row" style="justify-content:space-between">ใบสรุปคะแนน <span class="mono">${fmt(r.settle_gross)}</span> ${IP_CHIP[r.status]||''}</div>
      ${r.bank_in_credit
        ?'<div class="lbl">เงินคืนแต้มรวมอยู่ในยอดฝากบัตร KTC (ดูช่องบัตรเครดิต)</div>'
        :`<div class="row" style="justify-content:space-between">เงินเข้า KBANK <span class="mono">${fmt(r.bank_payout)}</span></div>`}
    </div>`).join('')}</div>`;
}

/* ── ค่าธรรมเนียม & VAT (บัตร / Grab / Line Man) ── */
async function loadFees(i){
  const ch=DATA.channels[i], src=FEE_SOURCE[ch.key];
  const box=$('fees-'+i);
  if(box.innerHTML){box.innerHTML='';return;}
  box.innerHTML='<div class="muted" style="padding:8px 14px">กำลังโหลด…</div>';
  let lines;try{lines=await api(`/api/lines/${src}?branch_id=${DATA.branch_id}&period_month=${MONTH}`);}
  catch(e){box.innerHTML=`<div class="chip c-err" style="margin:8px 14px">โหลดไม่ได้: ${esc(e.message)}</div>`;return;}
  if(!lines.length){box.innerHTML='<div class="muted" style="padding:8px 14px">ยังไม่มีรายการ (อัปโหลดเอกสารก่อน)</div>';return;}
  box.innerHTML=`<div style="padding:8px 12px"><div class="card" style="padding:0;max-height:300px;overflow:auto"><table>
    <tr><th>วันที่</th><th>อ้างอิง</th><th>ยอดเต็ม</th><th>ค่าธรรมเนียม</th><th>VAT</th><th>สุทธิ</th></tr>
    ${lines.map(l=>`<tr data-gross="${l.gross}" data-other="${l.other||0}">
      <td>${l.date}</td><td style="text-align:left">${esc(l.ref)}</td>
      <td class="mono">${fmt(l.gross)}</td>
      <td><input class="fee-in" type="number" step="0.01" value="${l.fee!=null?l.fee:l.fee_parsed}"
           onchange="saveFee('${src}',${l.id},this)"></td>
      <td><input class="fee-in" type="number" step="0.01" value="${l.vat!=null?l.vat:l.vat_parsed}"
           onchange="saveFee('${src}',${l.id},this)"></td>
      <td class="mono" id="net-${src}-${l.id}">${fmt(l.net)}</td>
    </tr>`).join('')}
  </table></div>
  <div class="muted" style="margin-top:4px">แก้แล้วบันทึกอัตโนมัติ — ยอดสุทธิ (หลังหักค่าธรรมเนียม) คือตัวที่เทียบกับเงินเข้าบัญชี</div></div>`;
}
async function saveFee(src,id,input){
  const row=input.closest('tr');
  const ins=row.querySelectorAll('input');
  const fee=parseFloat(ins[0].value), vat=parseFloat(ins[1].value);
  if(isNaN(fee)||isNaN(vat)||fee<0||vat<0){toast('ตัวเลขไม่ถูกต้อง');return;}
  try{await api(`/api/lines/${src}/${id}/fee-vat`,{method:'PATCH',body:{fee_manual:fee,vat_manual:vat}});
      const net=(+row.dataset.gross)-fee-vat-(+row.dataset.other);
      $('net-'+src+'-'+id).textContent=fmt(net);
      toast('บันทึกค่าธรรมเนียมแล้ว');}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

async function openDay(i,day){
  const ch=DATA.channels[i];
  const box=$('daylines-'+i);
  box.innerHTML='<div class="muted">กำลังโหลด…</div>';
  const d=ch.days.find(x=>x.day===day);
  let lines=[];
  for(const b of d.banks){
    try{const r=await api(`/api/v2/lane?branch_id=${DATA.branch_id}&month=${MONTH}&category=${ch.key}&bank=${b}&day=${day}`);
        lines.push(...r.lines.map(l=>({...l,bank:b})));}catch(e){}
  }
  // ฝั่ง POS รายบิล — แตกยอดขายของวันนี้เป็นใบเสร็จ (จาก sale_payment, tie-out ตรงกับ d.pos)
  let pos=null;
  try{pos=await api(`/api/v2/pos-lines?branch_id=${DATA.branch_id}&month=${MONTH}&category=${ch.key}&day=${day}`);}catch(e){}
  // Phase 4 #4: hint pairs — unmatched bank line equal to an unmatched POS-code amount (±฿1).
  // Advisory chip only (no auto-tick); confirm still flows through manualMatchDay().
  const _posAmts=(pos&&pos.by_code?pos.by_code:[]).map(b=>Math.round(b.amount));
  const _hintJ=new Set();
  lines.forEach((l,j)=>{
    if(l.match_status==='manual'||l.match_status==='matched')return;
    if(_posAmts.some(a=>Math.abs(a-Math.round(l.amount))<=1)) _hintJ.add(j);
  });
  window._DAY={i,day,lines,key:ch.key};
  const varCol=Math.abs(d.variance)<=100?'var(--ok)':'var(--err)';
  box.innerHTML=`<div class="card" style="background:#fafafa">
    <div class="row" style="margin-bottom:6px"><b style="font-size:13.5px">${day} · ${esc(ch.label)}</b>
      <span class="lbl">POS ${fmt(d.pos)}${pos&&pos.count?` · ${pos.count} บิล`:''} · เข้าจริง ${fmt(d.ext)} ·
        ต่าง <span style="color:${varCol};font-weight:600">${d.variance>0?'+':''}${fmt(d.variance)}</span></span></div>
    ${posDayHtml(pos,i)}
    <div class="lbl" style="margin:10px 0 4px"><b>② เงินเข้าธนาคาร</b> (สเตทเมนต์) — ติ๊กเพื่อจับคู่กับยอด POS วันนี้</div>
    ${lines.length?`<table>${lines.map((l,j)=>`<tr>
      <td style="width:26px">${!DATA.closed&&l.id&&l.match_status!=='manual'?`<input type="checkbox" data-j="${j}" onchange="updMatchBar()">`:''}</td>
      <td style="text-align:left">${esc(l.ref||'')}<span class="lbl"> ${esc(l.bank)}${l.match_status==='manual'?' · จับคู่แล้ว':''}</span>${_hintJ.has(j)?` <span class="chip c-ok" style="font-size:11px;padding:2px 7px" title="ยอดตรงกับยอดขาย POS วันนี้ — ติ๊กแล้วกดจับคู่เพื่อยืนยัน">น่าจะคู่กัน</span>`:''}</td>
      <td>${l.date}</td>
      <td class="mono">${fmt(l.amount)}</td>
      <td style="width:90px">${!DATA.closed&&l.id?`<button class="btn btn-sm" onclick="ignoreLine(${l.id})">ตัดออก</button>`:''}</td>
    </tr>`).join('')}</table>
    <div id="match-bar" class="row" style="margin-top:8px;display:none">
      <span class="lbl" id="match-sum"></span>
      <button class="btn btn-sm btn-pri" onclick="manualMatchDay()">🔗 จับคู่กับยอด POS วันนี้</button>
    </div>`
    :'<div class="muted">ไม่มีบรรทัดเงินเข้าของวันนี้ (รอเอกสาร หรือยอดถูกฝากรวมวันอื่น)</div>'}
  </div>`;
}

/* ── ฝั่ง POS รายบิล: จัดกลุ่มตามรหัสชำระ คลิกขยายดูใบเสร็จรายใบ ── */
function posDayHtml(pos,i){
  if(!pos||!pos.count){
    // Distinguish "POS is synced but this lane genuinely has no bills today"
    // (normal for an ext_only / internal-transfer lane) from "POS truly not
    // synced". The old copy always said "not synced" and triggered false alarms.
    return DATA.pos_daily_available
      ? '<div class="lbl" style="margin:2px 0 4px"><b>① ยอดขาย POS</b> — ไม่มีบิล POS ของช่องทางนี้ในวันนี้ (เงินเข้าโดยไม่มียอดขาย POS)</div>'
      : '<div class="lbl" style="margin:2px 0 4px"><b>① ยอดขาย POS</b> — ยังไม่ได้ sync ข้อมูล POS</div>';
  }
  const rows=pos.by_code.map((b,k)=>{
    const recs=pos.lines.filter(l=>l.code===b.code);
    return `<tr class="grid-ch" style="display:table-row;cursor:pointer" onclick="togglePosCode(${i},${k})">
        <td style="text-align:left"><span class="lbl" id="poscar-${i}-${k}">▸</span> ${esc(b.code)}
          <span class="lbl">${esc(b.bank)}</span></td>
        <td class="mono">${fmt(b.amount)}</td><td class="lbl">${b.count} บิล</td></tr>
      <tr id="poscode-${i}-${k}" style="display:none"><td colspan="3" style="padding:0;background:#fff">
        <div style="max-height:180px;overflow:auto"><table>${recs.map(l=>`<tr>
          <td style="text-align:left;font-size:12px;color:var(--sub)">${esc(l.receipt_no)}</td>
          <td class="mono" style="font-size:12px">${fmt(l.amount)}</td></tr>`).join('')}</table></div></td></tr>`;
  }).join('');
  return `<div class="lbl" style="margin:2px 0 4px"><b>① ยอดขาย POS รายบิล</b> — รวม ${fmt(pos.total)}${pos.truncated?' · แสดงบางส่วน':''} (คลิกรหัสเพื่อดูใบเสร็จ)</div>
    <div class="card" style="padding:0;box-shadow:none;max-height:240px;overflow:auto"><table>
      <tr><th>รหัสชำระ</th><th>ยอด</th><th>จำนวนบิล</th></tr>${rows}</table></div>`;
}
function togglePosCode(i,k){
  const e=$(`poscode-${i}-${k}`),car=$(`poscar-${i}-${k}`);
  if(!e)return;
  const show=e.style.display==='none';
  e.style.display=show?'':'none';
  if(car)car.textContent=show?'▾':'▸';
}

/* ── คลิกชิปรหัส POS → ยอดรายวันของรหัสนั้นทั้งเดือน (by_day ไม่ถูก truncate) ── */
async function toggleCodeDaily(i,code){
  const box=$('codedaily-'+i);
  if(box.dataset.code===code){box.innerHTML='';box.dataset.code='';return;}
  box.dataset.code=code;
  box.innerHTML='<div class="muted" style="padding:6px 0">กำลังโหลด…</div>';
  let r;try{r=await api(`/api/v2/pos-lines?branch_id=${DATA.branch_id}&month=${MONTH}&category=${DATA.channels[i].key}&code=${encodeURIComponent(code)}`);}
  catch(e){box.innerHTML=`<div class="chip c-err" style="margin:6px 0">${esc(e.message)}</div>`;return;}
  const days=r.by_day||[];
  if(!days.length){box.innerHTML='<div class="muted" style="padding:6px 0">ไม่มียอดของรหัสนี้</div>';return;}
  box.innerHTML=`<div class="card" style="padding:8px 10px;margin:6px 0;box-shadow:none;background:#fafafa">
    <div class="row" style="margin-bottom:4px"><b style="font-size:13px">${esc(code)} · ยอดรายวัน</b>
      <span class="lbl">รวม ${fmt(r.total)} · ${r.count} บิล${r.truncated?' (ใบเสร็จแสดงบางส่วน)':''}</span>
      <a href="#" class="lbl" style="margin-left:auto" onclick="toggleCodeDaily(${i},'${esc(code)}');return false">ปิด</a></div>
    <div style="max-height:220px;overflow:auto"><table><tr><th>วัน</th><th>ยอด</th></tr>
    ${days.map(x=>`<tr><td>${+x.day.slice(8)}</td><td class="mono">${fmt(x.amount)}</td></tr>`).join('')}</table></div></div>`;
}
function updMatchBar(){
  const ck=[...document.querySelectorAll('#daylines-'+window._DAY.i+' input[type=checkbox]:checked')];
  const bar=$('match-bar');if(!bar)return;
  if(!ck.length){bar.style.display='none';return;}
  const sum=ck.reduce((a,c)=>a+window._DAY.lines[+c.dataset.j].amount,0);
  $('match-sum').textContent=`เลือก ${ck.length} รายการ รวม ${fmt(sum)} บาท`;
  bar.style.display='flex';
}
async function manualMatchDay(){
  const D=window._DAY;
  const ck=[...document.querySelectorAll('#daylines-'+D.i+' input[type=checkbox]:checked')];
  if(!ck.length)return;
  const sel=ck.map(c=>D.lines[+c.dataset.j]);
  const banks=[...new Set(sel.map(l=>l.bank))];
  if(banks.length>1){toast('เลือกได้ทีละธนาคาร');return;}
  const ch=DATA.channels[D.i];
  const d=ch.days.find(x=>x.day===D.day);
  const sum=sel.reduce((a,l)=>a+l.amount,0);
  const posAmt=Math.min(d.pos,sum);
  if(posAmt<=0){toast('วันนี้ไม่มียอด POS ให้จับคู่');return;}
  const note=prompt(`จับคู่ ${sel.length} รายการ (${fmt(sum)}) กับยอด POS วันที่ ${D.day} (${fmt(posAmt)})\nหมายเหตุ:`,'');
  if(note===null)return;
  try{await api('/api/manual',{method:'POST',body:{branch_id:DATA.branch_id,period_month:MONTH,
      category:D.key,bank:banks[0],pos_days:[{day:D.day,amount:posAmt}],
      ext:sel.map(l=>({table:'recon_bank_lines',id:l.id,amount:l.amount})),note:note||'v2 day match'}});
      toast('จับคู่แล้ว');route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── ตัวจับคู่ละเอียด (ยกความสามารถ manual matcher เดิมเข้ามา) ──
   เลือกหลายวัน POS (แบ่งยอดบางส่วนได้) จับกับหลายบรรทัดเอกสาร — เคสยอดก้อนเดียว
   ครอบหลายวัน / เงินเข้าเป็นงวด ที่ตัวจับคู่แบบง่ายในหน้า drill เอาไม่อยู่ */
let _MM=null;
async function openMatcher(i,bank){
  const ch=DATA.channels[i];
  const box=$('matcher-'+i);
  if(box.innerHTML&&!bank){box.innerHTML='';_MM=null;return;}
  const bankList=[...new Set((ch.banks||[]).map(b=>b.bank))];
  if(!bank){
    if(bankList.length>1){
      box.innerHTML=`<div class="row" style="padding:8px 14px"><span class="lbl">เลือกธนาคาร/ผู้รับบัตร:</span>
        ${bankList.map(b=>`<button class="btn btn-sm" onclick="openMatcher(${i},'${esc(b)}')">${esc(b)}</button>`).join('')}</div>`;
      return;
    }
    bank=bankList[0]||'NONE';
  }
  box.innerHTML='<div class="muted" style="padding:8px 14px">กำลังโหลด…</div>';
  let d;try{d=await api(`/api/manual?branch_id=${DATA.branch_id}&category=${ch.key}&bank=${encodeURIComponent(bank)}&period_month=${MONTH}`);}
  catch(e){box.innerHTML=`<div class="chip c-err" style="margin:8px 14px">${esc(e.message)}</div>`;return;}
  _MM={i,bank,cat:ch.key,pos:d.pos_days,ext:d.ext_lines};
  const posRows=d.pos_days.filter(p=>p.remaining>0.5).map((p,j)=>`
    <tr><td><input type="checkbox" data-pj="${j}" onchange="mmSum()"></td>
      <td>${p.day}</td><td class="mono">${fmt(p.remaining)}</td>
      <td><input class="fee-in" type="number" step="0.01" max="${p.remaining}" value="${p.remaining}" data-pamt="${j}" oninput="mmSum()"></td></tr>`).join('');
  const extRows=d.ext_lines.filter(l=>l.match_status!=='manual').map((l,j)=>{
    const done=l.match_status==='matched';   // จับคู่อัตโนมัติแล้ว — ติ๊กซ้ำ = นับสองรอบ
    return `<tr style="${done?'opacity:.45':''}">
      <td>${done?'<span class="lbl" title="จับคู่อัตโนมัติแล้ว">✓</span>':`<input type="checkbox" data-ej="${j}" onchange="mmSum()">`}</td>
      <td>${l.date}</td><td style="text-align:left;max-width:170px;overflow:hidden" title="${esc(l.ref)}">${esc(l.ref)}</td>
      <td class="mono">${fmt(l.amount)}</td></tr>`;}).join('');
  const matches=(d.matches||[]).map(m=>`
    <div class="row" style="font-size:12.5px;padding:3px 0">
      🔗 POS ${fmt(m.pos_amount)} ↔ เอกสาร ${fmt(m.ext_amount)}
      <span class="lbl">${esc(m.note||'')}</span>
      ${DATA.closed?'':`<button class="btn btn-sm" style="margin-left:auto" onclick="mmDelete(${m.match_id})">ยกเลิก</button>`}
    </div>`).join('');
  box.innerHTML=`<div class="card" style="margin:8px 12px;background:#fafafa">
    <div class="row" style="margin-bottom:6px"><b style="font-size:13.5px">จับคู่ละเอียด — ${esc(ch.label)} · ${esc(bank)}</b>
      <a href="#" class="lbl" style="margin-left:auto" onclick="openMatcher(${i});return false">ปิด</a></div>
    ${matches?`<div style="border-bottom:1px dashed var(--line);margin-bottom:6px;padding-bottom:4px">${matches}</div>`:''}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><div class="lbl" style="margin-bottom:4px">① ยอด POS (เลือกวัน — แก้จำนวนได้ถ้าจับแค่บางส่วน)</div>
        <div style="max-height:220px;overflow:auto"><table>
          <tr><th></th><th>วัน</th><th>คงเหลือ</th><th>ใช้</th></tr>${posRows||'<tr><td colspan=4 class="muted">ไม่มียอดค้าง</td></tr>'}
        </table></div></div>
      <div><div class="lbl" style="margin-bottom:4px">② บรรทัดเอกสาร</div>
        <div style="max-height:220px;overflow:auto"><table>
          <tr><th></th><th>วัน</th><th>อ้างอิง</th><th>ยอด</th></tr>${extRows||'<tr><td colspan=4 class="muted">ไม่มีบรรทัดให้จับ</td></tr>'}
        </table></div></div>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="lbl" id="mm-sum">เลือกทั้งสองฝั่งเพื่อจับคู่</span>
      <input id="mm-note" placeholder="หมายเหตุ" style="flex:1;min-width:120px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px">
      <button class="btn btn-sm btn-pri" id="mm-go" disabled onclick="mmSubmit()">🔗 จับคู่</button>
    </div></div>`;
}
function _mmPick(){
  const box=$('matcher-'+_MM.i);
  const posOk=_MM.pos.filter(p=>p.remaining>0.5);
  const pos=[...box.querySelectorAll('input[data-pj]:checked')].map(c=>{
    const j=+c.dataset.pj;
    const amt=parseFloat(box.querySelector(`input[data-pamt="${j}"]`).value)||0;
    return {day:posOk[j].day, amount:Math.min(amt,posOk[j].remaining)};
  }).filter(x=>x.amount>0);
  const extOk=_MM.ext.filter(l=>l.match_status!=='manual');
  const ext=[...box.querySelectorAll('input[data-ej]:checked')].map(c=>{
    const l=extOk[+c.dataset.ej];
    return {table:l.table, id:l.id, amount:l.amount};
  });
  return {pos,ext};
}
function mmSum(){
  if(!_MM)return;
  const {pos,ext}=_mmPick();
  const ps=pos.reduce((a,x)=>a+x.amount,0), es=ext.reduce((a,x)=>a+x.amount,0);
  const el=$('mm-sum'), go=$('mm-go');
  if(!pos.length||!ext.length){el.textContent='เลือกทั้งสองฝั่งเพื่อจับคู่';go.disabled=true;return;}
  const diff=es-ps;
  el.innerHTML=`POS ${fmt(ps)} ↔ เอกสาร ${fmt(es)} <span style="color:${Math.abs(diff)<=50?'var(--ok)':'var(--err)'}">(ต่าง ${diff>0?'+':''}${fmt(diff)})</span>`;
  go.disabled=false;
}
async function mmSubmit(){
  const {pos,ext}=_mmPick();
  if(!pos.length||!ext.length)return;
  try{await api('/api/manual',{method:'POST',body:{branch_id:DATA.branch_id,period_month:MONTH,
      category:_MM.cat,bank:_MM.bank,pos_days:pos,ext:ext,
      note:$('mm-note').value||'v2 จับคู่ละเอียด'}});
      toast('จับคู่แล้ว');route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function mmDelete(mid){
  if(!confirm('ยกเลิกการจับคู่นี้?'))return;
  try{await api(`/api/manual/${mid}`,{method:'DELETE'});toast('ยกเลิกแล้ว');route();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

async function ignoreLine(id){
  if(!confirm('ยืนยัน: บรรทัดนี้ไม่ใช่ยอดขาย (เช่น โอนภายใน)?'))return;
  try{await api(`/api/bank-lines/${id}/ignore`,{method:'PATCH',body:{ignored:true,note:'v2: not revenue'}});
      toast('ตัดออกแล้ว');route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

async function applySugg(mapId,cat,bank){
  try{await api(`/api/payment-map/${mapId}`,{method:'PATCH',body:{category:cat,bank:bank}});
      toast('บันทึกแล้ว');route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
function toggleMapper(qi){const e=$('mapper-'+qi);e.style.display=e.style.display==='none'?'flex':'none';}
async function applyMapper(qi,code){
  const cat=$('map-cat-'+qi).value, bank=$('map-bank-'+qi).value;
  try{
    // มีแถวใน map แล้ว (เช่น bank=UNKNOWN) → PATCH; ยังไม่มีเลย → POST สร้างใหม่
    const all=await api('/api/payment-map');
    const hit=all.find(m=>m.payment_code_norm===code);
    if(hit) await api(`/api/payment-map/${hit.id}`,{method:'PATCH',body:{category:cat,bank:bank}});
    else    await api('/api/payment-map',{method:'POST',body:{payment_code_norm:code,category:cat,bank:bank,reconcile:1}});
    toast(`ตั้งค่า ${code} → ${cat}·${bank} แล้ว`);route();
  }catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── สถานะ session: ส่งตรวจ → ปิดเดือน ── */
async function ensureSession(bid){
  if(DATA.session)return DATA.session.session_id;
  const s=await api('/api/sessions',{method:'POST',body:{branch_id:bid,period_month:MONTH}});
  return s.session_id;
}
function stForm(status,by){const fd=new FormData();fd.append('status',status);if(by)fd.append('approved_by',by);return fd;}
async function setSt(bid,st){
  try{const sid=await ensureSession(bid);
      await api(`/api/sessions/${sid}/status`,{method:'PATCH',body:stForm(st)});
      toast(st==='in_review'?'ส่งตรวจแล้ว':'ส่งกลับแก้แล้ว');route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function closeMonth(bid){
  const who=prompt('ชื่อผู้จัดการที่อนุมัติ:');
  if(who===null)return;
  if(!who.trim()){toast('ต้องใส่ชื่อผู้อนุมัติ');return;}
  if(!confirm('ปิดเดือน: บันทึกผลถาวร ออกไฟล์ Excel ได้ และล็อกการแก้ไขทั้งเดือนนี้ ยืนยัน?'))return;
  try{
    const sid=await ensureSession(bid);
    await api(`/api/sessions/${sid}/run-match`,{method:'POST'});   // snapshot at close
    await approveWithManagerCode(sid,who.trim());
    toast('ปิดเดือนแล้ว');route();
  }catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function approveWithManagerCode(sid,who){
  // ลองด้วยรหัสที่จำไว้ก่อน; ถ้าเซิร์ฟเวอร์ขอรหัสผู้จัดการ (403) ค่อยถาม แล้วลองใหม่
  let code=sessionStorage.getItem('mgr_code')||'';
  for(let attempt=0;attempt<2;attempt++){
    try{
      await api(`/api/sessions/${sid}/status`,
        {method:'PATCH',body:stForm('approved',who),headers:code?{'X-Manager-Token':code}:{}});
      if(code)sessionStorage.setItem('mgr_code',code);
      return;
    }catch(e){
      if(!String(e.message).includes('ผู้จัดการ')||attempt===1)throw e;
      code=prompt('ใส่รหัสผู้จัดการเพื่อปิดเดือน:')||'';
      if(!code)throw new Error('ยกเลิก — ไม่ได้ใส่รหัสผู้จัดการ');
    }
  }
}

route();
</script>
