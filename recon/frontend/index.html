<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กระทบยอด — Oshinei</title>
<!-- The dashboard's design kit (docs/ui-kit, mounted at /app/ui-kit by recon/main.py):
     tokens.css = colours / radii / shadows for light AND body.dark; theme-groups.css = group hues
     (recon is the "money" group). recon's own names below are aliases of these tokens. -->
<link rel="stylesheet" href="ui-kit/tokens.css">
<link rel="stylesheet" href="ui-kit/theme-groups.css">
<link rel="stylesheet" href="vendor/kira-ui.css">
<link rel="stylesheet" href="vendor/tabler-icons.min.css">
<style>
/* Tokens (2026-10 UX phase 1): recon wears the dashboard's design kit. Every recon name is an
   ALIAS of a kit token (ui-kit/tokens.css), declared on BOTH :root and body.dark so the dark
   theme re-resolves them against the kit's dark values. The fallbacks only matter if the kit
   folder is missing (then the page stays light). Text colours are always one of these inks. */
:root,body.dark{
  --brand:var(--accent,#1f3a6b);--brand-deep:var(--accent-hover,#16294d);--brand-soft:var(--accent-soft,#e8eef7);
  --on-brand:var(--on-accent,#fff);
  --ok:var(--good-ink,#047857);--warn:var(--amber-ink,#a44a08);--err:var(--bad-ink,#b91c1c);--info:var(--sky-ink,#0369a1);
  --bg:var(--bg-page,#f0f4f8);--card:var(--bg-card,#fff);--input:var(--bg-input,#fff);
  --subtle:var(--bg-subtle,#f8fafc);--hover:var(--bg-hover,#eef2f7);
  --line:var(--border,#d5dbe3);--line-soft:var(--border-soft,#e6eaf0);--line-ctl:var(--border-control,#7d8aa0);
  --txt:var(--text-primary,#0f172a);--sub:var(--text-secondary,#475569);--mut:var(--text-muted,#5f6c80);
  --radius:var(--r-md,12px);--radius-sm:var(--r-sm,8px);--radius-lg:var(--r-lg,16px);
  --shadow:var(--shadow-card,none);
  /* the money group's hue (ui-kit/theme-groups.css, body[data-group="money"]) */
  --place:var(--group,#c2413b)}
/* recon-local status tints (the kit has no soft good/bad/amber/info backgrounds) */
:root{
  --ok-bg:#ecfdf5;--warn-bg:#fdf6ea;--err-bg:#fdf0ef;--info-bg:#eef4fb;--ok-line:#a7f3d0;
  /* data marks (day-cell edges, progress fills): bright fills, never text; same in both themes */
  --mark-ok:#10b981;--mark-err:#ef4444;--mark-warn:#f59e0b;--mark-info:#3b82f6;
  --nav-h:58px}
body.dark{--ok-bg:#0f2f29;--warn-bg:#33270f;--err-bg:#3a1b20;--info-bg:#132a47;--ok-line:#1f5c4a;
  color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:'KIRA UI','Noto Sans Thai','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.ti{vertical-align:-.125em;line-height:1}
.wrap{max-width:1080px;margin:0 auto;padding:24px 22px 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:18px 22px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.muted{color:var(--sub);font-size:13px}
.lbl{font-size:11.5px;color:var(--mut);font-weight:500}

/* ตัวเลขเงิน: tabular-nums หลักตรงกันทุกแถว กวาดตาเทียบได้ */
.mono,.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{text-align:right;font-size:14.5px;font-weight:500}

/* status chips — พื้นอ่อน ตัวอักษรเข้ม อ่านชัดไม่แสบตา */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:var(--radius-sm);white-space:nowrap;border:none;line-height:1.5;
  font-family:inherit}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-err{background:var(--err-bg);color:var(--err)}
.c-mut{background:var(--line-soft);color:var(--sub)}
.c-setup{background:var(--info-bg);color:var(--info)}
button.chip{cursor:pointer;transition:filter .12s}
button.chip:hover{filter:brightness(.95)}

.btn{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:8px 15px;
  cursor:pointer;font-size:13.5px;font-weight:500;font-family:inherit;color:var(--txt);
  transition:background .12s,border-color .12s}
.btn:hover{background:var(--line-soft);border-color:var(--line-ctl)}
.btn-pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn-pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn-sm{font-size:12px;padding:4px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ตารางช่องทาง — แถวโปร่ง ชื่อเด่น ตัวเลขใหญ่ */
.grid-ch{display:grid;grid-template-columns:1.45fr 1fr 1fr 1.35fr 20px;gap:10px;
  align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-soft);
  cursor:pointer;transition:background .12s}
.grid-ch:hover{background:var(--hover)}
.grid-ch:last-child{border-bottom:none}
.ch-name{font-size:15px;font-weight:600}
.grid-ch .num{font-size:15px}

/* ปฏิทินวัน */
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px;padding:14px 18px}
.daycell{border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 9px;font-size:12px;
  cursor:pointer;background:var(--card);transition:border-color .12s,box-shadow .12s}
.daycell:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.daycell b{font-size:13.5px}
.d-ok{border:1px solid var(--mark-ok)}.d-diff{border-left:4px solid var(--mark-err)}
.d-waiting{border-left:4px solid var(--mark-warn)}.d-setup{border-left:4px solid var(--mark-info)}

.prog{height:9px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;min-width:90px}
.prog>div{height:100%;background:var(--mark-ok);border-radius:4px}
.prog.p-warn>div{background:var(--mark-warn)}.prog.p-err>div{background:var(--mark-err)}

table{border-collapse:collapse;width:100%}
td,th{padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line-soft);text-align:right}
th{font-size:11.5px;font-weight:600;color:var(--mut)}
td:first-child,th:first-child{text-align:left}
td.mono{font-variant-numeric:tabular-nums}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--txt);
  color:var(--card);padding:11px 20px;border-radius:var(--radius);font-size:13.5px;opacity:0;
  transition:opacity .12s;pointer-events:none;z-index:50;box-shadow:0 8px 24px rgba(15,23,42,.25)}
.toast.show{opacity:1}

.todo-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.todo-item:last-child{border-bottom:none}
.sugg{background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:var(--radius);padding:11px 15px;margin-bottom:8px;font-size:13.5px}
.hero-rc{background:var(--warn-bg);border:1px solid var(--warn)}
.rc-head{font-weight:700;font-size:14px;margin-bottom:4px}
.rc-story{font-size:14.5px;line-height:1.55}
.rc-ev{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.rc-chip{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 10px;font-size:13px}
.rc-arrow{color:var(--mut);font-weight:700}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:60}
.sheet-box{background:var(--card);width:100%;max-width:520px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:18px 18px 22px;box-shadow:0 -4px 24px rgba(0,0,0,.18)}
.sheet-h{font-weight:700;font-size:15px;margin-bottom:4px}
.sheet-ta{width:100%;margin-top:10px;min-height:60px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;box-sizing:border-box}
.rc-reasons{display:flex;flex-direction:column;gap:7px}
.rc-reason{justify-content:flex-start;text-align:left;background:var(--subtle);border:1px solid var(--line)}
/* Phase 2: branch inbox drawers + problem/coin cards */
.drawer-h{display:block;font-size:13.5px;font-weight:600;color:var(--sub)}
.drawer-h:hover{text-decoration:none;filter:brightness(.95)}
.drawer .grid-ch{padding:9px 14px;border-bottom:1px solid var(--line)}
.drawer .grid-ch:last-of-type{border-bottom:none}
.coin-card{background:var(--line-soft);border:1px solid var(--mut)}
.coin-name{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.ch-prob .grid-ch{padding-left:0}
.fee-in{width:92px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);
  font-family:inherit;font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
.fee-in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
input[type=month],select,input[type=text],.mm-note{font-family:inherit;font-size:13.5px;color:var(--txt)}
.c3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:2px 18px 14px}
.c3 .card{padding:12px 14px;font-size:12.5px;box-shadow:none}
.c3 .card b{font-size:13px}
/* ── หน้าแรก: กล่องงานทั้งเครือ (Phase 3 inbox) ── */
.ov-hero{padding:14px 18px}
.ov-hero-line{font-size:15.5px;line-height:1.5}
.ov-reclass{background:var(--ok-bg);border:1px solid var(--ok);font-size:14px;padding:12px 16px}
.ov-row{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:background .12s}
.ov-row:hover{background:var(--hover)}
.ov-row:last-child{border-bottom:none}
.ov-row-main{flex:1;min-width:0}
.ov-bname{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ov-sum{font-size:13px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ov-mini{font-size:11px;padding:1px 8px}
.ov-chev{color:var(--mut);font-size:20px;font-weight:600;flex:none;line-height:1}
.ov-row-done{padding:11px 18px}
.ov-row-done .ov-bname{font-weight:500;color:var(--sub)}
.ov-done-toggle{display:block;padding:12px 18px;font-size:13.5px;color:var(--sub);font-weight:500}
.ov-done-toggle:hover{text-decoration:none;background:var(--hover)}
/* Phase 4 #1: overview manager attention bar */
.review-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--warn);background:var(--warn-bg)}
.review-bar .rb-link{font-size:13px;font-weight:600}
.review-bar .rb-link:not(:last-child)::after{content:'·';color:var(--mut);margin-left:8px;font-weight:400}
/* Phase 4 #2: "เพิ่มเติม" bottom-sheet menu rows */
.more-menu{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.more-item{display:flex;flex-direction:column;gap:1px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--txt);font-size:14px;font-weight:600;background:var(--card);transition:background .12s}
.more-item:hover{background:var(--line-soft);text-decoration:none}
.more-item .lbl{font-weight:400}
/* <i class="ti ti-calendar" aria-hidden="true"></i> สรุปบัญชีรายวัน (รายใบ) — daybook cards, 1 วัน = 1 ใบ */
.db-sum{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:14px;padding:13px 18px}
.db-sum .lbl{margin-bottom:2px}
.db-sum b{font-size:18px;font-weight:700;display:block}
.db-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:12px}
.db-card{padding:0;overflow:hidden}
.db-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--brand-soft);border-bottom:1px solid var(--line)}
.db-date{font-weight:700;font-size:15px;color:var(--brand-deep)}
.db-net{font-weight:700;font-size:15px}
.db-tbl{font-size:12.5px;width:100%}
.db-tbl th,.db-tbl td{padding:5px 9px;white-space:nowrap}
.db-tbl td:first-child,.db-tbl th:first-child{white-space:normal;padding-left:14px}
.db-tbl td:last-child,.db-tbl th:last-child{padding-right:14px}
.db-tbl tfoot td{border-top:1.5px solid var(--line);border-bottom:none;font-weight:600;background:var(--line-soft)}
.db-disc{color:var(--warn)}
.db-je{border-top:1px solid var(--line);background:var(--brand-soft)}
.db-je>summary{cursor:pointer;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--brand-deep);user-select:none}
.db-je>summary:hover{background:var(--line-soft)}
.db-je[open]>summary{border-bottom:1px solid var(--line)}
.db-je .db-tbl tfoot td{background:transparent}
.dash-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* Admin/Setup tables — left-read, top-aligned so tall multi-line rows don't float */
.setup-scroll{overflow-x:auto}
.setup-tbl{width:100%;min-width:780px;font-size:12px}
.setup-tbl th,.setup-tbl td{text-align:left;vertical-align:top;padding:7px 9px;line-height:1.35}
.setup-tbl th{white-space:nowrap}
.setup-tbl td:first-child,.setup-tbl th:first-child{white-space:nowrap}
.setup-tbl select{max-width:130px;width:100%}
.setup-tbl input[type=text],.setup-tbl input:not([type]){width:100%;min-width:90px}
.dash-empty{opacity:.55}
/* Stage 3: unified empty + loading states */
.empty{text-align:center;padding:44px 24px}
.empty .ei{font-size:38px;line-height:1;color:var(--line);margin-bottom:12px;display:inline-block}
.empty .et{font-size:14.5px;color:var(--sub);font-weight:600;margin-bottom:5px}
.empty .eh{font-size:12.5px;color:var(--mut);max-width:400px;margin:0 auto;line-height:1.5}
.empty .btn{margin-top:14px}
.loading{padding:38px 0;text-align:center;color:var(--mut);font-size:13px}
.spin{display:inline-block;width:17px;height:17px;border:2.5px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.mv-sel{padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--input);font:inherit}
.mv-tbl{width:100%;border-collapse:collapse;font-size:13px}
.mv-tbl td{padding:5px 6px;border-top:1px solid var(--line-soft)}
@media (max-width:640px){
  .ov-row{padding:11px 12px;gap:8px}
  .ov-row .row{width:auto !important}
  .ov-row .prog{min-width:54px}
  .ov-hero-line{font-size:14.5px}
  .grid-ch{grid-template-columns:1fr 1fr;row-gap:5px}
  .grid-ch>span:last-child{display:none}
  .daygrid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}
  .wrap{padding:10px 10px 40px}
  td,th{padding:7px 7px;font-size:12.5px}
}
/* ── Phase 5: Responsive Nav ── */
#main-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--line);display:flex;z-index:40;
  box-shadow:inset 0 3px 0 var(--place),0 -2px 12px rgba(15,23,42,.06);safe-area-inset-bottom:env(safe-area-inset-bottom)}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;font-size:10.5px;font-weight:500;
  color:var(--mut);padding:6px 2px;text-decoration:none;border:none;background:none;
  font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer;transition:color .12s}
.nav-tab.active,.nav-tab:hover{color:var(--brand);text-decoration:none}
.nav-tab .ni{font-size:20px;line-height:1.2}
/* top-tab strip — rendered inside header() on desktop */
.top-nav{display:none;border-bottom:1px solid var(--line);box-shadow:inset 0 -3px 0 var(--place);
  margin:4px -18px 12px;padding:0 4px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.top-nav::-webkit-scrollbar{display:none}
.tnt{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:500;
  color:var(--mut);padding:9px 14px;border-bottom:3px solid transparent;
  text-decoration:none;white-space:nowrap;cursor:pointer;
  border-top:none;border-left:none;border-right:none;background:none;font-family:inherit;
  transition:color .12s,border-color .12s}
.tnt:hover{color:var(--brand);text-decoration:none}
.tnt.active{color:var(--brand);border-bottom-color:var(--brand)}
/* reports hub grid */
.rpt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:6px}
.rpt-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
  color:var(--txt);text-decoration:none;transition:background .12s,border-color .12s}
.rpt-item:hover{background:var(--line-soft);border-color:var(--line-ctl);text-decoration:none}
.rpt-icon{font-size:20px;flex:none;line-height:1.3}
.rpt-body{flex:1;min-width:0}
.rpt-title{font-weight:600;font-size:13.5px;line-height:1.3}
.rpt-desc{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.rpt-badge{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;
  display:inline-block;margin-top:4px;background:var(--ok-bg);color:var(--ok)}
.rpt-badge.ext{background:var(--line-soft);color:var(--sub)}
@media(min-width:641px){
  #main-nav{display:none !important}
  .top-nav{display:flex}
}
@media(max-width:640px){.wrap{padding-bottom:72px}}
/* แถบเลือกหลายรายการ (ข้อแตกต่าง) — บนมือถือยกขึ้นเหนือเมนูล่าง ไม่ให้บังกัน */
#disc-bulk-bar{bottom:0}
@media(max-width:640px){#disc-bulk-bar{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}}
/* แถว/ช่องที่กดได้ (role=button) — กด Tab แล้วเห็นกรอบโฟกัส */
[role=button][tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
/* focus: 2px accent outline, 2px off the edge (design rule); full-width rows above keep it inset
   so a card edge never clips it */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[role=button][tabindex]:focus-visible{outline-offset:-2px}
/* form fields sit on the kit's input surface in both themes */
input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]),select,textarea{
  background-color:var(--input);color:var(--txt)}
/* theme toggle (header) */
.theme-btn{padding:4px 8px;line-height:1.2}
.theme-btn .ti{font-size:15px}
/* ── Stage-2 components + utilities (2026-10 UX phase 1) ──
   They replace what used to be inline style="…" attributes, so they behave like inline styles:
   declared last and !important, which lets them win over component rules exactly as the
   inline style did. display utilities are NOT !important: scripts toggle el.style.display.
   Spacing follows one small scale: 0 2 4 6 8 10 12 14 16 (px). */
/* form control: select / input */ .ctl{padding:6px 9px !important;border:1px solid var(--line) !important;border-radius:var(--radius-sm) !important;background:var(--input) !important;font:inherit !important}
/* form control, compact */ .ctl-sm{padding:5px 8px !important;border:1px solid var(--line) !important;border-radius:var(--radius-sm) !important;background:var(--input) !important;font:inherit !important}
/* form control, date picker */ .ctl-wide{padding:6px 10px !important;border:1px solid var(--line) !important;border-radius:var(--radius-sm) !important;background:var(--input) !important;font:inherit !important}
/* form control, header month picker */ .ctl-lg{padding:7px 10px !important;border:1px solid var(--line) !important;border-radius:var(--radius-sm) !important;background:var(--input) !important}
/* KPI figure */ .kpi-v{font-size:20px !important;font-weight:700 !important}
/* KPI figure, small */ .kpi-v18{font-size:18px !important;font-weight:700 !important}
/* section heading under a card */ .sec-h{font-size:14px !important;margin:14px 0 6px !important}
/* group label above a list */ .grp-h{margin:0 0 6px 2px !important;font-weight:700 !important;letter-spacing:.03em !important}
/* empty-table cell */ .cell-empty{text-align:center !important;padding:32px !important;color:var(--mut) !important}
/* card holding a row of KPIs */ .kpi-row{padding:12px 16px !important;margin-bottom:12px !important;display:flex;gap:24px !important;flex-wrap:wrap !important}

(function(){
  let d=null;try{d=localStorage.getItem('oshinei_dark');}catch(e){}
  if(d!=='1'&&d!=='0')d=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'1':'0';
  if(d==='1')document.body.classList.add('dark');
})();
</script>
