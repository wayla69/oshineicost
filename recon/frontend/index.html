function updMatchBar(){
  const ck=[...document.querySelectorAll('#daylines-'+window._DAY.i+' input[type=checkbox]:checked')];
  const bar=$('match-bar');if(!bar)return;
  if(!ck.length){bar.style.display='none';return;}
  const sum=ck.reduce((a,c)=>a+window._DAY.lines[+c.dataset.j].amount,0);
  $('match-sum').textContent=`เลือก ${ck.length} รายการ รวม ${fmt(sum)} บาท`;
  bar.style.display='flex';
}
async function manualMatchDay(){
  const D=window._DAY;
  const ck=[...document.querySelectorAll('#daylines-'+D.i+' input[type=checkbox]:checked')];
  if(!ck.length)return;
  const sel=ck.map(c=>D.lines[+c.dataset.j]);
  const banks=[...new Set(sel.map(l=>l.bank))];
  if(banks.length>1){toast('เลือกได้ทีละธนาคาร');return;}
  const ch=DATA.channels[D.i];
  const d=ch.days.find(x=>x.day===D.day);
  const sum=sel.reduce((a,l)=>a+l.amount,0);
  const posAmt=Math.min(d.pos,sum);
  if(posAmt<=0){toast('วันนี้ไม่มียอด POS ให้จับคู่');return;}
  const note=prompt(`จับคู่ ${sel.length} รายการ (${fmt(sum)}) กับยอด POS วันที่ ${D.day} (${fmt(posAmt)})\nหมายเหตุ:`,'');
  if(note===null)return;
  try{await api('/api/manual',{method:'POST',body:{branch_id:DATA.branch_id,period_month:MONTH,
      category:D.key,bank:banks[0],pos_days:[{day:D.day,amount:posAmt}],
      ext:sel.map(l=>({table:'recon_bank_lines',id:l.id,amount:l.amount})),note:note||'v2 day match'}});
      toast('จับคู่แล้ว');route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── ตัวจับคู่ละเอียด (ยกความสามารถ manual matcher เดิมเข้ามา) ──
   เลือกหลายวัน POS (แบ่งยอดบางส่วนได้) จับกับหลายบรรทัดเอกสาร — เคสยอดก้อนเดียว
   ครอบหลายวัน / เงินเข้าเป็นงวด ที่ตัวจับคู่แบบง่ายในหน้า drill เอาไม่อยู่ */
let _MM=null;
async function openMatcher(i,bank){
  const ch=DATA.channels[i];
  const box=$('matcher-'+i);
  if(box.innerHTML&&!bank){box.innerHTML='';_MM=null;return;}
  const bankList=[...new Set((ch.banks||[]).map(b=>b.bank))];
  if(!bank){
    if(bankList.length>1){
      box.innerHTML=`<div class="row" style="padding:8px 14px"><span class="lbl">เลือกธนาคาร/ผู้รับบัตร:</span>
        ${bankList.map(b=>`<button class="btn btn-sm" onclick="openMatcher(${i},'${esc(b)}')">${esc(b)}</button>`).join('')}</div>`;
      return;
    }
    bank=bankList[0]||'NONE';
  }
  box.innerHTML='<div class="muted" style="padding:8px 14px">กำลังโหลด…</div>';
  let d;try{d=await api(`/api/manual?branch_id=${DATA.branch_id}&category=${ch.key}&bank=${encodeURIComponent(bank)}&period_month=${MONTH}`);}
  catch(e){box.innerHTML=`<div class="chip c-err" style="margin:8px 14px">${esc(e.message)}</div>`;return;}
  _MM={i,bank,cat:ch.key,pos:d.pos_days,ext:d.ext_lines};
  const posRows=d.pos_days.filter(p=>p.remaining>0.5).map((p,j)=>`
    <tr><td><input type="checkbox" data-pj="${j}" onchange="mmSum()"></td>
      <td>${p.day}</td><td class="mono">${fmt(p.remaining)}</td>
      <td><input class="fee-in" type="number" step="0.01" max="${p.remaining}" value="${p.remaining}" data-pamt="${j}" oninput="mmSum()"></td></tr>`).join('');
  const extRows=d.ext_lines.filter(l=>l.match_status!=='manual').map((l,j)=>{
    const done=l.match_status==='matched';   // จับคู่อัตโนมัติแล้ว — ติ๊กซ้ำ = นับสองรอบ
    return `<tr style="${done?'opacity:.45':''}">
      <td>${done?'<span class="lbl" title="จับคู่อัตโนมัติแล้ว">✓</span>':`<input type="checkbox" data-ej="${j}" onchange="mmSum()">`}</td>
      <td>${l.date}</td><td style="text-align:left;max-width:170px;overflow:hidden" title="${esc(l.ref)}">${esc(l.ref)}</td>
      <td class="mono">${fmt(l.amount)}</td></tr>`;}).join('');
  const matches=(d.matches||[]).map(m=>`

function _mmPick(){
  const box=$('matcher-'+_MM.i);
  const posOk=_MM.pos.filter(p=>p.remaining>0.5);
  const pos=[...box.querySelectorAll('input[data-pj]:checked')].map(c=>{
    const j=+c.dataset.pj;
    const amt=parseFloat(box.querySelector(`input[data-pamt="${j}"]`).value)||0;
    return {day:posOk[j].day, amount:Math.min(amt,posOk[j].remaining)};
  }).filter(x=>x.amount>0);
  const extOk=_MM.ext.filter(l=>l.match_status!=='manual');
  const ext=[...box.querySelectorAll('input[data-ej]:checked')].map(c=>{
    const l=extOk[+c.dataset.ej];
    return {table:l.table, id:l.id, amount:l.amount};
  });
  return {pos,ext};
}
function mmSum(){
  if(!_MM)return;
  const {pos,ext}=_mmPick();
  const ps=pos.reduce((a,x)=>a+x.amount,0), es=ext.reduce((a,x)=>a+x.amount,0);
  const el=$('mm-sum'), go=$('mm-go');
  if(!pos.length||!ext.length){el.textContent='เลือกทั้งสองฝั่งเพื่อจับคู่';go.disabled=true;return;}
  const diff=es-ps;
  el.innerHTML=`POS ${fmt(ps)} ↔ เอกสาร ${fmt(es)} <span style="color:${Math.abs(diff)<=50?'var(--ok)':'var(--err)'}">(ต่าง ${diff>0?'+':''}${fmt(diff)})</span>`;
  go.disabled=false;
}
async function mmSubmit(){
  const {pos,ext}=_mmPick();
  if(!pos.length||!ext.length)return;
  try{await api('/api/manual',{method:'POST',body:{branch_id:DATA.branch_id,period_month:MONTH,
      category:_MM.cat,bank:_MM.bank,pos_days:pos,ext:ext,
      note:$('mm-note').value||'v2 จับคู่ละเอียด'}});
      toast('จับคู่แล้ว');route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function mmDelete(mid){
  if(!confirm('ยกเลิกการจับคู่นี้?'))return;
  try{await api(`/api/manual/${mid}`,{method:'DELETE'});toast('ยกเลิกแล้ว');route();}

}

/* ── สถานะ session: ส่งตรวจ → ปิดเดือน ── */
async function ensureSession(bid){
  if(DATA.session)return DATA.session.session_id;
  const s=await api('/api/sessions',{method:'POST',body:{branch_id:bid,period_month:MONTH}});
  return s.session_id;
}
function stForm(status,by){const fd=new FormData();fd.append('status',status);if(by)fd.append('approved_by',by);return fd;}
async function setSt(bid,st){
  try{const sid=await ensureSession(bid);
      await api(`/api/sessions/${sid}/status`,{method:'PATCH',body:stForm(st)});
      toast(st==='in_review'?'ส่งตรวจแล้ว':'ส่งกลับแก้แล้ว');route();}catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function closeMonth(bid){
  const who=prompt('ชื่อผู้จัดการที่อนุมัติ:');
  if(who===null)return;
  if(!who.trim()){toast('ต้องใส่ชื่อผู้อนุมัติ');return;}
  if(!confirm('ปิดเดือน: บันทึกผลถาวร ออกไฟล์ Excel ได้ และล็อกการแก้ไขทั้งเดือนนี้ ยืนยัน?'))return;
  try{
    const sid=await ensureSession(bid);
    await api(`/api/sessions/${sid}/run-match`,{method:'POST'});   // snapshot at close
    await approveWithManagerCode(sid,who.trim());
    toast('ปิดเดือนแล้ว');route();
  }catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function approveWithManagerCode(sid,who){
  // ลองด้วยรหัสที่จำไว้ก่อน; ถ้าเซิร์ฟเวอร์ขอรหัสผู้จัดการ (403) ค่อยถาม แล้วลองใหม่
  let code=sessionStorage.getItem('mgr_code')||'';
  for(let attempt=0;attempt<2;attempt++){
    try{
      await api(`/api/sessions/${sid}/status`,
        {method:'PATCH',body:stForm('approved',who),headers:code?{'X-Manager-Token':code}:{}});
      if(code)sessionStorage.setItem('mgr_code',code);
      return;
    }catch(e){
      if(!String(e.message).includes('ผู้จัดการ')||attempt===1)throw e;
      code=prompt('ใส่รหัสผู้จัดการเพื่อปิดเดือน:')||'';
      if(!code)throw new Error('ยกเลิก — ไม่ได้ใส่รหัสผู้จัดการ');
    }
  }
}

// Cache of branches loaded for session-scoped pickers (master branches only).
let _DIAG_BRANCHES = null;
async function _diagBranches(){
  if(_DIAG_BRANCHES) return _DIAG_BRANCHES;
  try{ _DIAG_BRANCHES = await api('/api/branches'); }catch(e){ _DIAG_BRANCHES=[]; }
  return _DIAG_BRANCHES;
}

// Resolve session_id for a branch+month without creating one.
// Returns null if no session exists yet.
async function _resolveSession(branchId, month){
  if(!branchId) return null;
  try{
    const list = await api(`/api/sessions?branch_id=${branchId}&period_month=${month}`);
    return (list && list.length) ? list[0].session_id : null;
  }catch(e){ return null; }
}

// Render a branch picker for session-scoped diagnostic views.

  const opts = branches.map(b =>
    `<option value="${b.branch_id}" ${b.branch_id==currentBid?'selected':''}>${esc(b.name)}</option>`
  ).join('');
  return `<select onchange="${onchangeExpr}" title="เลือกสาขา"
    style="padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit">${opts}</select>`;
}

function _renderBankCov(branches, picker, sid){
  const d = _BANKCOV_DATA||{};
  const tot = d.totals||{};
  const pct = tot.pct_matched ?? 100;
  const hCol = pct>=99?'c-ok':pct>=70?'c-warn':'c-err';
  const brName = (branches.find(b=>b.branch_id==_BANKCOV_BID)||{}).name||'';

  // filter buttons
  const fOpts = [
    ['unmatched',`⌛ ยังรอ`,tot.unmatched||0],
    ['matched',`✓ ตรงแล้ว`,tot.matched||0],
    ['excluded',`⊘ ตัดออก`,tot.excluded||0],
    ['all','ทั้งหมด',(tot.matched||0)+(tot.unmatched||0)+(tot.excluded||0)+(tot.informational||0)]
  ].filter(([k,,n])=>n>0||k==='all')
   .map(([k,lbl,n])=>`<button onclick="_BANKCOV_FILTER='${k}';_renderBankCov(${JSON.stringify(branches.map(b=>({branch_id:b.branch_id,name:b.name})))},${JSON.stringify(picker)},${sid})"
     class="btn btn-sm ${_BANKCOV_FILTER===k?'btn-pri':''}">${lbl} ${n}</button>`).join('');

  const ccHtml = ccRows.length ? ccRows.map(r=>`
    <div class="card" style="margin-bottom:8px">
      <div style="font-weight:600;margin-bottom:6px">CREDIT · ${esc(r.bank)}</div>
      ${line('ยอดรูด POS',r.pos_gross)}
      ${line('สรุปยอดบัตร (gross)',r.settle_gross)}
      <div class="row" style="justify-content:space-between;font-size:12px;padding-top:4px;margin-top:4px;border-top:1px solid var(--line-soft)">

      ${line('− ค่าธรรมเนียม+VAT',r.settle_fee)}
      ${line('ยอดสุทธิ',r.settle_net)}
      ${line('เงินเข้าธนาคาร',r.bank_credit)}
      <div class="row" style="justify-content:space-between;font-size:12px;padding-top:4px;margin-top:4px;border-top:1px solid var(--line-soft)">
        <span class="lbl">ขั้น 2: ยอดสุทธิ ↔ เงินเข้า</span>${_bcLegChip(r.bank_leg)}</div>
      ${r.settle_gross===0&&r.pos_gross>0?`<div class="chip c-warn" style="margin-top:6px;font-size:11px">⚠ ยังไม่อัปสรุปยอดบัตร</div>`:''}
      ${r.settle_net>100&&r.bank_credit===0?`<div class="chip c-warn" style="margin-top:6px;font-size:11px">⚠ ยังไม่พบเงินเข้าธนาคาร</div>`:''}
    </div>`).join('')
    : '<div class="lbl">— ไม่มีบัตรเครดิตในเดือนนี้</div>';

  // per-lane chips
  const grpHtml = Object.entries(d.groups||{})
    .map(([k,g])=>`<span class="chip ${g.unmatched?'c-warn':'c-ok'}" style="margin-right:4px;margin-bottom:4px">${_BC_LANE[k]||k}: ${g.matched}/${g.count}</span>`)
    .join('');

  // statement lines
  let lines = (d.lines||[]);
  if(_BANKCOV_FILTER!=='all') lines=lines.filter(l=>l.status===_BANKCOV_FILTER);
  const linesHtml = lines.length
    ? lines.map(l=>{
        const [cls,sym]=_BC_LINE_ST[l.status]||['c-mut','·'];
        const lane=(_BC_LANE[l.category]||l.category)+(l.bank&&l.bank!=='NONE'&&l.bank!=='UNKNOWN'?'·'+l.bank:'');
        const dim=l.status==='excluded'||l.status==='informational'?'opacity:.5':'';
        return `<tr style="${dim}">
          <td class="lbl" style="white-space:nowrap">${esc(l.date||'—')}</td>
          <td class="lbl">${esc(lane)}</td>
          <td class="lbl" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.ref||'')}</td>
          <td class="mono">${fmt(l.amount)}</td>
          <td><span class="chip ${cls}" style="font-size:11px">${sym}</span></td>
        </tr>`;
      }).join('')
    : `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--mut)">${_BANKCOV_FILTER==='unmatched'?'ทุกบรรทัดตรงแล้ว ✓':'—'}</td></tr>`;

  $('app').innerHTML = header() + `
    <div class="row" style="margin-bottom:10px">

      ${picker}

    <div class="muted" style="margin-bottom:10px">${esc(brName)} · ${MONTH} · ตรวจทุกบรรทัดสเตทเมนต์ว่ากระทบยอดครบ</div>

      <div class="row" style="margin-bottom:8px">
        <span class="chip ${hCol}" style="font-size:14px">${tot.matched||0}/${tot.lines_total||0} ตรงแล้ว · ${pct}%</span>
        <div class="lbl" style="margin-left:8px">✓ ${fmt(tot.amount_matched)} · ⌛ ${fmt(tot.amount_unmatched)}${tot.excluded?` · ⊘ ${fmt(tot.amount_excluded)}`:''}</div>
      </div>
      <div style="flex-wrap:wrap;display:flex;gap:4px">${grpHtml||'—'}</div>
    </div>
    ${ccRows.length?`<div class="card" style="margin-bottom:12px">
      <b style="font-size:13.5px;display:block;margin-bottom:8px">3-ขั้นบัตรเครดิต (POS ↔ สรุปยอด ↔ เงินเข้า)</b>
      ${ccHtml}</div>`:''}
    <div class="card" style="padding:0">
      <div class="row" style="padding:12px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;gap:6px">

        <div class="row" style="margin-left:auto;gap:6px;flex-wrap:wrap">${fOpts}</div>

      <div style="overflow:auto;max-height:480px">

          <th>วันที่</th><th>ช่องทาง</th><th>อ้างอิง</th><th>จำนวน</th><th>สถานะ</th>
        </tr></thead><tbody>${linesHtml}</tbody></table>

}

/* ── #board — Daily Board (global, all branches, one day) ───────────────── */
let _BOARD_DATE = null;
let _BOARD_DATES = null;   // {min_day, max_day} cached once

const _BOARD_CELL = {matched:'#dcfce7',variance:'#fee2e2',pos_only:'#fef9c3',ext_only:'#fef9c3',no_source:'#f1f5f9',manual:'#dbeafe'};
const _BOARD_FG   = {matched:'#15803d',variance:'#b91c1c',pos_only:'#854d0e',ext_only:'#854d0e',no_source:'#94a3b8',manual:'#1d4ed8'};

async function loadBoard(){
  $('app').innerHTML = header() + '<div class="muted">กำลังโหลด…</div>';

  // fetch date bounds once
  if(!_BOARD_DATES){
    try{ _BOARD_DATES = await api('/api/daily-board/dates'); }catch(e){ _BOARD_DATES={}; }
  }
  if(!_BOARD_DATE) _BOARD_DATE = _BOARD_DATES.max_day || MONTH+'-01';

  let data;
  try{ data = await api('/api/daily-board?day='+_BOARD_DATE); }
  catch(e){
    $('app').innerHTML = header() + `<div class="card c-err">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`;
    return;
  }
  _renderBoard(data);
}

function _boardStep(delta){
  const d = new Date((_BOARD_DATE||MONTH+'-01')+'T00:00:00');
  d.setDate(d.getDate()+delta);
  _BOARD_DATE = d.toISOString().slice(0,10);
  loadBoard();
}
function _boardPickDate(v){ if(v){ _BOARD_DATE=v; loadBoard(); } }

function _renderBoard(d){
  const cats = d.categories||[];
  const meta = d.column_meta||{};
  const lbl  = c=>(meta[c]&&meta[c].label)||c;
  const varTxt2 = v=>{ const n=+v||0; return Math.abs(n)<1?'✓':`${n>0?'+':''}${fmt(n)}`; };
  const varCls2 = v=>{ const n=+v||0; return Math.abs(n)<1?'c-ok':n<0?'c-err':'c-warn'; };

  // summary strip
  const tot = d.totals||{};

  // header row
  const thCats = cats.map(c=>`<th>${esc(lbl(c))}</th>`).join('');

  // body rows
  const bodyRows = d.branches.map(b=>{
    const cells = cats.map(c=>{
      const cell = b.cells[c];
      if(!cell) return '<td style="text-align:right;color:var(--mut)">·</td>';
      const cm = meta[c]||{};
      const tip = `${esc(b.branch_name)} · ${esc(lbl(c))}\nPOS ${fmt(cell.pos)} / เงินเข้า ${fmt(cell.ext)}\nต่าง ${varTxt2(cell.variance)} (${cell.status})`;
      return `<td style="text-align:right"><span title="${tip}"
        style="display:inline-block;min-width:60px;padding:2px 7px;border-radius:6px;cursor:default;
               font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;
               background:${_BOARD_CELL[cell.status]||'#f1f5f9'};color:${_BOARD_FG[cell.status]||'#475569'}"
        >${fmt(cell.pos)}</span></td>`;
    }).join('');
    return `<tr>
      <td style="font-weight:500;white-space:nowrap">${esc(b.branch_name)}${b.issues?` <span class="chip c-err" style="font-size:10px">${b.issues}</span>`:''}</td>
      ${cells}
      <td class="mono">${fmt(b.pos_total)}</td>
      <td class="mono" style="color:var(--sub)">${fmt(b.ext_total)}</td>
      <td><span class="chip ${varCls2(b.variance)}" style="font-size:11px">${varTxt2(b.variance)}</span></td>
      <td style="text-align:right;white-space:nowrap">
        <a class="lbl" href="/api/daily-report?day=${_BOARD_DATE}&branch_id=${b.branch_id}" target="_blank" title="รายงาน PDF">📄</a>
      </td>
    </tr>`;
  }).join('');

  // footer totals
  const bc = tot.by_category||{};
  const footCats = cats.map(c=>`<td class="mono">${fmt((bc[c]||{}).pos)}</td>`).join('');

  // unmapped notice
  const unmapped = d.unmapped&&d.unmapped.length
    ? `<div class="card c-warn" style="margin-bottom:10px">
        <b>⚠ Unmapped POS codes (ไม่ถูกรวมในตาราง):</b>
        ${d.unmapped.map(u=>`<span class="chip c-warn" style="margin-left:6px">${esc(u.code)}: ${fmt(u.amount)}</span>`).join('')}
        — <a href="#setup">ตั้งค่ารหัส</a>
      </div>` : '';

  const emptyMsg = !d.branches.length
    ? `<div class="card" style="text-align:center;padding:32px;color:var(--mut)">ยังไม่มีรายการวันที่ ${esc(_BOARD_DATE)} — เลือกวันอื่น หรือซิงก์ข้อมูล POS</div>`
    : '';

  $('app').innerHTML = header() + `
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <h2 style="font-size:16px">🗓️ Daily Board — ทุกสาขาในวันเดียว</h2>
      <div class="row" style="gap:6px;margin-left:auto;flex-wrap:nowrap">
        <button class="btn btn-sm" onclick="_boardStep(-1)">◀</button>
        <input type="date" value="${esc(_BOARD_DATE)}"
          min="${esc(_BOARD_DATES&&_BOARD_DATES.min_day||'')}"
          max="${esc(_BOARD_DATES&&_BOARD_DATES.max_day||'')}"
          onchange="_boardPickDate(this.value)"
          style="padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit">
        <button class="btn btn-sm" onclick="_boardStep(1)">▶</button>
        <a class="btn btn-sm" href="/api/daily-report?day=${esc(_BOARD_DATE)}" target="_blank" title="รายงาน PDF ทุกสาขา">🖨️ PDF ทุกสาขา</a>
      </div>
    </div>
    <div class="muted" style="margin-bottom:10px">ยอด POS ต่อช่องทาง · สี: <span style="background:#dcfce7;color:#15803d;padding:1px 6px;border-radius:4px;font-size:12px">✓ ตรง</span> <span style="background:#fee2e2;color:#b91c1c;padding:1px 6px;border-radius:4px;font-size:12px">≠ ต่าง</span> <span style="background:#fef9c3;color:#854d0e;padding:1px 6px;border-radius:4px;font-size:12px">ขาดเอกสาร</span></div>
    <div class="card" style="margin-bottom:12px">
      <div class="row" style="flex-wrap:wrap;gap:16px">
        <div><div class="lbl">POS รวมทุกสาขา</div><b class="mono" style="font-size:18px">${fmt(tot.pos)}</b></div>
        <div><div class="lbl">เงินเข้าจริง</div><b class="mono" style="font-size:18px;color:var(--sub)">${fmt(tot.ext)}</b></div>
        <div><div class="lbl">ผลต่าง</div><b class="mono" style="font-size:18px"><span class="chip ${varCls2(tot.variance)}">${varTxt2(tot.variance)}</span></b></div>
        <div><div class="lbl">สาขารายงาน</div><b style="font-size:18px">${tot.branches_reporting||0}${tot.branches_with_issues?` · <span style="color:var(--warn)">${tot.branches_with_issues}⚠</span>`:''}</b></div>
      </div>
    </div>
    ${unmapped}
    ${emptyMsg}
    ${d.branches.length?`<div class="card" style="padding:0;overflow:auto">
      <table>
        <thead><tr>
          <th style="text-align:left">สาขา</th>
          ${thCats}
          <th>POS รวม</th><th>เงินเข้า</th><th>ต่าง</th><th></th>
        </tr></thead>
        <tbody>${bodyRows}</tbody>
        <tfoot><tr style="background:var(--line-soft);font-weight:600">
          <td>รวมทุกสาขา</td>
          ${footCats}
          <td class="mono">${fmt(tot.pos)}</td>
          <td class="mono" style="color:var(--sub)">${fmt(tot.ext)}</td>
          <td><span class="chip ${varCls2(tot.variance)}" style="font-size:11px">${varTxt2(tot.variance)}</span></td>
          <td></td>
        </tr></tfoot>
      </table>
    </div>`:''}`;
}

/* ════════════════════════════════════════════════════════════════════════
   § COUPON SERIES VIEW (Phase 2 consolidation)
   Route: #coupon
   Read-only — no backend changes. Source: pos_coupon_day via /api/coupon-series.
   Replaces the link that previously sent users to /app/classic.html#coupon.

let _CP_GRAN = 'month';          // 'month' | 'week' | 'day'
let _CP_BID  = '';               // branch_id filter ('' = all master branches)
let _CP_DATE = '';               // date for week/day grain
let _CP_BRANCHES_LOADED = false; // flag so we only populate branch picker once

function _cpEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _cpName(r){ return r.series_name
  ? `${_cpEsc(r.series_name)} <span class="lbl" style="font-size:11px">#${r.series_id}</span>`
  : `Series ${r.series_id}`; }
// MoM: more coupon discount (up) = more given away → show red; down = green
function _cpMom(pct){
  if(pct==null) return '<span class="chip c-mut" style="font-size:11px">ใหม่</span>';
  const [cls,sym]=pct>0?['c-err','▲']:pct<0?['c-ok','▼']:['c-mut',''];
  return `<span class="chip ${cls}" style="font-size:11px">${sym} ${Math.abs(pct).toFixed(1)}%</span>`;
}

function _cpQuery(){
  if(_CP_GRAN==='month') return `?gran=month&period_month=${MONTH}`;
  const d = _CP_DATE || (MONTH+'-01');
  return `?gran=${_CP_GRAN}&day=${d}`;
}

async function loadCoupon(){
  $('app').innerHTML = header() + '<div class="muted">กำลังโหลด…</div>';

  // Fetch branch list for picker (master branches only — same as other diag views)
  const branches = await _diagBranches();

  let d = null;
  const q = _cpQuery() + (_CP_BID ? `&branch_id=${_CP_BID}` : '');
  try{ d = await api('/api/coupon-series' + q); }catch(e){}
  d = d || {series:[], by_branch:[], total:0, total_used:0, label:MONTH};

  const granLabel = {month:'เดือน',week:'อาทิตย์',day:'วัน'}[_CP_GRAN];

  // Gran toggle
  const granBtns = ['month','week','day'].map(g =>
    `<button class="btn btn-sm${_CP_GRAN===g?' btn-pri':''}" onclick="_CP_GRAN='${g}';loadCoupon()">${{month:'เดือน',week:'สัปดาห์',day:'วัน'}[g]}</button>`
  ).join('');

  // Date picker (shown only for week/day)
  const dateInput = _CP_GRAN !== 'month'
    ? `<input type="date" value="${esc(_CP_DATE||MONTH+'-01')}"
         onchange="_CP_DATE=this.value;loadCoupon()"

  // Branch picker
  const branchOpts = [
    `<option value="" ${_CP_BID===''?'selected':''}>ทุกสาขา</option>`,
    ...branches.map(b => `<option value="${b.branch_id}" ${_CP_BID==b.branch_id?'selected':''}>${esc(b.name)}</option>`)
  ].join('');
  const branchPicker = `<select onchange="_CP_BID=this.value;loadCoupon()"
    title="เลือกสาขา"
    style="padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit">${branchOpts}</select>`;

  const tot = d.total || 0;
  const series = d.series || [];

  // Series rows
  const seriesRows = series.length
    ? series.map(r => `<tr style="cursor:pointer" onclick="_cpDrill(${r.series_id})" title="คลิกดูแยกรายสาขา/รายวัน">
        <td>${_cpName(r)} <span class="lbl" style="font-size:11px">›</span></td>
        <td class="mono" style="text-align:right">${fmt(r.used_count)}</td>
        <td class="mono" style="text-align:right">${fmt(r.discount_amount)}</td>
        <td style="text-align:right">${_cpMom(r.mom_pct)}</td>
        <td class="mono" style="text-align:right;color:var(--sub)">${tot?(r.discount_amount/tot*100).toFixed(1):0}%</td>
      </tr>`).join('')
    : `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--mut)">ไม่มีข้อมูลคูปองในช่วงนี้</td></tr>`;

  // By-branch table (when not filtered to a single branch)
  const byBranch = d.by_branch || [];
  const branchRows = (!_CP_BID && byBranch.length)
    ? byBranch.map(r => `<tr>
        <td>${esc(r.branch_name)}</td>
        <td class="mono" style="text-align:right">${fmt(r.used_count)}</td>
        <td class="mono" style="text-align:right">${fmt(r.discount_amount)}</td>
      </tr>`).join('')
    : '';

  $('app').innerHTML = header() + `
    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <h2 style="font-size:16px">🎟️ วิเคราะห์คูปองซีรีส์</h2>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-left:auto">
        ${granBtns}
        ${dateInput}
        ${branchPicker}
      </div>
    </div>
    <div class="muted" style="margin-bottom:10px">
      ${granLabel} · ${esc(d.label||MONTH)}
      · ส่วนลดคูปองจาก pos_coupon_day (master สาขาเท่านั้น)
      · คลิกซีรีส์เพื่อดูแยกรายสาขา/รายวัน
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="row" style="flex-wrap:wrap;gap:16px">
        <div><div class="lbl">ส่วนลดรวม</div><b class="mono" style="font-size:18px">${fmt(tot)}</b></div>
        <div><div class="lbl">จำนวนใบ</div><b class="mono" style="font-size:18px">${fmt(d.total_used||0)}</b></div>
        <div><div class="lbl">ซีรีส์</div><b style="font-size:18px">${series.length}</b></div>
        ${d.prev_total!=null?`<div><div class="lbl">ช่วงก่อนหน้า</div><b class="mono" style="font-size:18px;color:var(--sub)">${fmt(d.prev_total)}</b></div>`:''}
      </div>
    </div>

    <div class="card" style="padding:0;margin-bottom:12px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line-soft)">
        <b style="font-size:13.5px">แยกตามซีรีส์คูปอง</b>
      </div>
      <div style="overflow:auto">
        <table>
          <thead><tr>
            <th style="text-align:left">ซีรีส์</th>
            <th style="text-align:right">จำนวนใช้</th>
            <th style="text-align:right">มูลค่าส่วนลด</th>
            <th style="text-align:right">MoM</th>
            <th style="text-align:right">% รวม</th>
          </tr></thead>
          <tbody>${seriesRows}</tbody>
          ${series.length?`<tfoot><tr style="background:var(--line-soft);font-weight:600">
            <td>รวม</td><td class="mono" style="text-align:right">${fmt(d.total_used||0)}</td>
            <td class="mono" style="text-align:right">${fmt(tot)}</td><td></td><td class="mono" style="text-align:right">100%</td>
          </tr></tfoot>`:''}
        </table>
      </div>
    </div>

    <div id="cp-drill"></div>

    ${branchRows?`<div class="card" style="padding:0">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line-soft)">
        <b style="font-size:13.5px">แยกรายสาขา (รวมทุกซีรีส์)</b>
      </div>
      <div style="overflow:auto">
        <table>
          <thead><tr>
            <th style="text-align:left">สาขา</th>
            <th style="text-align:right">จำนวนใช้</th>
            <th style="text-align:right">มูลค่าส่วนลด</th>
          </tr></thead>
          <tbody>${branchRows}</tbody>
        </table>
      </div>
    </div>`:''}`;
}

async function _cpDrill(seriesId){
  const box = $('cp-drill');
  if(!box) return;
  box.innerHTML = `<div class="card" style="margin-bottom:12px"><div class="muted">กำลังโหลด Series ${seriesId}…</div></div>`;
  box.scrollIntoView({behavior:'smooth', block:'nearest'});

  const q = _cpQuery() + `&series_id=${seriesId}` + (_CP_BID ? `&branch_id=${_CP_BID}` : '');
  let d = null;
  try{ d = await api('/api/coupon-series' + q); }catch(e){}

  const brows = (d&&d.by_branch)||[];
  const drows = (d&&d.by_day)||[];
  const nm    = (d&&d.series&&d.series[0]&&d.series[0].series_name) ? _cpEsc(d.series[0].series_name) : '';
  const mom   = (d&&d.series&&d.series[0]) ? d.series[0].mom_pct : null;

  const subTable = (title, rows, keyFn) => rows.length ? `
    <div style="font-weight:600;font-size:13px;margin:12px 0 6px">${title}</div>
    <div style="overflow:auto">
      <table>
        <thead><tr>
          <th style="text-align:left">รายการ</th>
          <th style="text-align:right">จำนวนใช้</th>
          <th style="text-align:right">มูลค่า</th>
        </tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td>${esc(keyFn(r))}</td>
          <td class="mono" style="text-align:right">${fmt(r.used_count)}</td>
          <td class="mono" style="text-align:right">${fmt(r.discount_amount)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>` : '';

  box.innerHTML = `<div class="card" style="margin-bottom:12px">
    <div class="row" style="margin-bottom:8px">
      <div>
        <b>🎟️ ${nm?nm+' ':''}<span class="lbl">#${seriesId}</span> · ${esc((d&&d.label)||MONTH)}</b>
        <span class="lbl" style="margin-left:8px">รวม ${fmt((d&&d.total)||0)} · ${fmt((d&&d.total_used)||0)} ใบ · MoM ${_cpMom(mom)}</span>
      </div>
      <button class="btn btn-sm" style="margin-left:auto" onclick="$('cp-drill').innerHTML=''">✕ ปิด</button>
    </div>
    ${(brows.length||drows.length)
      ? subTable('แยกรายสาขา', brows, r=>r.branch_name) + subTable('แยกรายวัน', drows, r=>r.day)
      : '<div class="muted">ไม่มีข้อมูลสำหรับ series นี้</div>'}
  </div>`;
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ════════════════════════════════════════════════════════════════════════
   § PAYOUT MATCHING VIEW — Phase 3a consolidation
   Route: #payout?bid=XXX  (reads MONTH global)
   Replaces classic.html openPayoutMatch + renderPayouts for ALL categories.
   Read-only: no backend changes. Uses /api/payout-matching (existing endpoint).
   ════════════════════════════════════════════════════════════════════════ */

const _PCAT_LBL   = {BAYPOINT:'BAY Point',KTCPOINT:'KTC Point',GRAB:'Grab',LINEMAN:'Line Man',CREDIT:'บัตรเครดิต'};
const _PCAT_ORDER = ['CREDIT','GRAB','LINEMAN','BAYPOINT','KTCPOINT'];

async function loadPayout(h){
  const params = new URLSearchParams(h.includes('?')?h.slice(h.indexOf('?')):'');
  const bid = parseInt(params.get('bid')||'0');
  if(!bid){
    $('app').innerHTML=header()+'<div class="card c-err" style="margin-top:12px">ไม่พบสาขา — กลับ <a href="#">หน้าแรก</a></div>';
    return;
  }
  $('app').innerHTML=header(`<a href="#b/${bid}" class="lbl">← สาขา</a>`)+'<div class="muted">กำลังโหลด…</div>';

  let d=null;
  try{ d=await api(`/api/payout-matching?branch_id=${bid}&period_month=${MONTH}`); }
  catch(e){
    $('app').innerHTML=header(`<a href="#b/${bid}" class="lbl">← สาขา</a>`)
      +`<div class="card c-err" style="margin-top:12px">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`;
    return;
  }

  const cats = _PCAT_ORDER.filter(c=>d&&d[c]&&(d[c].payouts||[]).length);
  if(!cats.length){
    $('app').innerHTML=header(`<a href="#b/${bid}" class="lbl">← สาขา</a>`)
      +`<h2 style="margin:14px 0 10px">💳 ตรวจเงินเข้าธนาคาร · ${MONTH}</h2>
        <div class="card" style="text-align:center;padding:40px;color:var(--mut)">ไม่มีข้อมูล payout ในเดือนนี้</div>`;
    return;
  }

  let netTot=0,payTot=0,awaitTot=0;
  cats.forEach(c=>{ const cd=d[c]; netTot+=cd.net_total||0; payTot+=cd.payout_total||0; awaitTot+=cd.awaiting_total||0; });

  const cards = cats.map(cat=>{
    const cd=d[cat];
    const lbl=_PCAT_LBL[cat]||cat;

    if(cd.bank_in_credit){
      const pointTot=cd.pos_point_total||0, netV=cd.net_total||0;
      const diff=netV-pointTot;
      return `<div class="card" style="margin-bottom:10px">
        <div class="row" style="margin-bottom:8px">
          <b>${lbl}</b>
          <span class="chip c-ok" style="margin-left:8px">รวมในยอดบัตร</span>
        </div>
        <div class="row" style="gap:24px;flex-wrap:wrap">
          <div><div class="lbl">POS แต้ม</div><div class="mono">${fmt(pointTot)}</div></div>
          <div><div class="lbl">ยอดสุทธิรายงาน</div><div class="mono">${fmt(netV)}</div></div>
          <div><div class="lbl">ต่าง</div><div class="mono" style="color:${Math.abs(diff)>1?'var(--err)':'var(--ok)'}">${diff>0?'+':''}${fmt(diff)}</div></div>
        </div>
        <div class="lbl" style="margin-top:6px">แต้ม KTC จ่ายผ่าน KTC โดยตรง — ตรวจในยอดสรุปบัตรเครดิต KTC (ไม่มีการโอนแยก)</div>
      </div>`;
    }

    const awaitBadge = cd.awaiting_total>0
      ? `<span class="chip c-warn" style="margin-left:8px">รอ ${fmt(cd.awaiting_total)}</span>` : '';
    const payRows = (cd.payouts||[]).map(p=>{
      const dayList=p.days.map(x=>`${+x.day.slice(8)}`).join('+');
      const netSum=(p.days||[]).reduce((a,x)=>a+(x.net||0),0);
      if(p.status==='awaiting'){
        return `<tr>
          <td><span class="chip c-warn">รอเงินเข้า</span></td>
          <td class="mono" style="text-align:right">${fmt(netSum)}</td>
          <td style="color:var(--mut);text-align:right">—</td>
          <td style="color:var(--mut)">—</td>
          <td><span class="lbl">วัน ${dayList}</span></td>
        </tr>`;
      }
      return `<tr>
        <td><span class="chip c-ok">✓ ตรง</span></td>
        <td class="mono" style="text-align:right">${fmt(netSum)}</td>
        <td class="mono" style="text-align:right">${p.amount?fmt(p.amount):'—'}</td>
        <td>${p.payout_date?p.payout_date.slice(5):'—'}${p.lag?` <span class="lbl">ช้า ${p.lag} วัน</span>`:''}</td>
        <td><span class="lbl">วัน ${dayList}${p.combined?` (รวม ${p.days.length} วัน)`:''}</span></td>
      </tr>`;
    }).join('');

    return `<div class="card" style="margin-bottom:10px">
      <div class="row" style="margin-bottom:8px">
        <b>${lbl}</b>${awaitBadge}
        <span class="lbl" style="margin-left:auto">สุทธิ ${fmt(cd.net_total||0)} · เข้าแล้ว ${fmt(cd.payout_total||0)}</span>
      </div>
      <div style="overflow:auto">
        <table>
          <thead><tr>
            <th>สถานะ</th>
            <th style="text-align:right">ยอดสุทธิ</th>
            <th style="text-align:right">เงินโอน</th>
            <th>วันที่โอน</th>
            <th>วันขาย</th>
          </tr></thead>
          <tbody>${payRows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  $('app').innerHTML = header(`<a href="#b/${bid}" class="lbl">← สาขา</a>`) + `
    <h2 style="margin:14px 0 10px">💳 ตรวจเงินเข้าธนาคาร · ${MONTH}</h2>
    <div class="card row" style="margin-bottom:14px;flex-wrap:wrap;gap:20px">
      <div><div class="lbl">ยอดสุทธิรวม</div><div class="mono" style="font-size:18px">${fmt(netTot)}</div></div>
      <div><div class="lbl">เข้าบัญชีแล้ว</div><div class="mono" style="font-size:18px;color:var(--ok)">${fmt(payTot)}</div></div>
      ${awaitTot>0?`<div><div class="lbl">รอเงินเข้า</div><div class="mono" style="font-size:18px;color:var(--warn)">${fmt(awaitTot)}</div></div>`:''}
    </div>
    ${cards}`;
}

/* ════════════════════════════════════════════════════════════════════════
   § DISCREPANCIES ADMIN VIEW — Phase 3b consolidation
   Route: #discrepancies?bid=XXX  (reads MONTH global)
   Migrates classic.html loadDiscrepancies (~2915): filter/sort/bulk-resolve/
   per-row resolve+assign/drill-per-day.  Exists ALONGSIDE dayWorklistHtml
   (day-ack per channel in branch page) — not a replacement.
   Write ops use api() → auto-attaches X-Upload-Token (write token).
   ════════════════════════════════════════════════════════════════════════ */

let _DISC_SID  = null;
let _DISC_BID  = 0;
let _DISC_DATA = [];
let _DISC_SEL  = new Set();
let _DISC_FLT  = {resolution:'pending',category:'',bank:''};
let _DISC_SORT = {field:'variance',dir:-1};

async function loadDiscrepancies(h){
  const params = new URLSearchParams(h.includes('?')?h.slice(h.indexOf('?')):'');
  _DISC_BID = parseInt(params.get('bid')||'0');
  _DISC_FLT = {resolution:'pending',category:'',bank:''};
  _DISC_SORT = {field:'variance',dir:-1};
  if(!_DISC_BID){
    $('app').innerHTML=header()+'<div class="card c-err" style="margin-top:12px">ไม่พบสาขา — กลับ <a href="#">หน้าแรก</a></div>';
    return;
  }
  $('app').innerHTML=header(`<a href="#b/${_DISC_BID}" class="lbl">← สาขา</a>`)+'<div class="muted">กำลังโหลด…</div>';

  _DISC_SID = await _resolveSession(_DISC_BID, MONTH);
  if(!_DISC_SID){
    $('app').innerHTML=header(`<a href="#b/${_DISC_BID}" class="lbl">← สาขา</a>`)
      +`<div class="card" style="text-align:center;padding:48px;margin-top:14px">
          <div style="font-size:36px;margin-bottom:10px">📭</div>
          <div style="color:var(--mut);margin-bottom:14px">ยังไม่มี session สำหรับเดือน ${MONTH}</div>
          <a href="#b/${_DISC_BID}" class="btn btn-pri">เปิดหน้าสาขาก่อน</a>
        </div>`;
    return;
  }
  await _discFetch();
}

async function _discFetch(){
  if(!_DISC_SID) return;
  let q=`/api/sessions/${_DISC_SID}/discrepancies?resolution=${_DISC_FLT.resolution||'all'}`;
  if(_DISC_FLT.category) q+=`&category=${encodeURIComponent(_DISC_FLT.category)}`;
  if(_DISC_FLT.bank)     q+=`&bank=${encodeURIComponent(_DISC_FLT.bank)}`;
  try{ _DISC_DATA=await api(q); }catch(e){ _DISC_DATA=[]; }
  _DISC_SEL.clear();
  _discRender();
}

function _discRender(){
  const sorted=[..._DISC_DATA].sort((a,b)=>{
    const fa=Math.abs(a[_DISC_SORT.field]??0), fb=Math.abs(b[_DISC_SORT.field]??0);
    return _DISC_SORT.dir*(fa<fb?-1:fa>fb?1:0);
  });
  const pendingN=_DISC_DATA.filter(d=>d.resolution==='pending').length;
  const varCls=v=>Math.abs(v)>100?'var(--err)':Math.abs(v)>5?'var(--warn)':'var(--ok)';
  const resCls=r=>r==='pending'?'c-warn':r==='accepted'?'c-ok':'c-mut';
  const srtArrow=f=>_DISC_SORT.field===f?(_DISC_SORT.dir>0?' ▲':' ▼'):'';
  const th=(f,lbl)=>`<th style="cursor:pointer;user-select:none;white-space:nowrap" onclick="_discSortBy('${f}')">${lbl}${srtArrow(f)}</th>`;

  const rows=sorted.length?sorted.map(d=>{
    const isPending=d.resolution==='pending';
    const resSelect=isPending
      ?`<select style="font-size:12px;padding:2px 5px;border:1px solid var(--line);border-radius:6px;background:#fff"
           onchange="_discResolve(${d.id},this.value)">
           <option value="">แก้ไข…</option>
           <option value="accepted">✓ ยอมรับ</option>
           <option value="adjusted">~ ปรับแล้ว</option>
           <option value="rejected">✕ ปฏิเสธ</option>
         </select>`
      :`<span class="chip ${resCls(d.resolution)}" style="font-size:11px">${esc(d.resolution)}</span>`;
    return `<tr data-disc-id="${d.id}">
      <td style="text-align:center;padding:6px 4px 6px 10px">
        <input type="checkbox" class="disc-chk" value="${d.id}" ${_DISC_SEL.has(d.id)?'checked':''}
          onchange="_discToggle(${d.id},this.checked)"></td>
      <td style="font-weight:500;white-space:nowrap">${esc(d.category||'—')}</td>
      <td style="color:var(--sub);font-size:12px">${d.bank&&d.bank!=='NONE'?esc(d.bank):'—'}</td>
      <td style="font-size:11px;color:var(--mut)">${esc(d.disc_type||'—')}</td>
      <td class="mono" style="text-align:right;cursor:pointer;user-select:none;color:${varCls(d.variance||0)}"
          onclick="_discDrillDays(${d.id},this)" title="คลิกดูแยกรายวัน">▾ ${d.variance>0?'+':''}${fmt(d.variance||0)}</td>
      <td class="mono" style="text-align:right;color:var(--sub)">${fmt(d.amount_external||0)}</td>
      <td class="mono" style="text-align:right">${fmt(d.amount_pos||0)}</td>
      <td><input style="font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;width:90px"
           placeholder="มอบหมาย…" value="${esc(d.assigned_to||'')}"
           onchange="_discAssign(${d.id},this.value)"></td>
      <td>${resSelect}</td>
    </tr>`;
  }).join('')
  :`<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--mut)">
      ไม่มีรายการ${_DISC_FLT.resolution!=='all'?' ('+_DISC_FLT.resolution+')':''}
    </td></tr>`;

  const html=`
    <div class="row" style="margin:14px 0 10px;flex-wrap:wrap;gap:8px">
      <h2 style="font-size:16px">⚙️ จัดการข้อแตกต่าง · ${MONTH}</h2>
      ${pendingN?`<span class="chip c-warn">${pendingN} รอแก้ไข</span>`:'<span class="chip c-ok">ครบแล้ว</span>'}
      <a href="#b/${_DISC_BID}" class="btn btn-sm" style="margin-left:auto">← สาขา</a>
    </div>
    <div class="card" style="margin-bottom:10px;padding:10px 14px">
      <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
        <span class="lbl">แสดง:</span>
        <select style="padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit"
          onchange="_DISC_FLT.resolution=this.value;_discFetch()">
          <option value="pending" ${_DISC_FLT.resolution==='pending'?'selected':''}>รอแก้ไข</option>
          <option value="accepted" ${_DISC_FLT.resolution==='accepted'?'selected':''}>ยอมรับแล้ว</option>
          <option value="adjusted" ${_DISC_FLT.resolution==='adjusted'?'selected':''}>ปรับแล้ว</option>
          <option value="rejected" ${_DISC_FLT.resolution==='rejected'?'selected':''}>ปฏิเสธ</option>
          <option value="all" ${_DISC_FLT.resolution==='all'?'selected':''}>ทุกสถานะ</option>
        </select>
        <input style="padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;width:110px"
          placeholder="ช่องทาง…" value="${esc(_DISC_FLT.category)}"
          oninput="_DISC_FLT.category=this.value"
          onkeydown="if(event.key==='Enter')_discFetch()">
        <input style="padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;width:90px"
          placeholder="ธนาคาร…" value="${esc(_DISC_FLT.bank)}"
          oninput="_DISC_FLT.bank=this.value"
          onkeydown="if(event.key==='Enter')_discFetch()">
        <button class="btn btn-sm" onclick="_discFetch()">ค้นหา</button>
        ${(_DISC_FLT.category||_DISC_FLT.bank)?`<button class="btn btn-sm" onclick="_DISC_FLT.category='';_DISC_FLT.bank='';_discFetch()">✕ ล้าง</button>`:''}
      </div>
    </div>
    <div class="card" style="padding:0;overflow:auto;margin-bottom:80px">
      <table>
        <thead><tr>
          <th style="padding-left:10px"><input type="checkbox" id="disc-chk-all" onchange="_discToggleAll(this.checked)"></th>
          <th style="text-align:left">ช่องทาง</th>
          <th style="text-align:left">ธนาคาร</th>
          <th style="text-align:left">ประเภท</th>
          ${th('variance','ต่าง (฿)')}
          <th style="text-align:right">เงินเข้า</th>
          <th style="text-align:right">POS</th>
          <th>มอบหมาย</th>
          <th>การแก้ไข</th>
        </tr></thead>
        <tbody id="disc-tbody">${rows}</tbody>
      </table>
    </div>
    <div id="disc-bulk-bar" style="position:fixed;bottom:0;left:0;right:0;background:var(--brand);color:#fff;padding:10px 16px;display:none;z-index:200">
      <div class="row" style="gap:10px;max-width:900px;margin:0 auto;flex-wrap:wrap">
        <span id="disc-bulk-count" style="font-weight:600;align-self:center"></span>
        <button class="btn" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3)" onclick="_discBulk('accepted')">✓ ยอมรับทั้งหมด</button>
        <button class="btn" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3)" onclick="_discBulk('adjusted')">~ ปรับแล้ว</button>
        <button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)" onclick="_discBulk('rejected')">✕ ปฏิเสธ</button>
        <button class="btn btn-sm" style="margin-left:auto;background:rgba(0,0,0,.2);color:#fff;border:none" onclick="_discClearSel()">ยกเลิก</button>
      </div>
    </div>`;

  $('app').innerHTML=header(`<a href="#b/${_DISC_BID}" class="lbl">← สาขา</a>`)+html;
  _discUpdateBulkBar();
}

function _discSortBy(field){
  if(_DISC_SORT.field===field) _DISC_SORT.dir*=-1;
  else { _DISC_SORT.field=field; _DISC_SORT.dir=-1; }
  _discRender();
}

function _discToggle(id,checked){
  if(checked) _DISC_SEL.add(id); else _DISC_SEL.delete(id);
  _discUpdateBulkBar();
}
function _discToggleAll(checked){
  document.querySelectorAll('.disc-chk').forEach(cb=>{
    cb.checked=checked;
    const id=+cb.value;
    if(checked) _DISC_SEL.add(id); else _DISC_SEL.delete(id);
  });
  _discUpdateBulkBar();
}
function _discClearSel(){
  _DISC_SEL.clear();
  document.querySelectorAll('.disc-chk').forEach(cb=>cb.checked=false);
  const all=$('disc-chk-all'); if(all) all.checked=false;
  _discUpdateBulkBar();
}
function _discUpdateBulkBar(){
  const bar=$('disc-bulk-bar'); if(!bar) return;
  const cnt=$('disc-bulk-count');
  if(_DISC_SEL.size){ bar.style.display='block'; if(cnt) cnt.textContent=`${_DISC_SEL.size} รายการที่เลือก`; }
  else bar.style.display='none';
}

async function _discBulk(resolution){
  if(!_DISC_SEL.size||!_DISC_SID) return;
  const ids=[..._DISC_SEL];
  try{
    const r=await api(`/api/sessions/${_DISC_SID}/discrepancies/bulk-resolve`,
      {method:'POST',body:{ids,resolution,resolved_by:'staff'}});
    toast(`${r.updated??ids.length} รายการ → "${resolution}"`);
    _DISC_FLT.resolution='pending';
    await _discFetch();
  }catch(e){ toast('ไม่สำเร็จ: '+e.message); hint403(e); }
}

async function _discResolve(id,res){
  if(!res) return;
  try{
    await api(`/api/discrepancies/${id}/resolve`,{method:'PATCH',body:{resolution:res,resolved_by:'staff'}});
    await _discFetch();
  }catch(e){ toast('ไม่สำเร็จ: '+e.message); hint403(e); }
}

async function _discAssign(id,to){
  try{
    await api(`/api/discrepancies/${id}/assign`,{method:'PATCH',body:{assigned_to:to}});
  }catch(e){ toast('บันทึกไม่สำเร็จ: '+e.message); hint403(e); }
}

async function _discDrillDays(discId,cell){
  const tbody=$('disc-tbody'); if(!tbody) return;
  const parentTr=cell.closest('tr');
  const expandId=`disc-days-${discId}`;
  const existing=document.getElementById(expandId);
  if(existing){ existing.remove(); return; }

  const colspan=parentTr.children.length;
  const expTr=document.createElement('tr');
  expTr.id=expandId;
  expTr.style.background='#f8fafc';
  expTr.innerHTML=`<td colspan="${colspan}" style="padding:10px 24px;color:var(--mut);font-size:13px">กำลังโหลด…</td>`;
  parentTr.after(expTr);

  try{
    const r=await api(`/api/discrepancies/${discId}/days`);
    const days=r.days||[];
    if(!days.length){
      expTr.querySelector('td').innerHTML='<span style="color:var(--mut)">ไม่มีข้อมูลรายวัน</span>';
      return;
    }
    const dayRows=days.map(d=>{
      const clr=Math.abs(d.variance||0)>0.5?'var(--err)':'var(--ok)';
      const stCls=d.status==='matched'?'c-ok':d.status==='diff'?'c-err':'c-warn';
      return `<tr style="border-top:1px solid #edf0f5">
        <td style="padding:4px 10px;font-family:monospace;font-size:12px;color:var(--sub)">${esc(d.day)}</td>

        <td style="padding:4px 10px;text-align:right;font-family:monospace;font-size:12px;color:var(--sub)">${fmt(d.ext||0)}</td>
        <td style="padding:4px 10px;text-align:right;font-family:monospace;font-size:12px;color:${clr}">${(d.variance||0)>0?'+':''}${fmt(d.variance||0)}</td>
        <td style="padding:4px 10px"><span class="chip ${stCls}" style="font-size:11px">${esc(d.status||'—')}</span></td>
      </tr>`;
    }).join('');
    expTr.innerHTML=`<td colspan="${colspan}" style="padding:0">
      <table style="width:100%">
        <thead><tr style="background:#f1f4f9;font-size:11px;color:var(--mut)">
          <th style="padding:4px 10px;text-align:left;font-weight:500">วันที่</th>

          <th style="padding:4px 10px;font-weight:500">สถานะ</th>
        </tr></thead>
        <tbody>${dayRows}</tbody>
      </table></td>`;
  }catch(e){ expTr.querySelector('td').innerHTML=`<span style="color:var(--err)">${esc(e.message)}</span>`; }
}

const _NAV_TABS=[

function _navZone(h){
  if(!h||h.match(/^b\//)||h==='daybook'||h==='dashboard')return 'home';
  if(h==='reports'||h==='wrong'||h==='errors'||h==='coupon')return 'reports';
  if(h==='setup'||h==='audit'||h==='bankcov'||h.startsWith('payout')||h.startsWith('discrepancies'))return 'admin';
  if(h==='board'||h==='trend')return 'diag';
  return 'home';
}
function _topNavHtml(h){
  const z=_navZone(h);
  return `<div class="top-nav" role="tablist">${_NAV_TABS.map(([k,ic,lbl,href])=>
    `<a class="tnt${z===k?' active':''}" href="${href}" role="tab" aria-selected="${z===k}">${ic} ${lbl}</a>`
  ).join('')}</div>`;
}
function _initNav(){
  const n=$('main-nav'); if(!n)return;
  n.innerHTML=_NAV_TABS.map(([k,ic,lbl,href])=>
    `<a class="nav-tab" id="mnt-${k}" href="${href}" aria-label="${lbl}"><span class="ni" aria-hidden="true">${ic}</span>${lbl}</a>`
  ).join('');
}
function _setNavActive(h){
  const z=_navZone(h);
  document.querySelectorAll('#main-nav .nav-tab').forEach(el=>{
    el.classList.toggle('active',el.id==='mnt-'+z);
  });
}

function _setupDocChips(r){
  const m=r.method, ds=r.doc_status||{};
  const chips=[];
  for(const k of ['doc1','doc2']){
    if(!m[k])continue;
    const up=ds[k]==='uploaded';
    chips.push(`<span style="font-size:11px;padding:1px 7px;border-radius:6px;display:inline-block;margin:1px 2px 1px 0;background:${up?'var(--ok-bg)':'var(--warn-bg)'};color:${up?'var(--ok)':'var(--warn)'}">${up?'✓':'…'} ${esc(_SETUP_DOC_TH[m[k]]||m[k])}</span>`);
  }
  return chips.join('')||'<span class="lbl">—</span>';
}
function _setupParamTxt(m){
  if(!m.method)return '<span class="lbl">—</span>';
  const p=[];
  if(m.tol_abs_day!=null)p.push(`±฿${fmt(m.tol_abs_day)}/วัน`);
  if(m.tol_abs!=null)p.push(`±฿${fmt(m.tol_abs)}/เดือน`);
  if(m.lag_days!=null)p.push(`เงินเข้าช้าได้ ${m.lag_days} วัน`);
  if(m.merge_days!=null&&m.merge_days>1)p.push(`รวมได้ ${m.merge_days} วัน`);
  if(m.fee_vat_expected)p.push('<span class="chip c-warn">มีค่าธรรมเนียม+VAT</span>');
  return p.join(' · ')||'<span class="lbl">ค่ามาตรฐาน</span>';
}

      <td style="font-size:12px">${esc(a.bank)}</td>
      <td style="font-family:monospace;font-size:12px">${esc(a.account_no)}</td>
      <td style="font-size:12px">${esc(a.account_name||'')}</td>
      <td style="font-size:12px">${a.active?'✓':'—'}</td>
      <td><button class="btn btn-sm" style="color:var(--err)" onclick="_setupDelAccount(${a.account_id})">ลบ</button></td>
    </tr>`).join('')||'<tr><td colspan="6" class="muted" style="padding:14px 9px">ยังไม่มีบัญชี — ระบบใช้เลขบัญชีจับเอกสารเข้าสาขาอัตโนมัติ</td></tr>'}
  </table></div></div>`;

  // ④ MIDs
  html+=`<div class="card" style="margin-bottom:12px"><div class="row" style="margin-bottom:6px">
    <h2 style="margin:0;font-size:15px">④ MID เครื่องรูดบัตร / คะแนน</h2>
    <button class="btn btn-sm" style="margin-left:auto" onclick="_setupAddMid()">+ เพิ่ม MID</button></div>
  <div style="overflow-x:auto"><table>
    <tr><th>สาขา</th><th>ผู้รับบัตร</th><th>Merchant ID</th><th>Terminal</th><th>ใช้งาน</th><th></th></tr>
    ${_SETUP_M.acquirer_mids.map(m=>`<tr>
      <td style="font-size:12px">${esc(m.branch_name)}</td>
      <td style="font-size:12px">${esc(m.acquirer)}</td>
      <td style="font-family:monospace;font-size:12px">${esc(m.merchant_id||'')}</td>
      <td style="font-family:monospace;font-size:12px">${esc(m.terminal_id||'')}</td>
      <td style="font-size:12px">${m.active?'✓':'—'}</td>
      <td><button class="btn btn-sm" style="color:var(--err)" onclick="_setupDelMid(${m.mid_id})">ลบ</button></td>
    </tr>`).join('')||'<tr><td colspan="6" class="muted" style="padding:14px 9px">ยังไม่มี MID</td></tr>'}
  </table></div>
  <div class="muted" style="margin-top:6px;font-size:12px">MID แบบ KTCPOINT / BAYPOINT ใช้แยกแถวแต้มออกจากใบสรุปบัตร — จำเป็นต่อช่องทางคูปอง (แต้ม KTC/BAY)</div></div>`;

  // ⑤ statement-code remap
  html+=`<div class="card" style="margin-bottom:12px"><div class="row" style="margin-bottom:6px">
    <h2 style="margin:0;font-size:15px">⑤ รหัสในสเตทเมนต์ → ช่องทาง</h2>
    <a href="/api/statement-codes.html" target="_blank" class="lbl" style="margin-left:auto">🖨️ พิมพ์ใบให้ทีมตรวจ</a>
    <a href="/api/statement-codes.xlsx" class="lbl" style="margin-left:12px">⬇ Excel</a></div>
  <div class="muted" style="margin-bottom:8px;font-size:12px">แก้การจัดประเภทรหัสในสเตทเมนต์เองได้เมื่อทีมตรวจพบว่าผิด (เช่น <b>SDCH</b>=นำเงินสดไปฝาก ไม่ใช่ QR) — มีผลทันทีทั้งข้อมูลเดิมและไฟล์ที่อัปใหม่ · ใช้ <b>OTHER</b> สำหรับรายการที่ไม่ใช่รายได้ · ต้องใช้รหัสผู้จัดการ</div>
  <div id="setup-codes-body" class="muted">กำลังโหลด…</div></div>`;

  $('app').innerHTML=html;
  _setupLoadCodes();
}

/* ── ⑤ statement-code remap ── */
async function _setupLoadCodes(){
  const b=$('setup-codes-body'); if(!b)return;
  let j;try{j=await api('/api/statement-codes');}
  catch(e){b.innerHTML='โหลดไม่สำเร็จ: '+esc(e.message);return;}
  _SETUP_CODES=j.codes; _SETUP_CODE_OPTS=j.channel_options||Object.keys(_SETUP_PARSE_CH_TH);
  b.innerHTML=`<div style="overflow-x:auto"><table>
    <tr><th>รหัส / คำ</th><th>ความหมาย</th><th>ระบบจัดเป็น</th><th>แก้เป็น</th><th></th></tr>
    ${_SETUP_CODES.map((c,i)=>{
      const eff=c.effective_channel;
      const badge=c.overridden?'<span class="chip c-ok" style="font-size:11px">✏️ ทีมแก้แล้ว</span>'
        :c.status==='review'?'<span class="chip c-warn" style="font-size:11px">⚠ รอตรวจ</span>':'<span class="chip c-mut" style="font-size:11px">✓</span>';
      return `<tr>
        <td style="font-family:monospace;font-size:12px">${esc(c.code)}<br>${badge}</td>
        <td class="lbl">${esc(c.meaning_th)}</td>
        <td style="font-size:12px">${esc(c.effective_channel_th||c.channel_th)}${c.overridden?` <span class="lbl">(เดิม ${esc(c.channel_th)})</span>`:''}</td>
        <td><select id="setup-cc-${i}" style="font-size:12px">${_SETUP_CODE_OPTS.map(o=>`<option value="${o}" ${o===eff?'selected':''}>${esc(_SETUP_PARSE_CH_TH[o]||o)}</option>`).join('')}</select></td>
        <td><button class="btn btn-sm btn-pri" onclick="_setupSaveCode(${i})">บันทึก</button>
          ${c.overridden?` <button class="btn btn-sm" onclick="_setupRevertCode('${esc(c.override_code||c.code)}')">คืนค่าเดิม</button>`:''}</td>
      </tr>`;}).join('')}
  </table></div>`;
}
async function _setupSaveCode(i){
  if(!_SETUP_CODES)return;
  const c=_SETUP_CODES[i]; const ch=$('setup-cc-'+i).value;
  const token=(c.override_code||c.code||'').toString().split(/[\s/|]/)[0];
  if(!token){toast('ไม่พบรหัส');return;}
  try{
    const r=await mgrApi('/api/statement-codes/override',{method:'POST',
      body:{code:token,channel:ch,note:c.meaning_th||'',by:'manager'}});
    toast(`บันทึก ${token} → ${_SETUP_PARSE_CH_TH[ch]||ch} (แก้ ${r.lines_reclassified} บรรทัด)`);
    _setupLoadCodes();
  }catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function _setupRevertCode(code){
  try{
    const r=await mgrApi('/api/statement-codes/override/'+encodeURIComponent(code),{method:'DELETE'});
    toast(`คืนค่าเดิม ${code} (แก้ ${r.lines_reclassified} บรรทัด)`);
    _setupLoadCodes();
  }catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── ① payment map ── */
async function _setupSaveMap(id,el,field){
  const r=_SETUP_M.rows.find(x=>x.id===id);
  const body={category:r.category,bank:r.bank,reconcile:r.reconcile,notes:r.notes||''};
  body[field]=field==='reconcile'?(el.checked?1:0):el.value;
  try{
    await api(`/api/payment-map/${id}`,{method:'PATCH',body});
    toast(`บันทึก ${r.payment_code_norm} แล้ว`);
    loadSetup();
  }catch(e){toast('ไม่สำเร็จ: '+e.message);loadSetup();}
}

/* ── ② lane editor (inline) ── */
function _setupEditLane(cfgId){
  const c=_SETUP_M.method_configs.find(x=>x.id===cfgId);
  if(!c)return;
  const box=$('setup-lane-editor'); if(!box)return;
  const docs1=['','deposit_slip','cc_summary','grab_report','lineman_report','points_summary'];
  const docs2=['','bank_stmt_KTB','bank_stmt_KBANK','bank_stmt_*'];
  const methods=['direct','two_stage','cash_3way','itemized','issuer_points'];
  box.innerHTML=`<div class="card" style="background:#fafcff;border-color:var(--info);margin-top:10px">
    <div class="row"><b>แก้ lane ${esc(c.category)}·${esc(c.bank)}</b>
      <span class="chip c-setup">มีผลกับทุกรหัสใน lane นี้ · ต้องใช้รหัสผู้จัดการ</span>
      <a href="#" class="lbl" style="margin-left:auto" onclick="$('setup-lane-editor').innerHTML='';return false">ปิด</a></div>
    <div class="row" style="margin-top:8px;gap:14px">
      <label class="lbl">เอกสาร 1<br><select id="sle-doc1">${docs1.map(d=>`<option value="${d}" ${d===(c.doc1||'')?'selected':''}>${d?(_SETUP_DOC_TH[d]||d):'—'}</option>`).join('')}</select></label>
      <label class="lbl">เอกสาร 2<br><select id="sle-doc2">${docs2.map(d=>`<option value="${d}" ${d===(c.doc2||'')?'selected':''}>${d?(_SETUP_DOC_TH[d]||d):'—'}</option>`).join('')}</select></label>
      <label class="lbl">วิธี<br><select id="sle-method">${methods.map(m=>`<option ${m===c.method?'selected':''}>${m}</option>`).join('')}</select></label>
      <label class="lbl">tol/วัน (บาท)<br><input type="number" id="sle-tday" step="1" min="0" value="${c.tol_abs_day==null?'':c.tol_abs_day}" placeholder="ค่ากลาง" style="width:80px"></label>
      <label class="lbl">tol/เดือน (บาท)<br><input type="number" id="sle-tmon" step="1" min="0" value="${c.tol_abs==null?'':c.tol_abs}" placeholder="ค่ากลาง" style="width:80px"></label>
      <label class="lbl">เงินเข้าช้าได้ (วัน 0–14)<br><input type="number" id="sle-lag" step="1" min="0" max="14" value="${c.lag_days==null?'':c.lag_days}" style="width:60px"></label>
      <label class="lbl">รวมได้กี่วัน (1–7)<br><input type="number" id="sle-merge" step="1" min="1" max="7" value="${c.merge_days==null?'':c.merge_days}" style="width:60px"></label>
      <label class="lbl">มีค่าธรรมเนียม+VAT<br><input type="checkbox" id="sle-fee" ${c.fee_vat_expected?'checked':''}></label>
    </div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="sle-notes" value="${esc(c.notes||'')}" placeholder="หมายเหตุ"
        style="flex:1;min-width:200px;font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--txt)">
      <button class="btn btn-pri btn-sm" onclick="_setupSaveLane(${c.id})">บันทึก (ผู้จัดการ)</button>
    </div></div>`;
  box.scrollIntoView({behavior:'smooth',block:'center'});
}
async function _setupSaveLane(cfgId){
  const c=_SETUP_M.method_configs.find(x=>x.id===cfgId);
  const numVal=id=>{const x=$(id).value.trim();return x===''?null:+x;};
  const body={category:c.category,bank:c.bank,
    doc1:$('sle-doc1').value||null, doc2:$('sle-doc2').value||null,
    method:$('sle-method').value,
    tol_abs_day:numVal('sle-tday'), tol_abs:numVal('sle-tmon'),
    lag_days:numVal('sle-lag'), merge_days:numVal('sle-merge'),
    fee_vat_expected:$('sle-fee').checked?1:0,
    notes:$('sle-notes').value};
  try{
    await mgrApi(`/api/method-config/${cfgId}`,{method:'PATCH',body});
    toast('บันทึก lane แล้ว');
    loadSetup();
  }catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── seeds ── */
async function _setupReseedPos(){
  try{const r=await api('/api/payment-map/seed',{method:'POST'});
      toast(`เพิ่มรหัสใหม่ ${r.inserted} รหัส`);loadSetup();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function _setupSeedRequirement(){
  if(!confirm('ใส่ค่าตามตารางเจ้าของ (Requirement)?\nรหัส/lane ที่แก้เองไว้จะไม่ถูกทับ'))return;
  try{const r=await mgrApi('/api/setup/seed-requirement',{method:'POST'});
      toast(`อัปเดต ${r.codes.upgraded+r.codes.inserted} รหัส, ${r.methods.inserted} lane`);loadSetup();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── ③ bank accounts ── */
async function _setupAddAccount(){
  let brs;try{brs=await api('/api/branches');}catch(e){toast(e.message);return;}
  const pick=prompt(`สาขา? พิมพ์หมายเลข:\n${brs.map(b=>`${b.branch_id}=${b.name}`).join('  ')}`);
  if(pick===null)return;
  const bid=parseInt(pick.trim());
  if(!brs.some(b=>b.branch_id===bid)){toast('หมายเลขสาขาไม่ถูกต้อง');return;}
  const bank=prompt('ธนาคาร (KTB หรือ KBANK):','KBANK'); if(bank===null)return;
  const no=prompt('เลขบัญชี:'); if(!no)return;
  const name=prompt('ชื่อบัญชี (ไม่บังคับ):')||'';
  try{
    await api('/api/bank-accounts',{method:'POST',
      body:{branch_id:bid,bank:bank.trim().toUpperCase(),account_no:no.trim(),account_name:name}});
    toast('เพิ่มบัญชีแล้ว');loadSetup();
  }catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function _setupDelAccount(id){
  if(!confirm('ลบบัญชีนี้?'))return;
  try{await api(`/api/bank-accounts/${id}`,{method:'DELETE'});toast('ลบแล้ว');loadSetup();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}

/* ── ④ MIDs ── */
async function _setupAddMid(){
  let brs;try{brs=await api('/api/branches');}catch(e){toast(e.message);return;}
  const pick=prompt(`สาขา? พิมพ์หมายเลข:\n${brs.map(b=>`${b.branch_id}=${b.name}`).join('  ')}`);
  if(pick===null)return;
  const bid=parseInt(pick.trim());
  if(!brs.some(b=>b.branch_id===bid)){toast('หมายเลขสาขาไม่ถูกต้อง');return;}
  const acq=prompt('ผู้รับบัตร (KTB/KBANK/KTC/BAY/SCB/BBL/KTCPOINT/BAYPOINT):','KTC'); if(acq===null)return;
  const mid=prompt('Merchant ID:')||'';
  const term=prompt('Terminal ID (ไม่บังคับ):')||'';
  try{
    await api('/api/acquirer-mids',{method:'POST',
      body:{branch_id:bid,acquirer:acq.trim().toUpperCase(),merchant_id:mid.trim(),terminal_id:term.trim()}});
    toast('เพิ่ม MID แล้ว');loadSetup();
  }catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
async function _setupDelMid(id){
  if(!confirm('ลบ MID นี้?'))return;
  try{await api(`/api/acquirer-mids/${id}`,{method:'DELETE'});toast('ลบแล้ว');loadSetup();}
  catch(e){toast('ไม่สำเร็จ: '+e.message);}
}
/* ════════════════ END PHASE 4 ════════════════ */

_initNav();
route();
</script>
