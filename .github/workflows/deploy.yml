name: deploy

# Manual only. The one deploy path is `bash scripts/deploy-clean.sh` (DEPLOY.md):
# it ships origin/main from an isolated worktree and is followed by a live probe.
# Until 2026-09 this also fired on every push to main — a second deployer that
# restarted the machine on its own schedule, next to the nightly data push.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
