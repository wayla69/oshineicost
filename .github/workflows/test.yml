name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # app runtime deps needed to import main / the ingest chain
          pip install "uvicorn" "python-multipart" "openpyxl" "python-pptx" "python-dateutil"
      - name: Run tests (with coverage)
        env:
          OSHINEI_NO_SWAP: "1"   # never touch a real DB during import
        run: |
          python -m pytest -q --cov=main --cov=sync_mssql --cov=auth \
            --cov=upload_data --cov=reingest_raw_2026 --cov=ingest_easy \
            --cov=month_summary --cov-report=term-missing

  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # recon/main.py uses PEP 701 f-strings — requires >= 3.12
          python-version: "3.12"
      - name: Install deps
        run: |
          # FreeSerif (Thai-capable TTF) — the parser tests synthesize Thai
          # bank-statement PDFs with it and skip when it's absent.
          sudo apt-get update -q && sudo apt-get install -y -q fonts-freefont-ttf
          python -m pip install --upgrade pip
          pip install -r recon/requirements-dev.txt
      - name: Run recon tests (with coverage)
        run: |
          python -m pytest recon/tests -q --cov=recon --cov-report=term-missing

  # Frontend E2E: runs on every push/PR against a LOCAL server seeded with the
  # same hermetic fixture the backend pytest suite uses — it gates merges
  # instead of checking prod after the fact. A manual "Run workflow" dispatch
  # can still target a live deployment via the E2E_BASE_URL repo variable.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install "uvicorn" "python-multipart" "openpyxl" "python-pptx" "python-dateutil"
      - name: Seed fixture DB and start the dashboard
        env:
          OSHINEI_NO_SWAP: "1"
        run: |
          python tests/e2e/seed_db.py tests/e2e/.e2e-fixture.db
          OSHINEI_DB=$PWD/tests/e2e/.e2e-fixture.db \
            nohup python -m uvicorn backend.main:app --port 8010 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8010/api/months > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8010/api/months > /dev/null || { cat uvicorn.log; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run smoke
        working-directory: tests/e2e
        env:
          # dispatch may target a live deployment; push/PR always test the local server
          BASE_URL: ${{ (github.event_name == 'workflow_dispatch' && vars.E2E_BASE_URL) || 'http://localhost:8010' }}
        run: npx playwright test
