name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # the PINNED runtime set production runs on, plus the test tools
          pip install -r requirements.txt -r requirements-dev.txt pyflakes "python-pptx" "python-dateutil"
      - name: pyflakes (the backend is kept at zero warnings)
        run: python -m pyflakes $(ls *.py | grep -v '^test_\|^conftest') routers/*.py bom_center/*.py
      - name: Run tests (with coverage)
        env:
          OSHINEI_NO_SWAP: "1"   # never touch a real DB during import
        run: |
          python -m pytest -q --cov=main --cov=sync_mssql --cov=auth \
            --cov=upload_data --cov=reingest_raw_2026 --cov=ingest_easy \
            --cov=month_summary --cov-report=term-missing

  recon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # recon/main.py uses PEP 701 f-strings — requires >= 3.12
          python-version: "3.12"
      - name: Install deps
        run: |
          # FreeSerif (Thai-capable TTF) — the parser tests synthesize Thai
          # bank-statement PDFs with it and skip when it's absent.
          sudo apt-get update -q && sudo apt-get install -y -q fonts-freefont-ttf
          python -m pip install --upgrade pip
          pip install -r recon/requirements-dev.txt pyflakes
      - name: pyflakes (recon is kept at zero warnings)
        run: python -m pyflakes $(ls recon/*.py | grep -v '/test_\|/conftest') recon/routers/*.py
      - name: Run recon tests (with coverage)
        run: |
          python -m pytest recon/tests -q --cov=recon --cov-report=term-missing

  # Frontend E2E against a LOCAL server seeded with the same hermetic fixture the
  # backend pytest suite uses. Manual dispatch only (2026-09): a browser install
  # per run is the expensive job on a private-repo minute budget, and the
  # Playwright harnesses in scripts/ are run on the dev server before a merge.
  # A dispatch can target a live deployment via the E2E_BASE_URL repo variable.
  e2e:
    # every pull request walks every sidebar tab in a real browser against the seeded
    # fixture (a page-level JS error blocks the merge); a manual dispatch may target a
    # live deployment through the E2E_BASE_URL variable.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          # the PINNED runtime set production runs on (segno, openpyxl, ...), plus the test tools
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt "python-pptx" "python-dateutil"
      - name: Seed fixture DB and start the dashboard
        env:
          OSHINEI_NO_SWAP: "1"
        run: |
          python tests/e2e/seed_db.py tests/e2e/.e2e-fixture.db
          OSHINEI_DB=$PWD/tests/e2e/.e2e-fixture.db \
            nohup python -m uvicorn backend.main:app --port 8010 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8010/api/months > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8010/api/months > /dev/null || { cat uvicorn.log; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Prebuilt Tailwind sheet is up to date
        # vendor/tailwind.build.css is compiled from index.html, tabs/ and js/ (tailwind.config.js); a new class
        # without `npm run build:css` would render unstyled, so the merge is blocked instead (about 2 s)
        working-directory: tests/e2e
        run: npm run check:css
      - name: Run smoke
        working-directory: tests/e2e
        env:
          # dispatch may target a live deployment; push/PR always test the local server
          BASE_URL: ${{ (github.event_name == 'workflow_dispatch' && vars.E2E_BASE_URL) || 'http://localhost:8010' }}
        run: npx playwright test
