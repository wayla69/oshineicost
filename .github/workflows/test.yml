name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # app runtime deps needed to import main / the ingest chain
          pip install "uvicorn" "python-multipart" "openpyxl" "python-pptx" "python-dateutil"
      - name: Run tests (with coverage)
        env:
          OSHINEI_NO_SWAP: "1"   # never touch a real DB during import
        run: |
          python -m pytest -q --cov=main --cov=sync_mssql --cov=auth \
            --cov=upload_data --cov=reingest_raw_2026 --cov=ingest_easy \
            --cov=month_summary --cov-report=term-missing

  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # recon/main.py uses PEP 701 f-strings — requires >= 3.12
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r recon/requirements-dev.txt
      - name: Run recon tests (with coverage)
        run: |
          python -m pytest recon/tests -q --cov=recon --cov-report=term-missing

  # Frontend E2E is opt-in (needs a populated DB + browsers). Run manually via
  # the Actions "Run workflow" button, or locally — see tests/e2e/README.md.
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run smoke (expects BASE_URL to serve the app)
        working-directory: tests/e2e
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL || 'https://oshinei-dashboard.fly.dev' }}
        run: npx playwright test
