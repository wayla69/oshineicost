<div id="tab-supplyhome" style="display:none">
  <!-- PR-D6: the task filter (.tskf-seg / .tskf-btn) is a global style now - uiStateFilter (js/01-core.js), index.html -->

  <!-- หน้างาน (BoM Center UX overhaul, 2026-10-07; PR-M2 2026-10-10): what each person has to do now and where the month
       stands, from GET /api/bom-center/todo (js/16-supplyhome.js). "งานของฉัน" is the one open block; the close list
       (only for a role that owns a step, filtered to its steps) and "งานของฝ่ายอื่น" (centre roles) are folded.
       The strip holds the module's shared month and branch (supplyCtx, 01-core.js). -->
  <div id="shmCtxBar" class="card p-3 mb-3 flex flex-wrap items-center gap-3" style="position:sticky;top:0;z-index:5">
    <span class="text-sm font-semibold" style="color:var(--text-primary)">หน้างาน</span>
    <span id="shmBranchName" class="text-sm font-semibold" style="color:var(--text-primary);display:none"></span>
    <label class="text-xs" id="shmMonthWrap" style="color:var(--text-muted)">เดือน
      <select id="shmMonth" class="supply-month" onchange="shmCtxChanged()" style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:4px 8px;font-size:13px;background:var(--bg-input);color:var(--text-primary)"></select>
    </label>
    <label class="text-xs" id="shmBranchWrap" style="color:var(--text-muted)">สาขา
      <select id="shmBranch" data-branch-picker onchange="shmCtxChanged()" style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:4px 8px;font-size:13px;background:var(--bg-input);color:var(--text-primary);max-width:220px"></select>
    </label>
    <span id="shmNote" class="text-xs" style="color:var(--text-secondary)"></span>
    <span id="shmStatus" class="text-[11px] ml-auto" style="color:var(--text-muted)"></span>
  </div>

  <!-- PR-M7 (branch login only): "วันนี้เหลือทำอะไร" — ตัดเบิก · สั่งสินค้า · รับสินค้า, one line each, from the same to-do items as the cards below -->
  <div class="card p-3 mb-3" id="shmToday" style="display:none">
    <div class="section-title mb-1">วันนี้เหลือทำอะไร</div>
    <div id="shmTodayRows"></div>
  </div>

  <!-- PR-M7 (branch login only): install as an app on the phone's home screen; × keeps it away on this device -->
  <div class="card p-3 mb-3" id="shmInstall" style="display:none">
    <div class="flex items-center gap-2">
      <div class="flex-1 min-w-0"><div class="text-sm font-semibold" style="color:var(--text-primary)">ติดตั้งเป็นแอปบนหน้าจอโทรศัพท์</div>
        <div id="shmInstallHint" class="text-xs" style="color:var(--text-secondary)">เปิดได้เหมือนแอป ไม่ต้องพิมพ์ที่อยู่เว็บ</div></div>
      <button type="button" id="shmInstallBtn" onclick="shmInstallApp()" class="rounded-lg px-3" style="min-height:44px;background:var(--accent);color:var(--on-accent);border:0;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0">ติดตั้ง</button>
      <button type="button" onclick="shmInstallDismiss()" aria-label="ปิด" style="min-height:44px;min-width:44px;border:0;background:none;color:var(--text-muted);font-size:20px;cursor:pointer;flex-shrink:0">×</button>
    </div>
  </div>

  <!-- batch 3 (2.1): turn on the reminders of this login's own work on this phone - the same card logic as the owner's summary
       (09c-mobile.js msPush*, with the id prefix shmPush); kind "supply": the morning line, the 11:00 warning, the centre lines.
       Hidden where push is not available (an iPhone tab that is not installed, a server without the key). -->
  <div class="card p-3 mb-3" id="shmPush" style="display:none">
    <div class="text-sm font-semibold" style="color:var(--text-primary)">รับการแจ้งเตือนบนมือถือ</div>
    <p id="shmPushState" class="text-xs" style="color:var(--text-secondary);margin-top:2px">กำลังตรวจสอบ…</p>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      <button id="shmPushOn" onclick="msPushEnable('shmPush')" style="min-height:44px;padding:10px 16px;font-size:13px;font-weight:600;border-radius:var(--r-md);border:0;background:var(--accent);color:var(--on-accent);cursor:pointer">เปิดการแจ้งเตือน</button>
      <button id="shmPushOff" onclick="msPushDisable('shmPush')" style="display:none;min-height:44px;padding:10px 16px;font-size:13px;font-weight:600;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);cursor:pointer">ปิด</button>
      <button id="shmPushTest" onclick="msPushTest('shmPush')" style="display:none;min-height:44px;padding:10px 16px;font-size:13px;font-weight:600;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);cursor:pointer">ส่งทดสอบ</button>
    </div>
    <div id="shmPushKinds" style="display:none"></div>
  </div>

  <!-- batch 3 (4.7): the all-branches grid in one line, for the centre roles (loadSupplyHome → shmAdoptionLoad) -->
  <div class="card p-3 mb-3" id="shmAdoption" style="display:none">
    <div class="flex items-center gap-3">
      <div class="flex-1 min-w-0"><div class="text-sm font-semibold" style="color:var(--text-primary)">การใช้งานทุกสาขา (7 วันล่าสุด)</div>
        <div id="shmAdoptionLine" class="text-sm" style="color:var(--text-secondary)">กำลังโหลด…</div></div>
      <a href="#" onclick="supplyGo({tab:'orderhub',pane:'adoption'});return false" class="text-xs whitespace-nowrap" style="color:var(--accent);padding:12px 0 12px 6px">ดูรายสาขา →</a>
    </div>
  </div>

  <!-- PR-TF: ทั้งหมด · ยังไม่เสร็จ · รอตรวจ · เสร็จแล้ว - filters every list below; default ยังไม่เสร็จ, remembered per browser -->
  <div id="shmFilter" class="tskf-seg" role="group" aria-label="กรองงานตามสถานะ"></div>

  <div class="card p-4 mb-3" id="shmMineCard">
    <div class="flex items-baseline justify-between gap-2">
      <div class="section-title mb-0">งานของฉัน</div>
      <span id="shmMineCount" class="text-[11px]" style="color:var(--text-muted)"></span>
    </div>
    <div id="shmMine"></div>
  </div>

  <details class="card p-4 mb-3" id="shmCloseCard" style="display:none">
    <summary class="text-sm font-semibold cursor-pointer" style="color:var(--text-primary)">ปิดงวดเดือน <span id="shmCloseMonth"></span>
      <span id="shmCloseCount" class="font-normal text-xs" style="color:var(--text-muted)"></span></summary>
    <div id="shmClose" class="mt-2"></div>
  </details>

  <details class="card p-4 mb-3" id="shmOthers" style="display:none">
    <summary class="text-sm font-semibold cursor-pointer" style="color:var(--text-primary)">งานของฝ่ายอื่น <span id="shmOthersCount" class="font-normal text-xs" style="color:var(--text-muted)"></span></summary>
    <div id="shmOthersBody" class="mt-2"></div>
  </details>
</div>
