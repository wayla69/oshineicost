<div id="tab-supplyhome" style="display:none">

  <!-- หน้างาน (BoM Center UX overhaul, 2026-10-07): what each person has to do now and
       where the month stands, from GET /api/bom-center/todo (js/16-supplyhome.js).
       The strip holds the module's shared month and branch (supplyCtx, 01-core.js). -->
  <div id="shmCtxBar" class="card p-3 mb-3 flex flex-wrap items-center gap-3" style="position:sticky;top:0;z-index:5">
    <span class="text-sm font-semibold" style="color:var(--text-primary)">หน้างาน</span>
    <label class="text-xs" style="color:var(--text-muted)">งวดเดือน
      <input type="month" id="shmMonth" onchange="shmCtxChanged()" style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:4px 8px;font-size:13px;background:var(--bg-input);color:var(--text-primary)">
    </label>
    <label class="text-xs" id="shmBranchWrap" style="color:var(--text-muted)">สาขา
      <select id="shmBranch" data-branch-picker onchange="shmCtxChanged()" style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:4px 8px;font-size:13px;background:var(--bg-input);color:var(--text-primary);max-width:220px"></select>
    </label>
    <span id="shmNote" class="text-xs" style="color:var(--text-secondary)"></span>
    <span id="shmStatus" class="text-[11px] ml-auto" style="color:var(--text-muted)"></span>
  </div>

  <div class="grid gap-3 mb-3" style="grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))">
    <div class="card p-4" id="shmMineCard">
      <div class="flex items-baseline justify-between gap-2">
        <div class="section-title mb-0">งานของฉัน</div>
        <span id="shmMineCount" class="text-[11px]" style="color:var(--text-muted)"></span>
      </div>
      <p class="text-[11px] mt-1 mb-1" style="color:var(--text-muted)">งานของวันนี้และของงวดนี้ที่บทบาทของคุณรับผิดชอบ กด “ไปที่งาน” เพื่อเปิดหน้านั้นโดยเลือกเดือนและสาขาให้แล้ว</p>
      <div id="shmMine"></div>
    </div>
    <div class="card p-4" id="shmCloseCard">
      <div class="flex items-baseline justify-between gap-2">
        <div class="section-title mb-0">ปิดงวดเดือน <span id="shmCloseMonth"></span></div>
        <span id="shmCloseCount" class="text-[11px]" style="color:var(--text-muted)"></span>
      </div>
      <p class="text-[11px] mt-1 mb-1" style="color:var(--text-muted)">ลำดับขั้นตอนของการปิดงวดย้อนหลัง สถานะอ่านจากข้อมูลจริงในระบบ</p>
      <div id="shmClose"></div>
    </div>
  </div>

  <details class="card p-4 mb-3" id="shmOthers">
    <summary class="text-sm font-semibold cursor-pointer" style="color:var(--text-primary)">งานของฝ่ายอื่น <span id="shmOthersCount" class="font-normal text-xs" style="color:var(--text-muted)"></span></summary>
    <div id="shmOthersBody" class="mt-2"></div>
  </details>
</div>
