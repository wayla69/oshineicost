<!-- ══════════════════════════════════════════════════════════════════════════
     TAB: UNIFIED SIMULATORS HUB — every simulator in one place
══════════════════════════════════════════════════════════════════════════ -->
<div id="tab-simhub" style="display:none">
  <div class="card p-4 mb-4" style="background:var(--accent-soft);border:1px solid var(--accent)">
    <div class="flex items-start gap-3">
      <span style="font-size:26px"></span>
      <div>
        <h2 class="text-base font-bold" style="color:var(--accent)">ตัวจำลอง — รวมตัวจำลองทั้งหมดไว้ที่เดียว <button type="button" class="ui-q" aria-label="คำอธิบาย" aria-haspopup="dialog" data-help="hlp-simhub-mb1" title="คำอธิบาย">?</button></h2><template id="hlp-simhub-mb1" data-title="ตัวจำลอง"><p>ต้นทุน · ความไวของต้นทุน · อัปเกรดระดับราคา · สถานการณ์จำลอง — ทุกตัวใช้ตัวกรองสาขา/ช่วงเดือนด้านบนร่วมกัน</p></template>
      </div>
    </div>
  </div>

  <!-- DV2: the simulators are editors - on a phone a notice first -->
  <div class="desk-note" role="note"><span>ตัวแก้ไขนี้ใช้งานบนคอมพิวเตอร์</span><button type="button" class="shm-showall" onclick="deskShow(this)">แสดงบนโทรศัพท์</button></div>
  <div class="desk-only">
  <!-- Mode switcher -->
  <div class="flex flex-wrap gap-1 mb-5" style="background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--r-md);padding:4px;width:fit-content">
    <button onclick="simhubSetMode('bomcost')"     id="sh-mode-bomcost"     class="subtab-btn active text-sm px-4 py-1.5">ต้นทุน BoM</button>
    <button onclick="simhubSetMode('sensitivity')" id="sh-mode-sensitivity" class="subtab-btn text-sm px-4 py-1.5">ความไวของต้นทุน</button>
    <button onclick="simhubSetMode('tier')"        id="sh-mode-tier"        class="subtab-btn text-sm px-4 py-1.5">อัปเกรดระดับราคา</button>
    <button onclick="simhubSetMode('whatif')"      id="sh-mode-whatif"      class="subtab-btn text-sm px-4 py-1.5">สถานการณ์จำลอง</button>
  </div>

  <!-- Mode hosts (live simulators are moved in here on first view) -->
  <div id="sh-host-bomcost"     class="sh-pane"></div>
  <div id="sh-host-sensitivity" class="sh-pane hidden"></div>
  <div id="sh-host-tier"        class="sh-pane hidden"></div>
  <div id="sh-host-whatif"      class="sh-pane hidden"></div>
  </div>
</div>
