<!-- ══ EXTRA: บิลยกเลิก/ลบ (whole-bill voids) ══ -->
<div id="tab-cancelbill" style="display:none">
  <div class="card p-3 mb-4 flex flex-wrap items-center gap-3" style="background:var(--bg-subtle)">
    <span class="text-xs font-semibold" style="color:var(--text-secondary)">เดือน:</span>
    <select id="cbMonth" onchange="loadCancelBill(true)" style="border:1px solid var(--border);border-radius:var(--r-md);padding:5px 8px;font-size:12.5px;background:var(--bg-input);color:var(--text-primary);min-width:130px"></select>
    <span id="cbRange" class="text-[11px]" style="color:var(--text-muted)"></span>
    <span class="text-[11px] ml-auto" style="color:var(--text-muted)">บิลที่ถูกลบ/ยกเลิกทั้งใบ (คนละอันกับ Void รายเมนูใน รายงานปฏิบัติการ)</span>
  </div>
  <div id="phd-cancelbill" class="ph-host"></div>
  <div id="cbKpis" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
  <div id="cbAlert" class="mb-4"></div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="card p-5 overflow-x-auto">
      <h2 class="section-title mb-3">ตามเหตุผล</h2>
      <table class="text-xs w-full"><thead><tr class="text-left border-b border-slate-200" style="color:var(--text-muted)">
        <th class="py-1.5 pr-2">เหตุผล</th><th class="py-1.5 pr-2 text-right">บิล</th><th class="py-1.5 pr-2 text-right">%</th><th class="py-1.5 text-right">มูลค่า</th>
      </tr></thead><tbody id="cbReasons"></tbody></table>
    </div>
    <div class="card p-5 overflow-x-auto">
      <h2 class="section-title mb-3">รายสาขา (เรียงตามจำนวนบิล)</h2>
      <table class="text-xs w-full"><thead><tr class="text-left border-b border-slate-200" style="color:var(--text-muted)">
        <th class="py-1.5 pr-2">สาขา</th><th class="py-1.5 pr-2 text-right">บิลยกเลิก</th><th class="py-1.5 text-right">มูลค่า</th>
      </tr></thead><tbody id="cbBranches"></tbody></table>
    </div>
  </div>
</div>
