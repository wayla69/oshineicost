    <div class="hvm-head">
      <h2 class="section-title mb-0"><span id="hvmTitle">ต้นทุนวัตถุดิบหลักต่อหัว · ทุกสาขา</span> <span id="hvmRangeQ"></span> <button type="button" id="hvmHelpQ" class="ui-q" aria-label="คำอธิบาย" aria-haspopup="dialog" data-help="hlp-hvmonitor" title="คำอธิบาย">?</button></h2><template id="hlp-hvmonitor" data-title="High Value Product Monitor · บาท"><p><b>ช่วงเวลาและสาขา</b> · ตามแถบด้านบน (สัปดาห์ · เดือน · ปี · กำหนดเอง และสาขาที่เลือก) · ช่วงที่ยังไม่จบนับถึงวันที่ปิดยอดล่าสุด และเทียบจำนวนวันเท่ากันของช่วงก่อน · ช่วงที่เทียบดูได้ที่ปุ่ม ? ข้างหัวข้อ · ไม่มีข้อมูลฐานแสดง —</p><p><b>บรรทัดคำตอบ</b> · ต้นทุนของวัตถุดิบที่เปลี่ยนเทียบช่วงก่อนเป็นบาท และแยกเป็นสามส่วนที่รวมกันเท่ากับส่วนที่เปลี่ยนพอดี: <b>ราคา</b> (ต้นทุนต่อจาน) · <b>กิน</b> (จานต่อหัว) · <b>ลูกค้า</b> (จำนวนลูกค้า) · เมื่อสาเหตุหลักเป็นราคาและต้นทุนต่อจานขึ้นที่หลายสาขาพร้อมกัน แสดงจำนวนสาขา (เป็นเรื่องราคาซื้อหรือรายการราคารายเดือน ไม่ใช่เรื่องการตักเสิร์ฟของสาขา) · มุมมองทั้งหมดแสดงสองวัตถุดิบที่เปลี่ยนมากที่สุด</p><p><b>ทั้งหมด</b> · หนึ่งแถวต่อวัตถุดิบ เรียงตามบาทที่เปลี่ยน (ที่เพิ่มขึ้นก่อน) · <b>สาขาที่ดัน</b> = สามสาขาที่เปลี่ยนมากที่สุดในทิศเดียวกับทั้งเครือ · <b>ต้นทุน</b> = ต้นทุนรวมของวัตถุดิบในช่วงนี้ · แตะแถวเพื่อดูรายสาขาของวัตถุดิบนั้น</p><p><b>วัตถุดิบเดียว</b> · หนึ่งแถวต่อสาขา เรียงตามบาทที่เปลี่ยน · คอลัมน์ <b>เปลี่ยน</b> = บาทที่เปลี่ยนและสาเหตุหลักใต้ตัวเลข · <b>สะสม</b> = ส่วนที่เพิ่มขึ้นสะสมจากแถวบนลงล่างเทียบกับส่วนที่เพิ่มขึ้นทั้งหมด (อ่านถึงประมาณ 80% ก็พอ) · สาขาที่เปลี่ยนน้อยกว่า ฿1,000 อยู่ใน <b>ดูทั้งหมด</b> · <b>ต้นทุน/หัว</b> = ต้นทุนของกลุ่ม ÷ ลูกค้าทั้งหมดของสาขา · <b>จาน/หัว</b> = จานของกลุ่ม ÷ ลูกค้า · <b>ต้นทุน/จาน</b> = ต้นทุน ÷ จานที่มีต้นทุน · <b>สัดส่วนในต้นทุนอาหาร</b> = ต้นทุนของกลุ่ม ÷ ต้นทุนอาหารทั้งหมดของสาขา · ต้นทุนต่อจานใช้ต้นทุนเดียวกับ P&amp;L และ GP (รายการต้นทุนต่อจานของเดือนนั้น) · เมนูที่ไม่มีต้นทุนนับจานแต่ไม่นับต้นทุน</p><p><b>กลุ่มวัตถุดิบ</b> · นับจากชื่อเมนู: แซลมอน (แซลมอน, แซลม่อน) · ทูน่า (ทูน่า, มากุโระ, โทโร่) · ฮามาจิ · กุ้งหวาน (กุ้งหวาน, อามะเอบิ, กุ้งแดงอาร์เจนติน่า, กุ้งอาร์เจนติน่า) · หอยเชลล์ (หอยเชลล์, โฮตาเตะ) · ปลาไหล (ปลาไหล, อูนางิ, อูนากิ) · หอยนางรม · เนื้อ (เนื้อ, วากิว, ลิ้นวัว ไม่รวมปลาเนื้อขาว เนื้อปู เนื้อปลา) · ไม่นับแพ็กเกจบุฟเฟ่ต์ · เมนูที่ชื่อตรงหลายกลุ่ม (เช่น ซาชิมิรวม) นับในทุกกลุ่มที่ตรงด้วยต้นทุนเต็มจาน และมีป้าย <b>หลายกลุ่ม</b> ในรายการเมนู</p><p><b>สาเหตุที่เปลี่ยน</b> · ต้นทุนของกลุ่ม = ลูกค้า × จานต่อหัว × ต้นทุนต่อจาน จึงแยกได้ด้วยวิธีลอการิทึม (LMDI) โดยนับเฉพาะจานที่มีต้นทุน · <b>สาเหตุหลัก</b> = ส่วนที่มีค่ามากที่สุด · ต้นทุนเพิ่มเป็นสีแดง ลดเป็นสีเขียว ส่วนของลูกค้าเป็นสีเทา</p><p>แตะแถวของสาขาเพื่อดูทุกตัวเลข ช่วงนี้ · ช่วงก่อน · ปีก่อน และเมนูของกลุ่มที่สาขานั้น · <b>จำนวนจาน</b> = มุมมองเดียวกันเป็นจำนวนจาน ไม่มีจำนวนเงิน · CSV = ตารางที่แสดงอยู่ (ทั้งหมด = ทุกสาขาคูณทุกวัตถุดิบ)</p><p><b>บนโทรศัพท์</b> · แต่ละวัตถุดิบแสดงทั้งเครือ สาขาที่เพิ่มขึ้นมากสุด 5 สาขา และสาขาที่ลดลงมากสุด 5 สาขา แถวละหนึ่งบรรทัด (สาขา · บาทที่เปลี่ยน · สาเหตุหลัก) · แตะแถวเพื่อดูทุกคอลัมน์ · <b>ดูทั้งหมด</b> = ทุกสาขา · <b>ย่อรายการ</b> = กลับไปรายการสั้น</p></template><template id="hlp-hvmonitor-plates" data-title="วัตถุดิบมูลค่าสูง · จำนวนจาน"><p><b>สัปดาห์ · เทียบ</b> · ค่าเริ่มต้นเป็นสัปดาห์ล่าสุดเทียบสัปดาห์ก่อน (จันทร์–อาทิตย์ เลขสัปดาห์ W1–W53 ของปี) และเลือกเทียบกับสัปดาห์ใดก็ได้ ก่อนหรือหลังก็ได้ · สัปดาห์ที่ยังไม่จบนับถึงวันที่ปิดยอดล่าสุด และเทียบกับวันเดียวกันของอีกสัปดาห์ (เช่น จ.–ศ. เทียบ จ.–ศ.) · <b>ตามแถบด้านบน</b> = ใช้ช่วงเวลาของแถบด้านบนและเทียบกับช่วงก่อนจำนวนวันเท่ากัน · เมื่อเปลี่ยนช่วงเวลาที่แถบด้านบน มุมมองนี้ใช้ช่วงของแถบด้านบน · สาขาตามแถบด้านบนเสมอ · เครื่องนี้จำค่าที่เลือกไว้</p><p><b>เดิม</b> · ตัวเลขของช่วงที่เทียบ แสดงต่อจาก ▲▼ ใต้ตัวเลขทุกช่อง · เมื่อสัปดาห์ที่เทียบอยู่หลังสัปดาห์ที่เลือก แสดงเป็น <b>เทียบ</b></p><p><b>กลุ่มวัตถุดิบ</b> · กลุ่มเดียวกับมุมมองบาท นับจากชื่อเมนู: แซลมอน (แซลมอน, แซลม่อน) · ทูน่า (ทูน่า, มากุโระ, โทโร่) · ฮามาจิ · กุ้งหวาน (กุ้งหวาน, อามะเอบิ, กุ้งแดงอาร์เจนติน่า, กุ้งอาร์เจนติน่า) · หอยเชลล์ (หอยเชลล์, โฮตาเตะ) · ปลาไหล (ปลาไหล, อูนางิ, อูนากิ) · หอยนางรม · เนื้อ (เนื้อ, วากิว, ลิ้นวัว ไม่รวมปลาเนื้อขาว เนื้อปู เนื้อปลา) · ไม่นับแพ็กเกจบุฟเฟ่ต์ · เมนูที่ชื่อตรงหลายกลุ่ม (เช่น ซาชิมิรวม) นับในทุกกลุ่มที่ตรงด้วยต้นทุนเต็มจาน และมีป้าย <b>หลายกลุ่ม</b> ในรายการเมนู</p><p><b>จานที่ออก</b> = จำนวนจานของเมนูในกลุ่ม · <b>จาน/หัว</b> = จานที่ออก ÷ ลูกค้าทั้งหมดของสาขา · <b>ลูกค้า</b> = ลูกค้าทั้งหมดของสาขาในช่วงเดียวกัน · ▲▼ = เปลี่ยนเทียบช่วงที่เทียบ (จาน/หัวเพิ่มขึ้นเป็นสีแดง ลูกค้าเพิ่มขึ้นเป็นสีเขียว)</p><p><b>สาเหตุที่เปลี่ยน</b> · จานที่ออก = ลูกค้า × จานต่อหัว จึงแยกจานที่เปลี่ยนเป็นสองส่วน (ลูกค้า · กินต่อหัว) ที่รวมกันเท่ากับจานที่เปลี่ยนพอดี ด้วยวิธีลอการิทึม (LMDI) · <b>สาเหตุหลัก</b> = ส่วนที่มีค่ามากกว่า · คอลัมน์ <b>จากกินต่อหัว</b> = จานที่เปลี่ยนเพราะกินต่อหัวเปลี่ยน (เพิ่มขึ้นเป็นสีแดง) บรรทัดล่าง = ส่วนของลูกค้าและจานที่เปลี่ยนรวม · สาขาเรียงตามคอลัมน์นี้ (จานส่วนเกินก่อน) · <b>สะสม</b> = จานส่วนเกินสะสมจากแถวบนลงล่าง · สาขาที่กินต่อหัวเปลี่ยนน้อยกว่า 20 จานอยู่ใน <b>ดูทั้งหมด</b> · ในมุมมอง <b>ทั้งหมด</b> แสดงเป็นคำสั้น ลูกค้า หรือ กิน</p><p>มุมมองนี้แสดงเฉพาะจำนวนจาน ไม่มีจำนวนเงิน · CSV = ทุกสาขาคูณทุกวัตถุดิบของช่วงที่แสดง</p><p><b>บนโทรศัพท์</b> · แต่ละวัตถุดิบแสดงทั้งเครือ สาขาที่เพิ่มขึ้นมากสุด 5 สาขา และสาขาที่ลดลงมากสุด 5 สาขา แถวละหนึ่งบรรทัด (สาขา · จานที่เปลี่ยน · สาเหตุหลัก) · แตะแถวเพื่อดูทุกคอลัมน์ · <b>ดูทั้งหมด</b> = ทุกสาขา · <b>ย่อรายการ</b> = กลับไปรายการสั้น</p></template>
