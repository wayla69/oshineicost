<div id="tab-dailysales" style="display:none">
  <!-- PR-PP2: the period is the top bar's (one control per page); the range shows beside the page title -->
  <div id="dsKpis" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
  <div id="dsAnomaly" class="mb-4"></div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-5">
    <div class="card p-5 lg:col-span-2 overflow-x-auto">
      <h2 class="section-title mb-3">ยอดขายรายสาขา <span id="dsCmpNote" class="font-normal normal-case"></span></h2>
      <table class="text-xs w-full">

          <th class="py-1.5 pr-2 text-right" id="dsThPrev">เทียบช่วงก่อน</th><th class="py-1.5 text-right" id="dsThLy">เทียบปีก่อน</th>

    <div class="card p-5">

    </div>

  <div class="card p-5 mb-5" data-needs="/api/sales/menu-spike">
    <style>
      /* PR-SP · menu spike period chips: one track like the page's วัน / สัปดาห์ / เดือน, a neutral chip for the resolved range */
      .sp-modes { display: inline-flex; align-items: stretch; box-sizing: border-box; height: 32px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--r-md); padding: 2px; gap: 2px; max-width: 100%; }
      /* PR-TD (owner 2026-10-25) · one balanced row: the period track, the branch and CSV share one height (32 px; 36 px on a phone) and wrap as
         whole controls on a narrow phone. A phone keeps a 44 px tap area through an invisible ::after (a button) or a transparent border (the
         select), never through a bigger control. In พอดีจอ the whole row is counter-zoomed as one unit (.ph-tz-unit, js/09c-mobile.js). */
      .sp-ctl { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
      .sp-modes .gran-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; height: 100%; min-height: 0; padding: 0 12px; font-size: 13px; line-height: 1; }
      .sp-ms { display: none; }
      #spikeBranch { box-sizing: border-box; height: 32px; min-height: 0; padding: 0 28px 0 10px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--r-md); background-color: var(--bg-input); color: var(--text-primary); max-width: 180px; }
      .sp-csv { position: relative; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; height: 32px; min-height: 0; padding: 0 12px; font-size: 13px; font-weight: 600;
        border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-input); color: var(--text-secondary); cursor: pointer; }
      .sp-csv:hover { color: var(--text-primary); background: var(--bg-hover); }
      .sp-range { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-secondary); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; vertical-align: middle; }
      .sp-sub { color: var(--text-muted); font-size: 12px; margin: 0 0 8px; }
      .sp-custom { display: flex; flex: 1 1 100%; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; font-size: 13px; color: var(--text-secondary); }
      .sp-custom[hidden], .sp-custom [hidden] { display: none !important; }
      .sp-cg { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }
      .sp-lbl { font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
      .sp-dates { display: inline-flex; align-items: center; gap: 4px; }
      .sp-custom select, .sp-custom input[type="date"] { box-sizing: border-box; height: 32px; min-height: 0; padding: 0 8px; font-size: 13px; border: 1px solid var(--border);
        border-radius: var(--r-md); background-color: var(--bg-input); color: var(--text-primary); }
      .sp-custom input[type="date"] { width: 132px; }
      /* PR-TD · the strip: four tiles under the controls (2-up on a phone); figures 17 px bold, labels 12 px */
      .sp-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
      .sp-strip[hidden] { display: none; }
      .sp-tile { border: 1px solid var(--border); border-radius: 12px; background: var(--bg-subtle); padding: 8px 12px; min-width: 0; }
      .sp-tile-l { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
      .sp-tile-v { font-size: 17px; font-weight: 800; line-height: 1.3; color: var(--text-primary); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sp-tile-u { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
      .sp-tile-s { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sp-tile .ui-q { width: 24px; height: 24px; min-width: 24px; font-size: 12px; margin: -4px 0; }
      .sp-tile .ui-q::after { inset: -10px; }   /* 44 px to tap (the phone rule draws the ::after) */
      .sp-apply { position: relative; box-sizing: border-box; height: 32px; min-height: 0; border: 1px solid var(--accent); border-radius: var(--r-md); padding: 0 14px; font-size: 13px; font-weight: 600; background: var(--accent); color: var(--on-accent, #fff); cursor: pointer; }
      .sp-perday { font-size: 12px; font-weight: 400; color: var(--text-muted); white-space: nowrap; line-height: 1.35; }
      /* PR-TD · the figures read first: 15 px semibold tabular (14 px in พอดีจอ), the lines under them 12 px, menu names 14 px */
      .sp-tbl { font-size: 13px; border-collapse: collapse; }
      .sp-tbl th { padding: 6px 14px 6px 0; font-size: 12px; font-weight: 600; white-space: nowrap; vertical-align: bottom; }
      .sp-tbl td { padding: 8px 14px 8px 0; vertical-align: top; }
      .sp-tbl th:last-child, .sp-tbl td:last-child { padding-right: 0; }
      .sp-tbl .sp-rn { width: 1%; font-size: 12px; }
      .sp-name { min-width: 200px; width: 28%; }
      /* PR-SX (owner 2026-10-25) · balanced columns: each table carries a colgroup (เมนู ~28-32 %, tier ~16 %, ต้นทุนเพิ่ม ~14 %); on a wide
         desktop the layout is fixed to it and a menu name wraps to at most two lines (its full name in the title). Narrower screens and
         พอดีจอ keep the auto layout (the colgroup is only a hint there), so a figure never spills into its neighbour. */
      @media (min-width: 1200px) {
        body:not(.ph-fit) .sp-tbl.sp-fixed { table-layout: fixed; }
        body:not(.ph-fit) .sp-fixed .sp-name { min-width: 0; }
        body:not(.ph-fit) .sp-fixed .sp-tier { width: auto; }
      }
      .sp-fixed .sp-menu { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      /* PR-SX · ขายน้อยช่วงก่อน: a small muted marker after the × figure (title + aria-label = the full text, explained in the card's "?") */
      .sp-mk { display: inline-block; margin-left: 2px; font-size: 12px; font-weight: 400; line-height: 1; color: var(--text-muted); cursor: help; vertical-align: 1px; }
      .sp-mk-full[hidden] { display: none; }
      /* PR-SX · a raw-plates row whose menu is also a per-head spike; the filter chip in the section's header; the new-menu cost gap */
      .sp-dup-chip { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); background: var(--bg-subtle);
        font-size: 12px; font-weight: 600; line-height: 18px; white-space: nowrap; vertical-align: 1px; }
      /* PR-RK · a ranked existing-menu row that also passes the old rule (>= 1.5x per head): bad ink = above normal */
      .sp-hi-chip { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--bad-ink); color: var(--bad-ink); background: var(--bg-card);
        font-size: 12px; font-weight: 700; line-height: 18px; white-space: nowrap; vertical-align: 1px; }
      .sp-gap-chip { display: inline-block; padding: 0 8px; border-radius: 999px; border: 1px solid var(--amber-ink); color: var(--amber-ink); background: var(--bg-card);
        font-size: 12px; font-weight: 700; line-height: 18px; white-space: nowrap; }
      .sp-flt { position: relative; box-sizing: border-box; height: 28px; min-height: 0; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px;
        background: var(--bg-input); color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
      .sp-flt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent, #fff); }
      .sp-menu { font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--text-primary); }
      .sp-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .sp-v { font-size: 15px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; color: var(--text-primary); }
      .sp-cost-td .sp-v { font-weight: 800; }
      .sp-v2 { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
      body.ph-fit .sp-v { font-size: 14px; }
      body.ph-fit .sp-v2, body.ph-fit .sp-menu { font-size: 13px; }
      body.ph-fit .sp-tbl th, body.ph-fit .sp-tbl td { padding-right: 9px; }
      body.ph-fit .sp-name { min-width: 170px; }
      body.ph-fit #dsSpike .sp-h:has(.ui-q) { margin-bottom: 26px; }   /* the frame is scaled ~0.47: room under the "?" for its 44 px tap area above the sticky header */
      /* PR-SN · two parts: existing menus that spiked (bad ink = above normal), new menus (sky ink = still in their first 4 weeks) */
      .sp-sec { margin: 0 0 14px; }
      .sp-sec:last-child { margin-bottom: 0; }
      .sp-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; padding: 2px 0 2px 8px; border-left: 3px solid var(--bad-ink); font-size: 13px; font-weight: 700; color: var(--text-primary); }
      .sp-sec-new .sp-h { border-left-color: var(--sky-ink); }
      .sp-n { font-weight: 600; color: var(--text-secondary); }
      .sp-short { display: none; }
      .sp-thin { font-size: 11px; font-weight: 400; color: var(--text-muted); white-space: nowrap; }
      .sp-empty { font-size: 12px; color: var(--text-muted); padding: 4px 0 4px 11px; margin: 0; }
      .sp-box { max-height: 380px; overflow: auto; }
      /* PR-ST · per head + the tiers behind the increase: a grey branch line under the menu (ทุกสาขา), tier chips (bad ink = that tier
         itself >= 1.5x its own normal), the unit in the header kept small */
      .sp-br { font-size: 12px; font-weight: 400; color: var(--text-muted); margin-top: 1px; }
      .sp-unit { display: block; font-weight: 400; font-size: 11px; white-space: nowrap; }   /* the unit under the head: the figure columns stay narrow */
      /* PR-TD · เพิ่มจาก tier: one tier per line, a two-column mini list (tier left, +จาน right); bad ink + bold = that tier >= 1.5x its own normal */
      .sp-tier { width: 1%; }
      .sp-tls { display: grid; gap: 2px; width: max-content; min-width: 108px; }
      .sp-tl { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; white-space: nowrap; font-size: 13px; line-height: 1.35; color: var(--text-secondary); }
      .sp-tl-v { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-primary); }
      .sp-tl-hi, .sp-tl-hi .sp-tl-v { color: var(--bad-ink); font-weight: 700; }
      .sp-tl-more { font-size: 12px; color: var(--text-muted); }
      /* PR-TD · กลับมาขาย: an existing menu back on sale after >= 21 days without one (sky ink, as the new-menu part) */
      .sp-back-chip { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--sky-ink); color: var(--sky-ink); background: var(--bg-card);
        font-size: 12px; font-weight: 700; line-height: 18px; white-space: nowrap; vertical-align: 1px; }
      /* PR-SC · ต้นทุนเพิ่ม (cost roles only): the header chip sums the first 15 rows (bad ink = extra cost above ฿0); a row without a cost is a
         grey note and sits last; "ดูทั้งหมด (N)" opens the rest */
      .sp-sub [hidden] { display: none !important; }
      .sp-box.sp-box-top { max-height: none; overflow: visible; }   /* the first 15 rows: no scroll box, the whole list at a glance */
      .sp-nocost { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
      .sp-sort { font-size: 11px; font-weight: 400; color: var(--text-muted); }
      .sp-sec-plates .sp-h { border-left-color: var(--text-muted); }
      .sp-fold { position: relative; margin-left: auto; box-sizing: border-box; height: 28px; min-height: 0; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-md);
        background: var(--bg-input); color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; }
      #spikePlatesBody[hidden], #spikeNewBody[hidden] { display: none; }
      /* DV3 · by dish: สาขาที่ดัน (chain view) / เพิ่มจาก tier (one branch) under the menu name, the scope beside the heading */
      .sp-push { font-size: 12px; font-weight: 400; line-height: 1.4; color: var(--text-secondary); margin-top: 2px; overflow-wrap: anywhere; }
      .sp-scope { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
      .sp-sec-new .sp-h { padding-right: 0; }
      .sp-all { margin: 6px 0 0 11px; border: 1px solid var(--border); border-radius: var(--r-md); padding: 4px 12px; font-size: 12px; font-weight: 600; background: var(--bg-input); color: var(--text-primary); cursor: pointer; }
      @media (max-width: 700px) {
        /* 12 px above the row: the tap areas of the heading's "?" and of the chips never overlap */
        .sp-ctl { width: 100%; margin-top: 12px; row-gap: 12px; }
        .sp-modes { flex-wrap: nowrap; height: 36px; overflow: visible; }   /* no scroll box: it would clip the chips' 44 px tap area */
        .sp-modes { flex: 0 0 auto; gap: 0; }
        .sp-modes .gran-btn { flex: 0 0 auto; padding: 0 8px; font-size: 13px; }
        #spikeBranch { flex: 1 1 88px; min-width: 88px; max-width: 200px; width: auto; padding: 0 2px 0 10px; }
        .sp-ml { display: none; }
        .sp-ms { display: inline; }
        .sp-csv { height: 36px; font-size: 14px; margin-left: auto; }
        /* the tap area: 44 px tall around the 32 / 36 px controls (the theme's 44 px floor would draw them 44 px tall) */
        body.ph-on #spikeModes .gran-btn { min-height: 0 !important; min-width: 44px; }
        body.ph-on #spikeModes .gran-btn::after { content: ''; position: absolute; left: 0; right: 0; top: -7px; bottom: -7px; }
        body.ph-on .sp-ctl .sp-csv { min-height: 0 !important; min-width: 44px; }
        body.ph-on .sp-ctl .sp-csv::after { content: ''; position: absolute; left: 0; right: 0; top: -6px; bottom: -6px; }
        body.ph-on #spikeBranch, body.ph-on #spikeBranch:hover, body.ph-on #spikeBranch:focus { height: 44px; min-height: 44px !important; margin: -4px 0; font-size: 14px;
          border: 1px solid transparent !important; border-width: 4px 1px !important; background-clip: padding-box; box-shadow: inset 0 0 0 1px var(--border) !important; border-radius: 12px; }
        body.ph-on #spikeBranch:focus-visible { box-shadow: inset 0 0 0 2px var(--accent) !important; }
        body.ph-on:not(.ph-fit) .sp-all { min-height: 44px; min-width: 44px; font-size: 14px; }
        .sp-custom { justify-content: flex-start; }
        .sp-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        /* the custom pickers: 36 px drawn, 44 px to tap (a transparent border, as the branch select); แสดง: an ::after */
        body.ph-on .sp-custom select, body.ph-on .sp-custom select:hover, body.ph-on .sp-custom select:focus,
        body.ph-on .sp-custom input[type="date"], body.ph-on .sp-custom input[type="date"]:hover, body.ph-on .sp-custom input[type="date"]:focus {
          height: 44px; min-height: 44px !important; margin: -4px 0; font-size: 14px; border: 1px solid transparent !important; border-width: 4px 1px !important;
          background-clip: padding-box; box-shadow: inset 0 0 0 1px var(--border) !important; border-radius: 12px; }
        body.ph-on .sp-custom input[type="date"] { width: 138px; padding: 0 6px; }
        body.ph-on .sp-custom .sp-apply { height: 36px; min-height: 0 !important; font-size: 14px; }
        body.ph-on .sp-sec .sp-fold, body.ph-on .sp-sec .sp-flt { height: 32px; min-height: 0 !important; min-width: 56px; font-size: 13px; }
        body.ph-on .sp-sec .sp-fold::after, body.ph-on .sp-sec .sp-flt::after { content: ''; position: absolute; left: 0; right: 0; top: -6px; bottom: -6px; }
        body.ph-on .sp-sec-new .sp-h { row-gap: 18px; }   /* the "?" and the fold button on two rows: their tap areas never overlap */
        body.ph-on .sp-custom .sp-apply::after { content: ''; position: absolute; left: 0; right: 0; top: -6px; bottom: -6px; }
        .sp-tile-v { font-size: 16px; }
        .sp-tile-s { white-space: normal; overflow: visible; }
        body.ph-on:not(.ph-fit) .sp-tbl .sp-v { font-size: 15px; }
        body.ph-on:not(.ph-fit) .sp-nocost, body.ph-on:not(.ph-fit) .sp-sort, body.ph-on:not(.ph-fit) .sp-cost { font-size: 12px; }
        body.ph-on:not(.ph-fit) .sp-perday, body.ph-on:not(.ph-fit) .sp-sub, body.ph-on:not(.ph-fit) .sp-empty, body.ph-on:not(.ph-fit) .sp-thin, body.ph-on:not(.ph-fit) .sp-br, body.ph-on:not(.ph-fit) .sp-unit,
          body.ph-on:not(.ph-fit) .sp-back-chip { font-size: 12px; }
        .sp-long { display: none; }
        .sp-short { display: inline; }
        body.ph-on:not(.ph-fit) .sp-h { font-size: 14px; }
      }
    </style>

      <h2 class="section-title mb-0">เมนูพุ่งผิดปกติ<span id="spikeRange" class="sp-range" hidden></span> <button type="button" class="ui-q" aria-label="คำอธิบาย" aria-haspopup="dialog" data-help="hlp-dailysales-spike" title="คำอธิบาย">?</button></h2><template id="hlp-dailysales-spike" data-title="เมนูพุ่งผิดปกติ"><p><b>มาตรฐานต่อหัว</b> · เทียบเป็น <b>จานต่อ 100 ลูกค้า</b> ไม่ใช่จำนวนจาน วันที่ลูกค้ามากจึงไม่ถูกนับว่าพุ่ง และวันที่ลูกค้าน้อยไม่ถูกนับว่าตก · เมนูบุฟเฟ่ต์ (B) หารด้วยลูกค้าบุฟเฟ่ต์ของสาขา (ทุก tier) · เมนูอาหารตามสั่งและเมนูอื่นหารด้วยลูกค้าทั้งหมดของสาขา · ถ้าข้อมูลแยก tier ไม่ครอบคลุมช่วงที่เลือก เมนูบุฟเฟ่ต์ใช้ลูกค้าทั้งหมด · สาขาที่ไม่มีจำนวนลูกค้าเทียบเป็นจานต่อวัน · ชี้ที่ตัวเลขเพื่อดูจำนวนลูกค้าที่ใช้หาร</p><p><b>ปกติ</b> · จานต่อ 100 ลูกค้าของวันเดียวกันในสัปดาห์ (จันทร์ถึงอาทิตย์) ในช่วง 3 สัปดาห์ก่อนวันเริ่ม ถ่วงตามจำนวนลูกค้าแต่ละวันของช่วงที่เลือก (วันที่สาขาเปิดขายแต่เมนูไม่ได้ขายนับเป็น 0) · ใช้กับทุกช่วง รวมถึง <b>วัน</b> (เทียบวันเดียวกันของ 3 สัปดาห์ก่อน) · สัปดาห์นี้ = วันจันทร์ถึงวันที่เลือก · เดือนนี้ = วันที่ 1 ถึงวันที่เลือก · กำหนดเองได้ไม่เกิน 92 วัน · ไม่รวมวันที่ยังขายไม่จบ</p><p><b>รวมเป็นรายเมนู</b> · เมื่อเลือกทุกสาขา แต่ละแถวคือหนึ่งเมนู รวมทุกสาขาและทุกรหัสสินค้าที่ชื่อเดียวกัน · <b>สาขาที่ดัน</b> (ใต้ชื่อเมนู) = 3 สาขาที่ต้นทุนเพิ่มมากที่สุด และจำนวนสาขาอื่นที่เพิ่มด้วย · เมื่อเลือกสาขาเดียว แต่ละแถวคือเมนูของสาขานั้น พร้อมจานต่อ 100 ลูกค้า และ tier ที่เพิ่ม · การ์ดนี้ใช้สาขาตามตัวกรองสาขาด้านบน และเลือกสาขาเฉพาะการ์ดนี้ได้จากช่องสาขาของการ์ด</p><p><b>สุทธิ</b> · ต้นทุนเพิ่มของสาขาที่สูงกว่าปกติ หักด้วยต้นทุนที่ลดลงของสาขาที่ต่ำกว่าปกติ · สาขาที่ขายเมนูนี้ในช่วงฐานแต่ไม่ได้ขายในช่วงนี้ นับจานปกติทั้งหมดเป็นส่วนที่ลดลง · <b>+จาน (สุทธิ)</b> = จานของช่วงนี้ − จานปกติ (ตามลูกค้าจริงของช่วงนี้) ของทุกสาขารวมกัน · <b>สูงกว่า</b> = จานของช่วงนี้ ÷ จานปกติ</p><p><b>เกณฑ์</b> · แสดงก่อนเฉพาะเมนูที่ต้นทุนเพิ่มสุทธิตั้งแต่ ฿1,000 หรือตั้งแต่ 0.1% ของต้นทุนอาหารของช่วงนี้ (ผู้ที่ไม่เห็นต้นทุน: จานเพิ่มสุทธิตั้งแต่ 20 จาน) สูงสุด 15 รายการ · <b>ดูทั้งหมด</b> แสดงทุกเมนูที่สูงกว่าปกติ · <b>% ของต้นทุนอาหาร</b> = ต้นทุนเพิ่มสุทธิ ÷ ต้นทุนอาหารของช่วงนี้ · <b>สะสม</b> = ผลรวมต้นทุนเพิ่มสุทธิตั้งแต่แถวแรกถึงแถวนั้น ÷ ต้นทุนเพิ่มสุทธิของทุกเมนูที่สูงกว่าปกติ ใช้ดูว่าอ่านถึงแถวไหนแล้วครอบคลุมส่วนใหญ่</p><p><b>เพิ่มจาก tier</b> · แยกจานตามราคาบุฟเฟ่ต์ของบิล (เช่น ฿789) และ <b>ไม่ใช่บุฟเฟ่ต์</b> (จานที่ขายในบิลที่ไม่ใช่บุฟเฟ่ต์ เทียบกับลูกค้าที่ไม่ใช่บุฟเฟ่ต์) · แต่ละกลุ่มเทียบกับปกติของกลุ่มนั้นเอง แสดงกลุ่มที่เพิ่มขึ้น บรรทัดละหนึ่งกลุ่ม เรียงจากมากไปน้อย สูงสุด 4 กลุ่ม · ตัวแดง = กลุ่มนั้นสูงกว่าปกติของตัวเองตั้งแต่ 1.5 เท่า · ชี้ที่ช่องเพื่อดูทุกกลุ่ม · ผลรวมของกลุ่มอาจต่างจาก +จาน เล็กน้อยเมื่อสัดส่วนลูกค้าแต่ละ tier เปลี่ยนไป · ข้อมูลแยก tier มาจากบิลบุฟเฟ่ต์และปรับหลังการซิงค์ ถ้ายังไม่ถึงวันสุดท้ายของช่วง แสดง <b>ถึง วว ดด</b> และแยกเฉพาะวันที่มีข้อมูล · ถ้าไม่ครอบคลุมช่วงฐาน แสดง —</p><p><b>เมนูเดิม · ดันต้นทุนเพิ่มสุทธิ</b> · เรียงเมนูที่ต้นทุนเพิ่มสุทธิมากกว่า ฿0 จากมากไปน้อย (ผู้ที่ไม่เห็นต้นทุน เรียงตามจานเพิ่มสุทธิ) · เมนูที่ยังไม่มีต้นทุนอยู่ท้ายรายการ · ป้าย <b>พุ่ง ≥1.5×</b> = จานของเมนูนั้น (รวมทุกสาขาที่เลือก) สูงกว่าปกติตั้งแต่ 1.5 เท่าและอย่างน้อย 5 จาน (ชี้ที่ป้ายเพื่อดูจำนวนสาขาที่พุ่ง) · เครื่องหมาย <b>◔</b> หลังตัวเลขสูงกว่า (สาขาเดียว) = ขายในช่วงฐานน้อยกว่า 5 วัน · เมนูเดิมที่ไม่มียอดขายติดต่อกันอย่างน้อย 21 วันแล้วกลับมาขาย อยู่ในส่วนเมนูใหม่พร้อมป้าย <b>กลับมาขาย</b> · แถวรายสาขาคูณเมนู และรายการนับจำนวนจานแบบเดิม (ไม่หารด้วยลูกค้า) อยู่ในไฟล์ CSV</p><p><b>เมนูใหม่</b> · เมนูที่เริ่มขายที่สาขานั้นไม่ถึง 4 สัปดาห์ (28 วัน) นับถึงวันสุดท้ายของช่วง รวมเป็นรายเมนูเช่นเดียวกัน ไม่ใช้เกณฑ์ 1.5 เท่า · ส่วนนี้ซ่อนไว้ตั้งแต่แรก กด <b>แสดง</b> เพื่อเปิด · ขายครบ 4 สัปดาห์แล้วย้ายไปอยู่ในเมนูเดิม</p><p><b>กลับมาขาย</b> · เมนูเดิมที่ไม่มียอดขายที่สาขานั้นติดต่อกันอย่างน้อย 21 วัน (สาขาเปิดขายอย่างน้อย 14 วันในช่วงนั้น) แล้วกลับมาขายอีก แสดงในส่วนเมนูใหม่ นับวันเริ่มขายจากวันที่กลับมาขาย และย้ายกลับไปอยู่ในเมนูเดิมเมื่อครบ 28 วัน</p><p><b>กำหนดเอง · เทียบกับ</b> · เลือก <b>ช่วงนี้</b> เป็นสัปดาห์ (จันทร์ถึงอาทิตย์) หรือ จาก–ถึง แล้วเลือกว่าจะเทียบกับ <b>ปกติ</b> (3 สัปดาห์ก่อน ตามวันในสัปดาห์) <b>สัปดาห์ที่เลือก</b> หรือ <b>ช่วงที่เลือก</b> · เมื่อเลือกช่วงที่ใช้เทียบ คอลัมน์ <b>ช่วงเทียบ</b> คือจานต่อ 100 ลูกค้าของทั้งช่วงนั้น (แยกแต่ละ tier เช่นกัน) <b>สูงกว่า</b> = ช่วงนี้ ÷ ช่วงเทียบ และ <b>+จาน</b> = จานของช่วงนี้ − ช่วงเทียบ × ลูกค้าของช่วงนี้ ÷ 100 · เทียบเป็นต่อหัว สองช่วงจึงยาวไม่เท่ากันได้ · เกณฑ์ขายน้อย (น้อยกว่า 5 วัน) นับในช่วงเทียบ · ช่วงที่ใช้เทียบต้องสิ้นสุดก่อนวันเริ่มต้นของช่วงนี้ ยาวได้ไม่เกิน 92 วัน และไม่รวมวันที่ยังขายไม่จบ</p><p><b>แพ็กเกจบุฟเฟ่ต์</b> · รายการแพ็กเกจบุฟเฟ่ต์ (เช่น บุฟเฟ่ต์ (ผู้ใหญ่) และ บุฟเฟ่ต์ (เด็ก)) เป็นค่าบุฟเฟ่ต์ ไม่ใช่เมนูอาหาร จึงไม่แสดงในทุกส่วน ไม่นับในแถบสรุป และไม่อยู่ในไฟล์ CSV · รายการค่าธรรมเนียม เช่น ค่าปรับบุฟเฟ่ต์ ค่าเปิดห้อง ค่าเปิดเหล้า ค่าบริการ ค่ามัดจำ ค่าเสียหาย และคูปอง ไม่แสดงเช่นกัน</p><p><b>ต้นทุนเมนูใหม่ยังไม่ครบ</b> · ถ้าเมนูใหม่ที่แสดงมากกว่าครึ่งยังไม่มีต้นทุนต่อจาน ส่วนเมนูใหม่ไม่แสดงคอลัมน์ ต้นทุน (ช่วงนี้) และแสดงป้ายจำนวนเมนูที่มีต้นทุนแทน · ต้นทุนรายเมนูยังอยู่ในไฟล์ CSV</p><p><b>แถบสรุป</b> · ลูกค้าช่วงนี้ (เทียบลูกค้าต่อวันของปกติหรือช่วงเทียบ) · <b>เมนูที่ถึงเกณฑ์</b> (เมนูเดิม และเมนูใหม่) · <b>ต้นทุนเพิ่มสุทธิ</b> ของเมนูเดิมทุกเมนู = ต้นทุนที่เพิ่มของเมนูที่สูงกว่าปกติ หักต้นทุนที่ลดลงของเมนูที่ต่ำกว่าปกติ ไม่รวมเมนูใหม่ (สีแดง = เพิ่ม สีเขียว = ลด · สำหรับผู้ที่ไม่เห็นต้นทุน แสดงจานเพิ่มสุทธิ) · tier ที่มีจานเกินรวมมากที่สุด</p></template><template id="hlp-dailysales-spike-new" data-title="เมนูใหม่"><p><b>เมนูใหม่</b> = เมนูที่เริ่มขายที่สาขานั้นไม่ถึง 4 สัปดาห์ (28 วัน) นับถึงวันสุดท้ายของช่วงที่เลือก · ขายครบ 4 สัปดาห์แล้วย้ายไปอยู่ใน <b>เมนูเดิม</b> และใช้เกณฑ์พุ่งผิดปกติ 1.5 เท่า</p><p><b>รวมเป็นรายเมนู</b> · เมื่อเลือกทุกสาขา แต่ละแถวคือหนึ่งเมนู รวมทุกสาขาที่ขาย · ใต้ชื่อเมนูแสดงจำนวนสาขาที่ขาย และ 3 สาขาที่ขายมากที่สุดพร้อมจำนวนจาน · ป้าย <b>กลับมาขาย N สาขา</b> = จำนวนสาขาที่เป็นเมนูเดิมกลับมาขาย · เมื่อเลือกสาขาเดียว ใต้ชื่อเมนูแสดงวันเริ่มขาย และจำนวนวันที่ขายมาแล้ว (นับจากวันเริ่มขายถึงวันสุดท้ายของช่วง รวมทั้งสองวัน)</p><p><b>เกณฑ์</b> · แสดงก่อนเฉพาะเมนูที่ขายตั้งแต่ 20 จานต่อวัน (ทุกสาขารวมกัน) หรือมีต้นทุนในช่วงนี้ตั้งแต่ ฿1,000 สูงสุด 15 รายการ เรียงตามต้นทุนของช่วงนี้ (ผู้ที่ไม่เห็นต้นทุน เรียงตามจำนวนจาน) · <b>ดูทั้งหมด</b> แสดงทุกเมนูใหม่ · ส่วนนี้ซ่อนไว้ตั้งแต่แรก อุปกรณ์นี้จะจำว่าเปิดไว้</p><p><b>กลับมาขาย</b> · เมนูเดิมที่ไม่มียอดขายที่สาขานั้นติดต่อกันอย่างน้อย 21 วัน (สาขาเปิดขายอย่างน้อย 14 วันในช่วงนั้น) แล้วกลับมาขายอีก · <b>เริ่มขาย</b> คือวันที่กลับมาขาย จำนวนจาน ต่อวัน และแนวโน้มนับจากวันนั้น · ย้ายกลับไปอยู่ในเมนูเดิมเมื่อครบ 28 วันนับจากวันที่กลับมาขาย · ชี้ที่ป้ายเพื่อดูวันที่ขายครั้งแรก</p><p><b>จาน/วัน</b> · จำนวนจานในช่วง หารด้วยจำนวนวันที่สาขาเปิดขาย นับตั้งแต่วันเริ่มของช่วงหรือวันเริ่มขาย (วันที่ช้ากว่า) แล้วรวมทุกสาขา · <b>ต่อ 100 ลูกค้า</b> · จำนวนจาน หารด้วยลูกค้าของวันเหล่านั้น × 100 (เมนูบุฟเฟ่ต์ใช้ลูกค้าบุฟเฟ่ต์ เมนูอื่นใช้ลูกค้าทั้งหมด)</p><p><b>แนวโน้ม</b> · จานต่อวันใน 7 วันล่าสุด เทียบ 7 วันแรกที่เริ่มขาย รวมทุกสาขาที่ขายมาแล้วอย่างน้อย 14 วัน ▲ สูงขึ้น ▼ ลดลง</p><p>ข้อมูลรายวันเริ่มวันที่ 22 มี.ค. 2569 เมนูที่ขายก่อนวันนั้นจะแสดงวันเริ่มขายเป็น 22 มี.ค. 2569 ซึ่งเป็นเมนูเดิมทั้งหมด</p></template>
