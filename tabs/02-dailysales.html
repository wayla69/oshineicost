    <style>
      /* PR-SP · menu spike period chips: one track like the page's วัน / สัปดาห์ / เดือน, a neutral chip for the resolved range */
      .sp-modes { display: inline-flex; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--r-md); padding: 3px; gap: 2px; max-width: 100%; }
      .sp-range { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-secondary); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; vertical-align: middle; }
      .sp-sub { color: var(--text-muted); font-size: 12px; margin: 0 0 8px; }
      .sp-custom { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px; color: var(--text-secondary); }
      .sp-custom[hidden] { display: none; }
      .sp-custom input { border: 1px solid var(--border); border-radius: var(--r-md); padding: 4px 8px; font-size: 12px; background: var(--bg-input); color: var(--text-primary); }
      .sp-apply { border: 1px solid var(--accent); border-radius: var(--r-md); padding: 4px 12px; font-size: 12px; font-weight: 600; background: var(--accent); color: var(--on-accent, #fff); cursor: pointer; }
      .sp-perday { font-size: 11px; font-weight: 400; color: var(--text-muted); }
      /* PR-SN · two parts: existing menus that spiked (bad ink = above normal), new menus (sky ink = still in their first 4 weeks) */
      .sp-sec { margin: 0 0 14px; }
      .sp-sec:last-child { margin-bottom: 0; }
      .sp-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; padding: 2px 0 2px 8px; border-left: 3px solid var(--bad-ink); font-size: 13px; font-weight: 700; color: var(--text-primary); }
      .sp-sec-new .sp-h { border-left-color: var(--sky-ink); }
      .sp-n { font-weight: 600; color: var(--text-secondary); }
      .sp-short { display: none; }
      .sp-thin { font-size: 11px; font-weight: 400; color: var(--text-muted); white-space: nowrap; }
      .sp-empty { font-size: 12px; color: var(--text-muted); padding: 4px 0 4px 11px; margin: 0; }
      .sp-box { max-height: 380px; overflow: auto; }
      /* PR-ST · per head + the tiers behind the increase: a grey branch line under the menu (ทุกสาขา), tier chips (bad ink = that tier
         itself >= 1.5x its own normal), the unit in the header kept small */
      .sp-br { font-size: 11px; font-weight: 400; color: var(--text-muted); }
      .sp-unit { font-weight: 400; font-size: 11px; white-space: nowrap; }
      .sp-tr { display: inline-block; white-space: nowrap; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-secondary); font-weight: 600; line-height: 18px; }
      .sp-tr-hi { color: var(--bad-ink); border-color: currentColor; font-weight: 700; }
      .sp-tr-sep { color: var(--text-muted); }
      .sp-tr-more { color: var(--text-muted); padding-left: 2px; }
      /* PR-SC · ต้นทุนเพิ่ม (cost roles only): the header chip sums the first 15 rows (bad ink = extra cost above ฿0); a row without a cost is a
         grey note and sits last; "ดูทั้งหมด (N)" opens the rest */
      .sp-sub [hidden] { display: none !important; }
      .sp-cost { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-secondary); font-size: 12px; font-weight: 600; }
      .sp-cost b { color: var(--text-primary); font-weight: 800; }
      .sp-cost.sp-cost-bad { border-color: var(--bad-ink); }
      .sp-cost.sp-cost-bad b { color: var(--bad-ink); }
      .sp-box.sp-box-top { max-height: none; overflow: visible; }   /* the first 15 rows: no scroll box, the whole list at a glance */
      .sp-nocost { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
      .sp-sort { font-size: 11px; font-weight: 400; color: var(--text-muted); }
      .sp-all { margin: 6px 0 0 11px; border: 1px solid var(--border); border-radius: var(--r-md); padding: 4px 12px; font-size: 12px; font-weight: 600; background: var(--bg-input); color: var(--text-primary); cursor: pointer; }
      @media (max-width: 700px) {
        .sp-ctl { width: 100%; }
        .sp-modes { display: flex; flex-wrap: nowrap; overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .sp-modes::-webkit-scrollbar { display: none; }
        .sp-modes .gran-btn { flex: 0 0 auto; }
        body.ph-on:not(.ph-fit) .sp-modes .gran-btn, body.ph-on:not(.ph-fit) #spikeBranch, body.ph-on:not(.ph-fit) .sp-custom input,
        body.ph-on:not(.ph-fit) .sp-apply, body.ph-on:not(.ph-fit) .sp-csv, body.ph-on:not(.ph-fit) .sp-all { min-height: 44px; min-width: 44px; font-size: 14px; }
        body.ph-on:not(.ph-fit) .sp-nocost, body.ph-on:not(.ph-fit) .sp-sort, body.ph-on:not(.ph-fit) .sp-cost { font-size: 12px; }
        body.ph-on:not(.ph-fit) .sp-perday, body.ph-on:not(.ph-fit) .sp-sub, body.ph-on:not(.ph-fit) .sp-empty, body.ph-on:not(.ph-fit) .sp-thin, body.ph-on:not(.ph-fit) .sp-br, body.ph-on:not(.ph-fit) .sp-unit { font-size: 12px; }
        .sp-long { display: none; }
        .sp-short { display: inline; }
        body.ph-on:not(.ph-fit) .sp-h { font-size: 14px; }
      }
    </style>
    <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
      <h2 class="section-title mb-0">เมนูพุ่งผิดปกติ<span id="spikeRange" class="sp-range" hidden></span> <button type="button" class="ui-q" aria-label="คำอธิบาย" aria-haspopup="dialog" data-help="hlp-dailysales-spike" title="คำอธิบาย">?</button></h2><template id="hlp-dailysales-spike" data-title="เมนูพุ่งผิดปกติ"><p><b>มาตรฐานต่อหัว</b> · เทียบเป็น <b>จานต่อ 100 ลูกค้า</b> ไม่ใช่จำนวนจาน วันที่ลูกค้ามากจึงไม่ถูกนับว่าพุ่ง และวันที่ลูกค้าน้อยไม่ถูกนับว่าตก · เมนูบุฟเฟ่ต์ (B) หารด้วยลูกค้าบุฟเฟ่ต์ของสาขา (ทุก tier) · เมนูอาหารตามสั่งและเมนูอื่นหารด้วยลูกค้าทั้งหมดของสาขา · ถ้าข้อมูลแยก tier ไม่ครอบคลุมช่วงที่เลือก เมนูบุฟเฟ่ต์ใช้ลูกค้าทั้งหมด · สาขาที่ไม่มีจำนวนลูกค้าเทียบเป็นจานต่อวัน · ชี้ที่ตัวเลขเพื่อดูจำนวนลูกค้าที่ใช้หาร</p><p><b>ปกติ</b> · จานต่อ 100 ลูกค้าของวันเดียวกันในสัปดาห์ (จันทร์ถึงอาทิตย์) ในช่วง 3 สัปดาห์ก่อนวันเริ่ม ถ่วงตามจำนวนลูกค้าแต่ละวันของช่วงที่เลือก (วันที่สาขาเปิดขายแต่เมนูไม่ได้ขายนับเป็น 0) · ใช้กับทุกช่วง รวมถึง <b>วัน</b> (เทียบวันเดียวกันของ 3 สัปดาห์ก่อน) · สัปดาห์นี้ = วันจันทร์ถึงวันที่เลือก · เดือนนี้ = วันที่ 1 ถึงวันที่เลือก · กำหนดเองได้ไม่เกิน 92 วัน · ไม่รวมวันที่ยังขายไม่จบ</p><p><b>สูงกว่า</b> · จานต่อ 100 ลูกค้าของช่วงนี้ ÷ ปกติ · <b>+จาน</b> (ใต้ตัวเลขช่วงนี้) = จำนวนจานที่เกินจากปกติเมื่อคิดตามลูกค้าจริงของช่วงนี้ เรียงจากมากไปน้อย (ถ้าแสดงคอลัมน์ ต้นทุนเพิ่ม เรียงตามต้นทุนเพิ่ม) · แสดง 15 รายการแรก ส่วนที่เหลือดูได้ที่ <b>ดูทั้งหมด</b></p><p><b>เพิ่มจาก tier</b> · แยกจานตามราคาบุฟเฟ่ต์ของบิล (เช่น ฿789) และ <b>ไม่ใช่บุฟเฟ่ต์</b> (จานที่ขายในบิลที่ไม่ใช่บุฟเฟ่ต์ เทียบกับลูกค้าที่ไม่ใช่บุฟเฟ่ต์) · แต่ละกลุ่มเทียบกับปกติของกลุ่มนั้นเอง แสดงกลุ่มที่เพิ่มขึ้น เรียงจากมากไปน้อย สูงสุด 3 กลุ่ม · ตัวแดง = กลุ่มนั้นสูงกว่าปกติของตัวเองตั้งแต่ 1.5 เท่า · ชี้ที่ช่องเพื่อดูทุกกลุ่ม · ผลรวมของกลุ่มอาจต่างจาก +จาน เล็กน้อยเมื่อสัดส่วนลูกค้าแต่ละ tier เปลี่ยนไป · ข้อมูลแยก tier มาจากบิลบุฟเฟ่ต์และปรับหลังการซิงค์ ถ้ายังไม่ถึงวันสุดท้ายของช่วง แสดง <b>ถึง วว ดด</b> และแยกเฉพาะวันที่มีข้อมูล · ถ้าไม่ครอบคลุมช่วงฐาน แสดง —</p><p><b>เมนูเดิม · พุ่งผิดปกติ</b> · เมนูที่สูงกว่าปกติตั้งแต่ 1.5 เท่า ขายอย่างน้อย 5 จาน และขายในช่วงฐานอย่างน้อย 5 วัน · เมนูเดิมที่ขายในช่วงฐานน้อยกว่า 5 วัน แสดงเมื่อขายอย่างน้อย 20 จาน และสูงกว่าปกติตั้งแต่ 1.5 เท่า (หรือไม่มียอดในช่วงฐาน) พร้อมหมายเหตุ <b>ขายน้อยช่วงก่อน</b></p><p><b>เมนูใหม่</b> · เมนูที่เริ่มขายที่สาขานั้นไม่ถึง 4 สัปดาห์ (28 วัน) นับถึงวันสุดท้ายของช่วง แสดงแยกทุกรายการที่ขายได้ ไม่ใช้เกณฑ์ 1.5 เท่า · ขายครบ 4 สัปดาห์แล้วย้ายไปอยู่ในเมนูเดิม</p></template><template id="hlp-dailysales-spike-new" data-title="เมนูใหม่"><p><b>เมนูใหม่</b> = เมนูที่เริ่มขายที่สาขานั้นไม่ถึง 4 สัปดาห์ (28 วัน) นับถึงวันสุดท้ายของช่วงที่เลือก · ขายครบ 4 สัปดาห์แล้วย้ายไปอยู่ใน <b>เมนูเดิม</b> และใช้เกณฑ์พุ่งผิดปกติ 1.5 เท่า</p><p><b>เริ่มขาย</b> · วันแรกที่สาขาขายเมนูนี้ · <b>ขายมาแล้ว</b> · จำนวนวันนับจากวันเริ่มขายถึงวันสุดท้ายของช่วง (รวมทั้งสองวัน)</p><p><b>ต่อวัน</b> · จำนวนจานในช่วง หารด้วยจำนวนวันที่สาขาเปิดขาย นับตั้งแต่วันเริ่มของช่วงหรือวันเริ่มขาย (วันที่ช้ากว่า) · <b>ต่อ 100 ลูกค้า</b> · จำนวนจานเดียวกัน หารด้วยลูกค้าของวันเหล่านั้น × 100 (เมนูบุฟเฟ่ต์ใช้ลูกค้าบุฟเฟ่ต์ เมนูอื่นใช้ลูกค้าทั้งหมด)</p><p><b>แนวโน้ม</b> · จานต่อ 100 ลูกค้าใน 7 วันล่าสุด เทียบ 7 วันแรกที่เริ่มขาย ▲ สูงขึ้น ▼ ลดลง · แสดงเมื่อขายมาแล้วอย่างน้อย 14 วัน · สาขาที่ไม่มีจำนวนลูกค้าเทียบเป็นจานต่อวัน</p><p>ข้อมูลรายวันเริ่มวันที่ 22 มี.ค. 2569 เมนูที่ขายก่อนวันนั้นจะแสดงวันเริ่มขายเป็น 22 มี.ค. 2569 ซึ่งเป็นเมนูเดิมทั้งหมด</p></template>

    <p class="sp-sub">สูงกว่าปกติ ≥1.5×<span id="spikeCost" class="sp-cost" hidden></span> <button type="button" id="spikeCostQ" class="ui-q" aria-label="คำอธิบาย ต้นทุนเพิ่ม" aria-haspopup="dialog" data-help="hlp-dailysales-spike-cost" title="คำอธิบาย" hidden>?</button></p><template id="hlp-dailysales-spike-cost" data-title="ต้นทุนเพิ่ม"><p><b>ต้นทุนเพิ่ม</b> · จานที่เกินจากปกติ (<b>+จาน</b> = จานของช่วงนี้ − ปกติต่อ 100 ลูกค้า × ลูกค้าของช่วงนี้ ÷ 100) × ต้นทุนต่อจานของเดือนนั้น · ช่วงที่คร่อมสองเดือนถ่วงตามจำนวนจานที่ขายในแต่ละเดือน · เรียงจากมากไปน้อย แสดง 15 รายการแรก ส่วนที่เหลือดูได้ที่ <b>ดูทั้งหมด</b></p><p><b>ต้นทุนต่อจาน</b> · ตัวเดียวกับที่ใช้คิดต้นทุนอาหารและกำไรขั้นต้น · ตั้งแต่เดือน ก.ย. 2569 ใช้รายการต้นทุนอาหารรายเดือนที่ฝ่ายวิเคราะห์นำเข้า เมนูที่ไม่มีในรายการใช้ต้นทุนตามสูตร · แพ็กเกจบุฟเฟ่ต์ (เช่น BUFFET799) ไม่คิดต้นทุน เพราะต้นทุนอยู่ที่จานที่ลูกค้าสั่ง</p><p><b>% ของต้นทุนอาหาร</b> · ต้นทุนเพิ่ม ÷ ต้นทุนอาหารทั้งหมดของสาขาที่เลือกในช่วงเดียวกัน × 100 · <b>จุด</b> · ต้นทุนเพิ่ม ÷ ยอดขายสุทธิ (ไม่รวม VAT และค่าบริการ) × 100 คือต้นทุนอาหาร % ที่สูงขึ้นจากเมนูนั้น</p><p><b>ต้นทุนเพิ่มรวม</b> · ผลรวมของ 15 รายการแรก · เมนูที่ <b>ยังไม่มีต้นทุน</b> ไม่นับรวม และอยู่ท้ายรายการ</p></template>
