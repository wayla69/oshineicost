<!-- ══════════════════════════════════════════════════════════════════════════
     TAB: GUEST & SPH
══════════════════════════════════════════════════════════════════════════ -->
<div id="tab-dailysales" style="display:none">
  <div class="card p-3 mb-4 flex flex-wrap items-center gap-3" style="background:var(--bg-subtle)">
    <span class="text-xs font-semibold" style="color:var(--text-secondary)">วันที่:</span>
    <input type="date" id="dsDate" onchange="loadDailySales(true)" style="border:1px solid var(--border);border-radius:var(--r-md);padding:5px 8px;font-size:12.5px;background:var(--bg-input);color:var(--text-primary)">
    <div id="dsPeriod"></div>
    <span id="dsRange" class="prow-span"></span>
  </div>
  <div id="dsKpis" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4"></div>
  <div id="dsAnomaly" class="mb-4"></div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-5">
    <div class="card p-5 lg:col-span-2 overflow-x-auto">
      <h2 class="section-title mb-3">ยอดขายรายสาขา <span id="dsCmpNote" class="font-normal normal-case"></span></h2>
      <table class="text-xs w-full">
        <thead><tr class="text-left border-b border-slate-200" style="color:var(--text-muted)">
          <th class="py-1.5 pr-2">สาขา</th><th class="py-1.5 pr-2 text-right">ยอดขาย</th>
          <th class="py-1.5 pr-2 text-right">ลูกค้า</th><th class="py-1.5 pr-2 text-right">ยอด/หัว</th>
          <th class="py-1.5 pr-2 text-right" id="dsThPrev">เทียบช่วงก่อน</th><th class="py-1.5 text-right" id="dsThLy">เทียบปีก่อน</th>
        </tr></thead><tbody id="dsBody"></tbody></table>
    </div>
    <div class="card p-5">
      <h2 class="section-title mb-3">แนวโน้มยอดรวม (8 ช่วงล่าสุด)</h2>
      <div style="height:300px"><canvas id="dsTrend"></canvas></div>
    </div>
  </div>
  <div class="card p-5 mb-5" data-needs="/api/sales/menu-spike">
    <style>
      /* PR-SP · menu spike period chips: one track like the page's วัน / สัปดาห์ / เดือน, a neutral chip for the resolved range */
      .sp-modes { display: inline-flex; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--r-md); padding: 3px; gap: 2px; max-width: 100%; }
      .sp-range { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-secondary); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; vertical-align: middle; }
      .sp-sub { color: var(--text-muted); font-size: 12px; margin: 0 0 8px; }
      .sp-custom { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 12px; color: var(--text-secondary); }
      .sp-custom[hidden] { display: none; }
      .sp-custom input { border: 1px solid var(--border); border-radius: var(--r-md); padding: 4px 8px; font-size: 12px; background: var(--bg-input); color: var(--text-primary); }
      .sp-apply { border: 1px solid var(--accent); border-radius: var(--r-md); padding: 4px 12px; font-size: 12px; font-weight: 600; background: var(--accent); color: var(--on-accent, #fff); cursor: pointer; }
      .sp-perday { font-size: 11px; font-weight: 400; color: var(--text-muted); }
      /* PR-SN · two parts: existing menus that spiked (bad ink = above normal), new menus (sky ink = still in their first 4 weeks) */
      .sp-sec { margin: 0 0 14px; }
      .sp-sec:last-child { margin-bottom: 0; }
      .sp-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; padding: 2px 0 2px 8px; border-left: 3px solid var(--bad-ink); font-size: 13px; font-weight: 700; color: var(--text-primary); }
      .sp-sec-new .sp-h { border-left-color: var(--sky-ink); }
      .sp-n { font-weight: 600; color: var(--text-secondary); }
      .sp-short { display: none; }
      .sp-thin { font-size: 11px; font-weight: 400; color: var(--text-muted); white-space: nowrap; }
      .sp-empty { font-size: 12px; color: var(--text-muted); padding: 4px 0 4px 11px; margin: 0; }
      .sp-box { max-height: 380px; overflow: auto; }
      @media (max-width: 700px) {
        .sp-ctl { width: 100%; }
        .sp-modes { display: flex; flex-wrap: nowrap; overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .sp-modes::-webkit-scrollbar { display: none; }
        .sp-modes .gran-btn { flex: 0 0 auto; }
        body.ph-on:not(.ph-fit) .sp-modes .gran-btn, body.ph-on:not(.ph-fit) #spikeBranch, body.ph-on:not(.ph-fit) .sp-custom input,
        body.ph-on:not(.ph-fit) .sp-apply, body.ph-on:not(.ph-fit) .sp-csv { min-height: 44px; min-width: 44px; font-size: 14px; }
        body.ph-on:not(.ph-fit) .sp-perday, body.ph-on:not(.ph-fit) .sp-sub, body.ph-on:not(.ph-fit) .sp-empty, body.ph-on:not(.ph-fit) .sp-thin { font-size: 12px; }
        .sp-long { display: none; }
        .sp-short { display: inline; }
        body.ph-on:not(.ph-fit) .sp-h { font-size: 14px; }
      }
    </style>
    <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
      <h2 class="section-title mb-0">เมนูพุ่งผิดปกติ<span id="spikeRange" class="sp-range" hidden></span> <button type="button" class="ui-q" aria-label="คำอธิบาย" aria-haspopup="dialog" data-help="hlp-dailysales-spike" title="คำอธิบาย">?</button></h2><template id="hlp-dailysales-spike" data-title="เมนูพุ่งผิดปกติ"><p><b>วัน</b> · จำนวนจานของวันที่เลือก เทียบค่าเฉลี่ยต่อวันใน 21 วันก่อนหน้า (นับเฉพาะวันที่เมนูนั้นขายได้)</p><p><b>สัปดาห์นี้ · เดือนนี้ · กำหนดเอง</b> · จำนวนจานรวมของช่วง เทียบ <b>ปกติ</b> = ยอดเฉลี่ยของวันเดียวกันในสัปดาห์ (จันทร์ถึงอาทิตย์) ในช่วง 3 สัปดาห์ก่อนวันเริ่ม รวมตามวันที่สาขาเปิดขายในช่วง · สัปดาห์นี้ = วันจันทร์ถึงวันที่เลือก · เดือนนี้ = วันที่ 1 ถึงวันที่เลือก · กำหนดเองได้ไม่เกิน 92 วัน</p><p><b>เมนูเดิม · พุ่งผิดปกติ</b> · เมนูที่สูงกว่าปกติตั้งแต่ 1.5 เท่า ขายอย่างน้อย 5 จาน และขายในช่วงฐานอย่างน้อย 5 วัน · เมนูเดิมที่ขายในช่วงฐานน้อยกว่า 5 วัน แสดงเมื่อขายอย่างน้อย 20 จาน และสูงกว่าปกติตั้งแต่ 1.5 เท่า (หรือไม่มียอดในช่วงฐาน) พร้อมหมายเหตุ <b>ขายน้อยช่วงก่อน</b> โดยปกติคิดจากทุกวันที่สาขาเปิดขาย (วันที่ไม่ได้ขายนับเป็น 0) · ไม่รวมวันที่ยังขายไม่จบ</p><p><b>เมนูใหม่</b> · เมนูที่เริ่มขายที่สาขานั้นไม่ถึง 4 สัปดาห์ (28 วัน) นับถึงวันสุดท้ายของช่วง แสดงแยกทุกรายการที่ขายได้ ไม่ใช้เกณฑ์ 1.5 เท่า · ขายครบ 4 สัปดาห์แล้วย้ายไปอยู่ในเมนูเดิม</p></template><template id="hlp-dailysales-spike-new" data-title="เมนูใหม่"><p><b>เมนูใหม่</b> = เมนูที่เริ่มขายที่สาขานั้นไม่ถึง 4 สัปดาห์ (28 วัน) นับถึงวันสุดท้ายของช่วงที่เลือก · ขายครบ 4 สัปดาห์แล้วย้ายไปอยู่ใน <b>เมนูเดิม</b> และใช้เกณฑ์พุ่งผิดปกติ 1.5 เท่า</p><p><b>เริ่มขาย</b> · วันแรกที่สาขาขายเมนูนี้ · <b>ขายมาแล้ว</b> · จำนวนวันนับจากวันเริ่มขายถึงวันสุดท้ายของช่วง (รวมทั้งสองวัน)</p><p><b>ต่อวัน</b> · จำนวนจานในช่วง หารด้วยจำนวนวันที่สาขาเปิดขาย นับตั้งแต่วันเริ่มของช่วงหรือวันเริ่มขาย (วันที่ช้ากว่า)</p><p><b>แนวโน้ม</b> · จานต่อวันใน 7 วันล่าสุด เทียบ 7 วันแรกที่เริ่มขาย ▲ สูงขึ้น ▼ ลดลง · แสดงเมื่อขายมาแล้วอย่างน้อย 14 วัน</p><p>ข้อมูลรายวันเริ่มวันที่ 22 มี.ค. 2569 เมนูที่ขายก่อนวันนั้นจะแสดงวันเริ่มขายเป็น 22 มี.ค. 2569 ซึ่งเป็นเมนูเดิมทั้งหมด</p></template>
      <div class="sp-ctl flex items-center gap-2 flex-wrap">
        <div id="spikeModes" class="sp-modes" role="group" aria-label="ช่วงเวลา">
          <button type="button" class="gran-btn gran-active" data-m="day" aria-pressed="true" onclick="spikeSetMode('day')">วัน</button>
          <button type="button" class="gran-btn" data-m="week" aria-pressed="false" onclick="spikeSetMode('week')">สัปดาห์นี้</button>
          <button type="button" class="gran-btn" data-m="mtd" aria-pressed="false" onclick="spikeSetMode('mtd')">เดือนนี้</button>
          <button type="button" class="gran-btn" data-m="range" aria-pressed="false" onclick="spikeSetMode('range')">กำหนดเอง</button>
        </div>
        <select id="spikeBranch" aria-label="สาขา" onchange="renderMenuSpike()" style="border:1px solid var(--border);border-radius:var(--r-md);padding:4px 8px;font-size:12px;background:var(--bg-input);color:var(--text-primary)"><option value="">ทุกสาขา</option></select>
        <span id="spikeCount" class="text-[11px]" style="color:var(--text-muted)"></span>
        <button type="button" onclick="spikeExport()" class="sp-csv text-xs border border-slate-200 rounded px-2 py-0.5" style="color:var(--text-secondary)">CSV</button>
      </div>
    </div>
    <p class="sp-sub">สูงกว่าปกติ ≥1.5×</p>
    <div id="spikeCustom" class="sp-custom" hidden>
      <label for="spikeFrom">จาก</label><input type="date" id="spikeFrom">
      <label for="spikeTo">ถึง</label><input type="date" id="spikeTo">
      <button type="button" class="sp-apply" onclick="spikeApplyRange()">แสดง</button>
    </div>
    <div id="dsSpike"></div>
  </div>
</div>
