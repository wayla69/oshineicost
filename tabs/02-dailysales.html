      <h2 class="section-title mb-0">เมนูพุ่งผิดปกติ<span id="spikeRange" class="sp-range" hidden></span> <button type="button" class="ui-q" aria-label="คำอธิบาย" aria-haspopup="dialog" data-help="hlp-dailysales-spike" title="คำอธิบาย">?</button></h2><template id="hlp-dailysales-spike" data-title="เมนูพุ่งผิดปกติ"><p><b>มาตรฐานต่อหัว</b> · เทียบเป็น <b>จานต่อ 100 ลูกค้า</b> ไม่ใช่จำนวนจาน วันที่ลูกค้ามากจึงไม่ถูกนับว่าพุ่ง และวันที่ลูกค้าน้อยไม่ถูกนับว่าตก · เมนูบุฟเฟ่ต์ (B) หารด้วยลูกค้าบุฟเฟ่ต์ของสาขา (ทุก tier) · เมนูอาหารตามสั่งและเมนูอื่นหารด้วยลูกค้าทั้งหมดของสาขา · ถ้าข้อมูลแยก tier ไม่ครอบคลุมช่วงที่เลือก เมนูบุฟเฟ่ต์ใช้ลูกค้าทั้งหมด · สาขาที่ไม่มีจำนวนลูกค้าเทียบเป็นจานต่อวัน · ชี้ที่ตัวเลขเพื่อดูจำนวนลูกค้าที่ใช้หาร</p><p><b>ปกติ</b> · จานต่อ 100 ลูกค้าของวันเดียวกันในสัปดาห์ (จันทร์ถึงอาทิตย์) ในช่วง 3 สัปดาห์ก่อนวันเริ่ม ถ่วงตามจำนวนลูกค้าแต่ละวันของช่วงที่เลือก (วันที่สาขาเปิดขายแต่เมนูไม่ได้ขายนับเป็น 0) · ใช้กับทุกช่วง รวมถึง <b>วัน</b> (เทียบวันเดียวกันของ 3 สัปดาห์ก่อน) · สัปดาห์นี้ = วันจันทร์ถึงวันที่เลือก · เดือนนี้ = วันที่ 1 ถึงวันที่เลือก · กำหนดเองได้ไม่เกิน 92 วัน · ไม่รวมวันที่ยังขายไม่จบ</p><p><b>สูงกว่า</b> · จานต่อ 100 ลูกค้าของช่วงนี้ ÷ ปกติ · <b>+จาน</b> (ใต้ตัวเลขช่วงนี้) = จำนวนจานที่เกินจากปกติเมื่อคิดตามลูกค้าจริงของช่วงนี้ เรียงจากมากไปน้อย (ถ้าแสดงคอลัมน์ ต้นทุนเพิ่ม เรียงตามต้นทุนเพิ่ม) · แสดง 15 รายการแรก ส่วนที่เหลือดูได้ที่ <b>ดูทั้งหมด</b></p><p><b>เพิ่มจาก tier</b> · แยกจานตามราคาบุฟเฟ่ต์ของบิล (เช่น ฿789) และ <b>ไม่ใช่บุฟเฟ่ต์</b> (จานที่ขายในบิลที่ไม่ใช่บุฟเฟ่ต์ เทียบกับลูกค้าที่ไม่ใช่บุฟเฟ่ต์) · แต่ละกลุ่มเทียบกับปกติของกลุ่มนั้นเอง แสดงกลุ่มที่เพิ่มขึ้น บรรทัดละหนึ่งกลุ่ม เรียงจากมากไปน้อย สูงสุด 4 กลุ่ม · ตัวแดง = กลุ่มนั้นสูงกว่าปกติของตัวเองตั้งแต่ 1.5 เท่า · ชี้ที่ช่องเพื่อดูทุกกลุ่ม · ผลรวมของกลุ่มอาจต่างจาก +จาน เล็กน้อยเมื่อสัดส่วนลูกค้าแต่ละ tier เปลี่ยนไป · ข้อมูลแยก tier มาจากบิลบุฟเฟ่ต์และปรับหลังการซิงค์ ถ้ายังไม่ถึงวันสุดท้ายของช่วง แสดง <b>ถึง วว ดด</b> และแยกเฉพาะวันที่มีข้อมูล · ถ้าไม่ครอบคลุมช่วงฐาน แสดง —</p><p><b>เมนูเดิม · พุ่งผิดปกติ</b> · เมนูที่สูงกว่าปกติตั้งแต่ 1.5 เท่า ขายอย่างน้อย 5 จาน และขายในช่วงฐานอย่างน้อย 5 วัน · เมนูเดิมที่ขายในช่วงฐานน้อยกว่า 5 วัน แสดงเมื่อขายอย่างน้อย 20 จาน และสูงกว่าปกติตั้งแต่ 1.5 เท่า (หรือไม่มียอดในช่วงฐาน) พร้อมหมายเหตุ <b>ขายน้อยช่วงก่อน</b> · เมนูเดิมที่ไม่มียอดขายติดต่อกันอย่างน้อย 21 วันแล้วกลับมาขาย แสดงในส่วนเมนูใหม่พร้อมป้าย <b>กลับมาขาย</b></p><p><b>เมนูใหม่</b> · เมนูที่เริ่มขายที่สาขานั้นไม่ถึง 4 สัปดาห์ (28 วัน) นับถึงวันสุดท้ายของช่วง แสดงแยกทุกรายการที่ขายได้ ไม่ใช้เกณฑ์ 1.5 เท่า · ขายครบ 4 สัปดาห์แล้วย้ายไปอยู่ในเมนูเดิม</p><p><b>กลับมาขาย</b> · เมนูเดิมที่ไม่มียอดขายที่สาขานั้นติดต่อกันอย่างน้อย 21 วัน (สาขาเปิดขายอย่างน้อย 14 วันในช่วงนั้น) แล้วกลับมาขายอีก แสดงในส่วนเมนูใหม่ นับวันเริ่มขายจากวันที่กลับมาขาย และย้ายกลับไปอยู่ในเมนูเดิมเมื่อครบ 28 วัน</p><p><b>กำหนดเอง · เทียบกับ</b> · เลือก <b>ช่วงนี้</b> เป็นสัปดาห์ (จันทร์ถึงอาทิตย์) หรือ จาก–ถึง แล้วเลือกว่าจะเทียบกับ <b>ปกติ</b> (3 สัปดาห์ก่อน ตามวันในสัปดาห์) <b>สัปดาห์ที่เลือก</b> หรือ <b>ช่วงที่เลือก</b> · เมื่อเลือกช่วงที่ใช้เทียบ คอลัมน์ <b>ช่วงเทียบ</b> คือจานต่อ 100 ลูกค้าของทั้งช่วงนั้น (แยกแต่ละ tier เช่นกัน) <b>สูงกว่า</b> = ช่วงนี้ ÷ ช่วงเทียบ และ <b>+จาน</b> = จานของช่วงนี้ − ช่วงเทียบ × ลูกค้าของช่วงนี้ ÷ 100 · เทียบเป็นต่อหัว สองช่วงจึงยาวไม่เท่ากันได้ · เกณฑ์ขายน้อย (น้อยกว่า 5 วัน) นับในช่วงเทียบ · ช่วงที่ใช้เทียบต้องสิ้นสุดก่อนวันเริ่มต้นของช่วงนี้ ยาวได้ไม่เกิน 92 วัน และไม่รวมวันที่ยังขายไม่จบ</p><p><b>แถบสรุป</b> · ลูกค้าช่วงนี้ (เทียบลูกค้าต่อวันของปกติหรือช่วงเทียบ) · จำนวนเมนูพุ่ง · ต้นทุนเพิ่มรวมของ 15 รายการแรก (สำหรับผู้ที่ไม่เห็นต้นทุน แสดงจานเกินรวม) · tier ที่มีจานเกินรวมมากที่สุดในรายการที่แสดง</p></template><template id="hlp-dailysales-spike-plates" data-title="เมนูพุ่ง · นับจำนวนจาน (แบบเดิม)"><p><b>แบบเดิม</b> · นับจำนวนจานตรง ๆ ไม่หารด้วยจำนวนลูกค้า · เทียบจานของช่วงนี้กับจานปกติของวันเดียวกันในสัปดาห์ในช่วง 3 สัปดาห์ก่อน (หรือจานต่อวันที่สาขาเปิดขายของช่วงที่ใช้เทียบ เมื่อเลือกเทียบกับช่วงอื่น) · แสดงเมื่อสูงกว่าตั้งแต่ 1.5 เท่าและอย่างน้อย 5 จาน · เฉพาะเมนูเดิม ไม่รวมเมนูใหม่และเมนูที่กลับมาขาย · เรียงตาม <b>+จาน</b></p><p>วันที่ลูกค้ามากจะมีเมนูพุ่งในส่วนนี้มากขึ้นตามจำนวนลูกค้า ส่วน <b>เมนูเดิม · พุ่งผิดปกติ</b> ด้านบนเทียบเป็นจานต่อ 100 ลูกค้า และเป็นมาตรฐานที่ใช้ตัดสิน</p></template><template id="hlp-dailysales-spike-new" data-title="เมนูใหม่"><p><b>เมนูใหม่</b> = เมนูที่เริ่มขายที่สาขานั้นไม่ถึง 4 สัปดาห์ (28 วัน) นับถึงวันสุดท้ายของช่วงที่เลือก · ขายครบ 4 สัปดาห์แล้วย้ายไปอยู่ใน <b>เมนูเดิม</b> และใช้เกณฑ์พุ่งผิดปกติ 1.5 เท่า</p><p><b>เริ่มขาย</b> · วันแรกที่สาขาขายเมนูนี้ · <b>ขายมาแล้ว</b> · จำนวนวันนับจากวันเริ่มขายถึงวันสุดท้ายของช่วง (รวมทั้งสองวัน)</p><p><b>กลับมาขาย</b> · เมนูเดิมที่ไม่มียอดขายที่สาขานั้นติดต่อกันอย่างน้อย 21 วัน (สาขาเปิดขายอย่างน้อย 14 วันในช่วงนั้น) แล้วกลับมาขายอีก · <b>เริ่มขาย</b> คือวันที่กลับมาขาย จำนวนจาน ต่อวัน และแนวโน้มนับจากวันนั้น · ย้ายกลับไปอยู่ในเมนูเดิมเมื่อครบ 28 วันนับจากวันที่กลับมาขาย · ชี้ที่ป้ายเพื่อดูวันที่ขายครั้งแรก</p><p><b>ต่อวัน</b> · จำนวนจานในช่วง หารด้วยจำนวนวันที่สาขาเปิดขาย นับตั้งแต่วันเริ่มของช่วงหรือวันเริ่มขาย (วันที่ช้ากว่า) · <b>ต่อ 100 ลูกค้า</b> · จำนวนจานเดียวกัน หารด้วยลูกค้าของวันเหล่านั้น × 100 (เมนูบุฟเฟ่ต์ใช้ลูกค้าบุฟเฟ่ต์ เมนูอื่นใช้ลูกค้าทั้งหมด)</p><p><b>แนวโน้ม</b> · จานต่อ 100 ลูกค้าใน 7 วันล่าสุด เทียบ 7 วันแรกที่เริ่มขาย ▲ สูงขึ้น ▼ ลดลง · แสดงเมื่อขายมาแล้วอย่างน้อย 14 วัน · สาขาที่ไม่มีจำนวนลูกค้าเทียบเป็นจานต่อวัน</p><p>ข้อมูลรายวันเริ่มวันที่ 22 มี.ค. 2569 เมนูที่ขายก่อนวันนั้นจะแสดงวันเริ่มขายเป็น 22 มี.ค. 2569 ซึ่งเป็นเมนูเดิมทั้งหมด</p></template>
