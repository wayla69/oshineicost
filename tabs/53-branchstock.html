  <!-- ── ตัดเบิก (ใบตัดเบิกประจำวัน, management 2026-10-09): used + wasted per item, confirmed once a day ── -->

    <div class="card p-3 mb-3">
      <div class="text-xs font-semibold mb-1" style="color:var(--text-primary)">ประวัติใบตัดเบิก</div>
      <div id="brnIssHistory" class="text-xs" style="color:var(--text-secondary)"></div>
    </div>
    <template id="hlp-branchstock-issue" data-title="วิธีใช้ใบตัดเบิก">      <p>กรอกเฉพาะรายการที่ใช้หรือทิ้งในวันนั้น · ช่องที่เว้นว่างถือว่าไม่ได้เบิก · รายการที่เบิกบ่อยใน 14 วันล่าสุดอยู่บนสุดของแต่ละโซน</p>
      <p>ตัวเลขเทาในช่อง เช่น “เมื่อวาน 3” คือจำนวนในใบตัดเบิกที่ยืนยันครั้งก่อน · ของเสียต้องเลือกสาเหตุ</p>
      <p>เครื่องหมาย ✓ ที่โซน = กรอกรายการที่ต้องนับของโซนนั้นครบทุกรายการ · ร่างบันทึกเองหลังพิมพ์ครบ 2–3 วินาที · ยืนยันแล้วแก้ไขไม่ได้ ต้องการแก้ แจ้งประสานงานขาย</p>
      
    </template>
  </div>

  <!-- ── สั่งสินค้า (the suggestion is net of the system stock after the issue slip; today's slip must be confirmed before sending) ── -->

    <div class="card p-3 mb-3">
      <div id="brnOrdDeliv" class="brn-delivlist"></div>
      <div id="brnOrdPages" class="flex flex-wrap gap-1 mt-2"></div>
      <div id="brnOrdHead" class="text-xs mt-2"></div>
      <div id="brnOrdBanner" class="mt-2" style="display:none"></div>
      <div id="brnOrdBuffer" class="mt-2" style="border-top:1px solid var(--border-soft);padding-top:8px"></div>
      <div class="flex flex-wrap items-center gap-3 mt-2 text-xs" style="color:var(--text-muted)">
        <label class="flex items-center gap-1"><input type="checkbox" id="brnOrdOnly" checked onchange="brnRenderOrder()"> เฉพาะรายการที่ต้องสั่ง</label>

    <div id="brnOrdGate" class="card p-3 mb-3" style="display:none"></div>
    <div id="brnOrdList" class="card p-3 mb-3"></div>
    <div class="card p-3 mb-3 brn-sticky-bottom" style="position:sticky;bottom:0;z-index:5">
      <div id="brnOrdActions" class="flex flex-wrap items-center gap-2"></div>
      <span id="brnOrdStatus" class="brn-status" role="status"></span>
    </div>
    <div id="brnOrdDetail" class="card p-3 mb-3" style="display:none"></div>
    <div class="card p-3 mb-3">
      <div class="text-xs font-semibold mb-1" style="color:var(--text-primary)">ใบสั่งซื้อล่าสุด</div>
      <div id="brnOrdHistory" class="text-xs" style="color:var(--text-secondary)"></div>
    </div>
    <template id="hlp-branchstock-order" data-title="วิธีใช้สั่งสินค้า">
      <p>ยอดแนะนำหักคงเหลือตามระบบหลังใบตัดเบิกแล้ว · ต้องยืนยันใบตัดเบิกของวันนี้ก่อนส่งใบสั่งซื้อ</p>
      <p>ส่งใบสั่งซื้อภายในเวลาตัดรอบของแต่ละรอบส่ง · ส่งหลังเวลาตัดรอบมีค่าปรับล่าช้า · แก้ไขได้จนกว่าคลังยืนยันยอดส่ง</p>
      <p>รายการที่สั่งต่างจากยอดแนะนำมากต้องเลือกเหตุผล · ถ้ายอดขายรอบนี้ต่างจากปกติ ใช้ “ยอดขายรอบนี้ต่างจากปกติ?” ปรับยอดแนะนำ</p>
    </template>
  </div>

  <!-- ── ตรวจนับสิ้นเดือน (ต้นงวด / ปลายงวด) ── -->
  <div id="brn-pane-count" style="display:none">

      </div>

    <div id="brnList" class="card p-3 mb-3"></div>

        <button onclick="brnSave(false)" class="brn-write" style="border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 14px;font-size:14px;cursor:pointer;background:transparent;color:var(--text-primary)">บันทึกร่าง</button>

        <button onclick="brnDiscard()" class="brn-write" style="border:0;background:none;color:var(--text-muted);font-size:12px;cursor:pointer">ล้างร่าง</button>

    <div id="brnNext"></div>
    <div class="card p-3 mb-3">
      <div class="text-xs font-semibold mb-1" style="color:var(--text-primary)">ประวัติการตรวจนับ</div>
      <div id="brnHistory" class="text-xs" style="color:var(--text-secondary)"></div>
    </div>
    <template id="hlp-branchstock-count" data-title="วิธีใช้ตรวจนับสิ้นเดือน">      <p><b>ตรวจนับสิ้นเดือน</b> — นับครบทุกรายการวันที่ 1 ของเดือน (หรือภายใน 2 วัน) ทีละโซน ตามหน่วยที่นับจริง (แพ็ค / ขวด / ถุง)</p>
      <p>ครั้งแรก = <b>ต้นงวด</b> ครั้งต่อไป = <b>ปลายงวด</b> · ต้องนับให้ครบทุกรายการก่อนกด “ส่งผลตรวจนับ” (ใส่ 0 ถ้าไม่มีของ ช่องว่างถือว่ายังไม่ได้นับ ปิดงวดสิ้นเดือนต้องนับ 100%) · เครื่องหมาย ✓ ที่โซน = นับครบทุกรายการของโซนนั้น · ตรวจนับหมุนเวียนกลุ่มมูลค่าสูง (ถ้าเปิดใช้) เป็นการตรวจเสริม ไม่ใช่การปิดงวด · เบิกใช้รายวันบันทึกในหน้า “ตัดเบิก”</p>
      
    </template>
  </div>

  <!-- ── รับของ ── -->
  <div id="brn-pane-recv" style="display:none">

        <label>วันที่รับ<br><input type="date" id="brnRecvDate" style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:6px 8px;font-size:14px;background:var(--bg-input);color:var(--text-primary)"></label>

               style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:6px 8px;font-size:14px;width:100%;background:var(--bg-input);color:var(--text-primary)"></label>
        <label>จำนวน<br><input id="brnRecvQty" inputmode="decimal" onkeydown="if(event.key==='Enter'){event.preventDefault();brnRecvAdd()}" style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:6px 8px;font-size:14px;width:80px;background:var(--bg-input);color:var(--text-primary)"></label>
        <span id="brnRecvUnit" style="padding-bottom:8px;color:var(--text-secondary)"></span>
        <label id="brnRecvPcsW" style="display:none">จำนวน<span id="brnRecvPcsU"></span> (ถ้านับ)<br><input id="brnRecvPcs" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();brnRecvAdd()}" style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:6px 8px;font-size:14px;width:80px;background:var(--bg-input);color:var(--text-primary)"></label>
        <button onclick="brnRecvAdd()" style="border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 12px;font-size:13px;cursor:pointer;background:transparent;color:var(--text-primary)">+ เพิ่ม</button>
      </div>
      <datalist id="brnItemList"></datalist>
      <div id="brnRecvLines" class="text-sm mt-2"></div>
      <div class="flex flex-wrap items-center gap-2 mt-2">
        <button onclick="brnRecvSave()" class="brn-write" style="background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--r-sm);padding:8px 16px;font-size:14px;cursor:pointer">บันทึกรับสินค้า</button>
        <span id="brnRecvStatus" class="text-xs"></span>
      </div>
    </div>
    <!-- ── แจ้งเคลมสินค้า (owner 2026-10-08, 2026-10-09): goods that arrived damaged or wrong, claimed with a reason
         (photos go to ประสานงานขาย by LINE); the receive form above raises the claim for a shortfall itself.

    <template id="hlp-branchstock-recv" data-title="วิธีใช้รับสินค้า">      <p>ใบสั่งซื้อที่คลังจัดส่งแล้ว: ตอบ “รับครบ” หากได้รับตามที่คลังส่งทุกรายการ · หากรายการใดไม่ครบ ตอบ “มีรายการไม่ครบ” แล้วเลือกรายการนั้น ใส่ “รับจริง” และเลือกสาเหตุ ส่วนต่างเป็นเคลมอัตโนมัติ ส่งรูปทางไลน์ให้ประสานงานขาย</p>
      <p>บันทึกสินค้าที่รับเอง: บันทึกทุกครั้งที่รับสินค้า รวมที่สาขาซื้อเอง · ไม่บันทึกจะแสดงเป็น “ใช้น้อยกว่าสูตร”</p>
      <p>แจ้งเคลมภายหลัง: เลือกใบที่รับแล้ว ค้นหาและเลือกเฉพาะรายการที่มีปัญหา ใส่จำนวน (ไม่เกินจำนวนที่รับ) และเลือกสาเหตุ</p>
