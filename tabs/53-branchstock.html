    <template id="hlp-branchstock-issue" data-title="วิธีใช้ใบตัดเบิก">      <p>กรอกเฉพาะของที่ใช้หรือทิ้งในวันนั้น · ช่องที่เว้นว่างถือว่าไม่ได้เบิก · ของที่เบิกบ่อยใน 14 วันล่าสุดอยู่บนสุดของแต่ละโซน</p>
      <p>ตัวเลขเทาในช่อง เช่น “เมื่อวาน 3” คือจำนวนในใบตัดเบิกที่ส่งครั้งก่อน · ของเสียต้องเลือกสาเหตุ</p>
      <p>เฉลี่ยวันเดียวกัน = ค่าเฉลี่ยของวันเดียวกันในสัปดาห์ ย้อนหลัง [[HW]] สัปดาห์</p>
      <p>เครื่องหมาย ✓ ที่โซน = กรอกของที่ต้องนับในโซนนั้นครบทุกรายการ · บันทึกไว้ก่อนให้เองหลังพิมพ์ครบ 2–3 วินาที · ส่งใบแล้วแก้ไขไม่ได้ ต้องการแก้ แจ้งประสานงานขาย</p>
      
    </template>

      <div id="brnOrdHistory" class="text-xs" style="color:var(--text-secondary)"></div>

    <template id="hlp-branchstock-order" data-title="วิธีใช้สั่งของ">
      <p>จำนวนที่ควรสั่งคิดจากของที่ควรเหลือ (ตามระบบ) หลังหักใบตัดเบิกแล้ว · ต้องส่งใบตัดเบิกของวันนี้ก่อนส่งใบสั่งซื้อ</p>
      <p>ส่งใบสั่งซื้อภายในเวลาส่งสุดท้ายของแต่ละรอบส่งของ · ส่งช้ากว่าเวลามีค่าปรับ · แก้ไขได้จนกว่าคลังบันทึกจำนวนที่ส่ง</p>
      <p>ถ้าสั่งต่างจากจำนวนที่ควรสั่งมาก ต้องเลือกเหตุผล · ถ้ายอดขายรอบนี้จะต่างจากปกติ ใช้ “ยอดขายรอบนี้ต่างจากปกติ?” ปรับจำนวนที่ควรสั่ง</p>
    </template>

  <!-- ── นับของสิ้นเดือน (นับครั้งแรก / นับสิ้นเดือน) ── -->

      <p>ครั้งแรกเรียก <b>นับครั้งแรก</b> ครั้งต่อไปเรียก <b>นับสิ้นเดือน</b> · ต้องนับให้ครบทุกรายการก่อนกด “ส่งผลนับ” (ใส่ 0 ถ้าไม่มีของ ช่องว่างถือว่ายังไม่ได้นับ ปิดเดือนต้องนับครบ 100%) · เครื่องหมาย ✓ ที่โซน = นับครบทุกรายการของโซนนั้น · นับเสริมรายสัปดาห์เฉพาะของแพง (ถ้าเปิดใช้) เป็นการนับเพิ่ม ไม่ใช่การปิดเดือน · ของที่ใช้แต่ละวันบันทึกในหน้า “ตัดเบิก”</p>

  <!-- ── รับของ ── -->

    <!-- ── แจ้งของขาด/เสีย (owner 2026-10-08, 2026-10-09): goods that arrived damaged or wrong, claimed with a reason
         (photos go to ประสานงานขาย by LINE); the receive form above raises the claim for a shortfall itself.

      <div id="brnClaimMsg" class="text-xs mb-1"></div>
      <div id="brnClaimList" class="text-xs" style="color:var(--text-secondary)"></div>
      <div id="brnClaimForm" class="mt-2" style="display:none"></div>

    <div class="card p-3 mb-3">

      <summary class="text-sm font-semibold" style="color:var(--text-primary);cursor:pointer;min-height:32px">บันทึกของที่รับเอง</summary>
      <div class="flex flex-wrap items-end gap-2 mt-2 text-xs" style="color:var(--text-muted)">
        <label>วันที่รับ<br><input type="date" id="brnRecvDate" style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:6px 8px;font-size:14px;background:var(--bg-input);color:var(--text-primary)"></label>
        <label>เลขที่ใบส่งของ (ถ้ามี)<br><input id="brnRecvRef" style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:6px 8px;font-size:14px;width:130px;background:var(--bg-input);color:var(--text-primary)"></label>

        <label style="flex:1 1 200px">วัตถุดิบ<br><input id="brnRecvItem" list="brnItemList" placeholder="พิมพ์ชื่อหรือรหัส" onchange="brnRecvPicked()"

        <label>จำนวน<br><input id="brnRecvQty" inputmode="decimal" onkeydown="if(event.key==='Enter'){event.preventDefault();brnRecvAdd()}" style="border:1px solid var(--border-control);border-radius:var(--r-sm);padding:6px 8px;font-size:14px;width:80px;background:var(--bg-input);color:var(--text-primary)"></label>
        <span id="brnRecvUnit" style="padding-bottom:8px;color:var(--text-secondary)"></span>
