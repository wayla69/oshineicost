    .mab-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }

    .mab-bk-eat { --mab-c: var(--bad-ink); --mab-ink: var(--bad-ink); }

    .mab-more { position: relative; margin: 2px 8px 10px; padding: 6px 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-input); color: var(--accent); cursor: pointer; }
    .mab-empty { font-size: 13px; color: var(--text-secondary); padding: 10px 6px; }

    .mab-sec-t { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .mab-sec-s { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .mab-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }

    .mab-tbl td { padding: 6px 8px; border-top: 1px solid var(--border); color: var(--text-primary); vertical-align: top; font-variant-numeric: tabular-nums; }
    .mab-tbl .mab-num { text-align: right; white-space: nowrap; }
    .mab-tbl .mab-v { font-weight: 700; font-size: 14px; }
    .mab-sub { font-size: 12px; color: var(--text-secondary); }
    .mab-wrap { overflow-x: auto; }
    .mab-unc summary { cursor: pointer; font-size: 14px; font-weight: 700; color: var(--text-primary); padding: 4px 0; }

    .mab-unc-row span:last-child { color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }
    @media (max-width: 700px) {
      .mab-board { grid-template-columns: 1fr; }

      body.ph-on .mab-more::after { content: ''; position: absolute; left: 0; right: 0; top: -6px; bottom: -6px; }
