<div id="tab-launcher" style="display:none">

  <!-- หน้าแรก (PR-D1, 2026-10-21): the department launcher. The greeting and today's tasks on top, then one card per department
       with an icon tile for each of its pages. Drawn by js/18-launcher.js from DEPARTMENTS (js/01-core.js); the tasks are the
       ones of หน้างาน (GET /api/bom-center/todo), nothing new on the server. The first-login start card, when it shows, is
       inserted above this block by showStartCard (js/01-core.js). -->
  <style>
    #tab-launcher .lnch { max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    #tab-launcher .lnch-top { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
    #tab-launcher .lnch-hello { flex: 1 1 340px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
    #tab-launcher .lnch-date { font-size: 14px; color: var(--text-secondary); }
    #tab-launcher .lnch-greet { margin: 0; font-size: 28px; line-height: 1.3; font-weight: 700; color: var(--accent); overflow-wrap: anywhere; }
    #tab-launcher .lnch-lead { font-size: 15px; color: var(--text-secondary); }
    #tab-launcher .lnch-tasks { flex: 2 1 520px; min-width: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg);
      box-shadow: var(--shadow-card); padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
    #tab-launcher .lnch-tasks-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding-bottom: 6px; }
    #tab-launcher .lnch-tasks-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    #tab-launcher .lnch-all { margin-left: auto; display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; color: var(--accent); }
    /* PR-TF: the three task tabs under the title; each carries its count */
    #tab-launcher .lnch-tabs { order: 3; flex: 1 0 100%; display: flex; flex-wrap: wrap; gap: 6px; }
    #tab-launcher .lnch-tab { flex: 1 1 96px; min-height: 44px; padding: 0 8px; border: 1px solid var(--border-control); border-radius: var(--r-sm); background: transparent;
      color: var(--text-primary); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    #tab-launcher .lnch-tab:hover { background: var(--bg-hover); }
    #tab-launcher .lnch-tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    #tab-launcher .lnch-tab-n { font-weight: 500; }
    #tab-launcher .lnch-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 0; border-top: 1px solid var(--border-soft); }
    #tab-launcher .lnch-dot { width: 10px; height: 10px; border-radius: 999px; flex: 0 0 auto; background: var(--amber-ink); }
    #tab-launcher .lnch-dot.is-urgent { background: var(--bad-ink); }
    #tab-launcher .lnch-dot.is-review { background: var(--amber-ink); }
    #tab-launcher .lnch-dot.is-done { background: var(--good-ink); }
    #tab-launcher .lnch-row-title { flex: 1; min-width: 0; font-size: 15px; color: var(--text-primary); overflow-wrap: anywhere; }
    #tab-launcher .lnch-row-dept { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
    #tab-launcher .lnch-go { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px; border: 1px solid var(--border-control);
      border-radius: var(--r-sm); background: transparent; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; }
    #tab-launcher .lnch-go:hover { background: var(--bg-hover); }
    #tab-launcher .lnch-empty { padding: 10px 0 4px; font-size: 14px; color: var(--text-secondary); border-top: 1px solid var(--border-soft); }
    #tab-launcher .lnch-sec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 12px; }
    #tab-launcher .lnch-sec-head h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--accent); }
    #tab-launcher .lnch-hint { font-size: 14px; color: var(--text-secondary); }
    #tab-launcher .lnch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 16px; align-items: start; }
    #tab-launcher .lnch-dept { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-card);
      overflow: hidden; display: flex; flex-direction: column; scroll-margin-top: 12px; }
    #tab-launcher .lnch-dept.is-focus { outline: 3px solid var(--dk); outline-offset: 2px; }
    #tab-launcher .lnch-dept-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--dt); border-bottom: 1px solid var(--border-soft); }
    #tab-launcher .lnch-badge { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--bg-card); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; color: var(--dk); }
    #tab-launcher .lnch-dept-name { margin: 0; font-size: 17px; font-weight: 700; color: var(--text-primary); }
    #tab-launcher .lnch-dept-duty { font-size: 13px; color: var(--text-secondary); }
    #tab-launcher .lnch-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px; }
    #tab-launcher .lnch-tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; padding: 12px 6px 10px; min-height: 84px; box-sizing: border-box;
      border: 1px solid var(--border-soft); border-radius: var(--r-md); text-decoration: none; color: var(--text-primary); background: transparent; }
    #tab-launcher .lnch-tile:hover { border-color: var(--border-control); background: var(--bg-subtle); }
    #tab-launcher .lnch-tile svg { color: var(--dk); flex: 0 0 auto; }
    #tab-launcher .lnch-tile-label { font-size: 13px; line-height: 1.3; text-align: center; font-weight: 500; overflow-wrap: anywhere; }
    #tab-launcher :is(.lnch-tile, .lnch-go, .lnch-all, .lnch-tab, .lnch-foot a):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #tab-launcher .lnch-foot { display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    #tab-launcher .lnch-foot a { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); }
    @media (max-width: 900px) { #tab-launcher .lnch-tiles { gap: 6px; padding: 10px; } }
  </style>
  <div class="lnch">
    <section class="lnch-top" aria-label="สรุปของวันนี้">
      <div class="lnch-hello">
        <span id="lnchDate" class="lnch-date"></span>
        <p id="lnchGreet" class="lnch-greet">สวัสดี</p>
        <span class="lnch-lead">เลือกงานจากไอคอนของแผนก หรือเริ่มจากงานที่ค้างด้านขวา</span>
      </div>
      <div class="lnch-tasks" id="lnchTasks" aria-live="polite">
        <div class="lnch-tasks-head">
          <span class="lnch-tasks-title">งานของฉันวันนี้</span>
          <a id="lnchTaskAll" href="#" class="lnch-all" style="display:none" onclick="lnchTasksAll();return false">ดูทั้งหมด</a>
          <div id="lnchTaskTabs" class="lnch-tabs" role="group" aria-label="กรองงานตามสถานะ" style="display:none"></div>
        </div>
        <div id="lnchTaskRows"><div class="lnch-empty">กำลังโหลด…</div></div>
      </div>
    </section>

    <section aria-labelledby="lnchDeptTitle">
      <div class="lnch-sec-head">
        <h2 id="lnchDeptTitle">แผนก</h2>
        <span id="lnchDeptHint" class="lnch-hint"></span>
      </div>
      <div id="lnchDepts" class="lnch-grid"></div>
    </section>

    <footer class="lnch-foot" id="lnchFoot"></footer>
  </div>
</div>
