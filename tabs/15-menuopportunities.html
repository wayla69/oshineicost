  <style>
    .opp-status { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
    .opp-ans { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-card); }
    .opp-ans-l { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 13px; color: var(--text-secondary); }
    .opp-ans-v { font-size: 18px; font-weight: 800; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .opp-sec { margin-top: 14px; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-card); }
    .opp-sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 8px; }
    .opp-sec-t { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .opp-sec-s { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .opp-wrap { overflow-x: auto; }
    .opp-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .opp-tbl th { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .opp-tbl td { padding: 6px 8px; border-top: 1px solid var(--border); color: var(--text-primary); vertical-align: top; font-variant-numeric: tabular-nums; }
    .opp-tbl .opp-num { text-align: right; white-space: nowrap; }
    .opp-v { font-weight: 800; font-size: 15px; }
    .opp-bad { color: var(--bad-ink); }
    .opp-good { color: var(--good-ink); }
    .opp-name { font-weight: 700; }
    .opp-sub { font-size: 12px; line-height: 1.5; color: var(--text-secondary); margin-top: 2px; }
    .opp-more { position: relative; margin-top: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--bg-input); color: var(--accent); cursor: pointer; }
    .opp-empty { font-size: 13px; color: var(--text-secondary); padding: 10px 0; }
    .opp-fold summary { cursor: pointer; font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .opp-pill { display: inline-block; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; font-weight: 600; background: var(--bg-subtle); }
    @media (max-width: 700px) {
      body.ph-on .opp-more { min-height: 0; }
      body.ph-on .opp-more::after { content: ''; position: absolute; left: 0; right: 0; top: -6px; bottom: -6px; }
    }

  <div class="card p-4 mb-3">
    <h2 class="text-base font-bold mb-2" style="color:var(--amber-ink)">โอกาสเมนู <button type="button" class="ui-q" aria-label="คำอธิบาย" aria-haspopup="dialog" data-help="hlp-menuopportunities-1" title="คำอธิบาย">?</button></h2>
    <template id="hlp-menuopportunities-1" data-title="โอกาสเมนู"><p>บุฟเฟ่ต์: ลูกค้ากินมากขึ้นหมายถึงต้นทุนสูงขึ้น โอกาสของบุฟเฟ่ต์จึงเป็นการลดส่วนที่สาขากินเกินสาขาอื่น · à la carte: ลูกค้าจ่ายรายจาน โอกาสจึงเป็นรายได้ที่เพิ่มได้</p><p>ทุกตารางตามช่วงเวลาและสาขาที่เลือกด้านบน แสดงก่อนเฉพาะรายการที่ถึงเกณฑ์ (0.1% ของต้นทุนอาหารหรือรายได้ อย่างน้อย ฿1,000)</p></template>
    <div id="oppStatus" class="opp-status"></div>
    <div id="oppAnswer"></div>

  <div class="opp-sec">
    <div class="opp-sec-h"><span class="opp-sec-t">บุฟเฟ่ต์ · สาขาที่กินต่อหัวเกินสาขาอื่น</span><span id="oppOverSum" class="opp-sec-s"></span> <button type="button" class="ui-q" aria-label="คำอธิบาย" aria-haspopup="dialog" data-help="hlp-menuopportunities-2" title="คำอธิบาย">?</button></div>
    <template id="hlp-menuopportunities-2" data-title="บุฟเฟ่ต์ · สาขาที่กินต่อหัวเกินสาขาอื่น"><p>ค่ากลาง = ค่ามัธยฐานของจานต่อลูกค้าในระดับราคาเดียวกันของสาขาที่ขายเมนูนั้น (อย่างน้อย 5 สาขา) สาขาที่กินตั้งแต่ 1.2 เท่าของค่ากลางขึ้นไปถูกนับ</p><p>จานที่เกิน = จานจริง − จานตามค่ากลาง · ลดได้ = จานที่เกิน × ต้นทุนต่อจานของสาขา</p><p>ช่วงที่ยาวกว่า 92 วัน หรือช่วงที่ยังไม่มีข้อมูลแยกระดับราคา เทียบต่อลูกค้าทั้งหมดของสาขา</p></template>
    <div id="oppOver" class="opp-wrap"></div>
  </div>

  <div class="opp-sec">
    <div class="opp-sec-h"><span class="opp-sec-t">à la carte · เมนูที่สาขาขายน้อยกว่าสาขาอื่น</span><span id="oppGapSum" class="opp-sec-s"></span> <button type="button" class="ui-q" aria-label="คำอธิบาย" aria-haspopup="dialog" data-help="hlp-menuopportunities-3" title="คำอธิบาย">?</button></div>
    <template id="hlp-menuopportunities-3" data-title="à la carte · เมนูที่สาขาขายน้อยกว่าสาขาอื่น"><p>เมนูที่ขายอย่างน้อย 5 สาขา สาขาที่ขายต่อลูกค้าต่ำกว่า 0.4 เท่าของค่ากลาง (หรือยังไม่ขาย) ถูกนับ</p><p>รายได้ที่เพิ่มได้ = (ค่ากลาง − ที่ขายจริง) × ลูกค้าของสาขา × ราคาเฉลี่ยต่อจาน (ไม่รวม VAT)</p></template>
