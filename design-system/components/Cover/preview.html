<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oshinei</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-page); color:var(--text-primary); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .navy { fill:var(--navy); }
  .blue { fill:var(--chart-1); }
  .soft { fill:var(--accent-soft); }
  .amber { fill:var(--chart-3); }
  .blk { rx:var(--r-md); }
  .rule { stroke:var(--text-secondary); stroke-width:1; }
  .rule.strong { stroke:var(--text-primary); }
  .words { position:absolute; left:32px; bottom:32px; max-width:440px; }
  .name { margin:0; font-size:96px; line-height:.92; font-weight:700; letter-spacing:-.01em; color:var(--text-primary); }
  .tag { margin:12px 0 0 4px; font-size:14px; line-height:20px; color:var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      navy 128x264 slab bled off the top (the deck and rail colour, the brand's own) · chart-1 blue 160x160 · accent-soft 160x208 bleeding off the right edge · chart-3 amber 64x32 once (the one warm note, like a KPI rule) — about a third of 960x288
  arrangement one tall navy slab with satellites, square-cornered, bottoms on the ledger's base rule at y=256, space-4 (16px) gutters
  pattern     ledger rules, from "borders, not shadows / ruled like a financial statement": three 1px text-secondary rules and one text-primary base rule crossing every block, like a statement's row lines
  scales      sides in space-4 multiples; gutters space-4; rule pitch 32 (2 × space-4); corners r-md (4px) on every block
-->
<rect class="navy blk" x="16" y="-8" width="128" height="264" rx="4"/>
<rect class="amber blk" x="160" y="48" width="64" height="32" rx="4"/>
<rect class="blue blk" x="160" y="96" width="160" height="160" rx="4"/>
<rect class="soft blk" x="336" y="48" width="160" height="208" rx="4"/>
<line class="rule" x1="0" y1="160.5" x2="480" y2="160.5"/>
<line class="rule" x1="0" y1="192.5" x2="480" y2="192.5"/>
<line class="rule" x1="0" y1="224.5" x2="480" y2="224.5"/>
<line class="rule strong" x1="0" y1="256.5" x2="480" y2="256.5"/>
</svg>
</div>
<div class="words">
<h1 class="name">Oshinei</h1>
<p class="tag">Sales &amp; Cost Analysis for a Thai buffet chain.</p>
</div>
</div>
</body>
</html>
